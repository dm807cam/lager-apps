<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch-Dino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#8fd96b;--ink:#1f2a1c;--card:#fff;--go:#2fbf5b;--coral:#ff7a45;--sky:#2f80ed;--soft:#fff4c2;--gold:#ffcc33;--kh:clamp(52px,8vh,74px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.4 "Baloo 2",ui-rounded,"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;padding:env(safe-area-inset-top,0) max(10px,env(safe-area-inset-right,0)) env(safe-area-inset-bottom,0) max(10px,env(safe-area-inset-left,0))}
.top{display:flex;align-items:center;gap:8px;padding:8px 0}
.lvl{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--coral);color:#fff;font-weight:800;font-size:22px;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center}
.xpw{flex:1;display:flex;flex-direction:column;gap:2px}
.ttl{font-weight:800;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpb{height:12px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff7a45);transition:width .5s}
.pill{flex:none;display:flex;align-items:center;gap:4px;height:38px;padding:0 10px;border:3px solid var(--ink);border-radius:20px;background:#fff;font-weight:800;font-size:17px;white-space:nowrap}
.pill.fire{background:#ffe1d6}
.pill.fire.hot{background:#ff9a3c;color:#fff}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a6,var(--gold) 55%,#d99a00);border:2px solid #8a5a00;flex:none}
.ring{width:22px;height:22px;flex:none}
.menu{flex:none;width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-size:22px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
main{flex:1;min-height:0;display:grid;grid-template-rows:minmax(150px,1fr) auto auto;gap:10px;padding-bottom:10px}
.arena{position:relative;border:4px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 5px 0 var(--ink);background:#9fe0ff}
.arena>svg.scene{position:absolute;inset:0;width:100%;height:100%}
.wtag{position:absolute;left:10px;top:10px;max-width:44%;background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:14px;padding:2px 10px 3px;font-weight:800;font-size:15px;line-height:1.2}
.wtag small{display:block;font-size:13px;font-weight:700;opacity:.8;white-space:nowrap}
.mhud{position:absolute;right:10px;top:10px;width:min(50%,300px);background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:14px;padding:3px 10px 6px}
.mname{font-weight:800;font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp{height:20px;border:3px solid var(--ink);border-radius:9px;background:#f3ead8;overflow:hidden;position:relative}
.hp i{display:block;height:100%;background:linear-gradient(#ffe7a8,#e8b64c);transition:width .35s}
.hp b{position:absolute;inset:0;font-size:13px;line-height:14px;text-align:center}
.buddy{position:absolute;left:3%;bottom:3%;height:66%;aspect-ratio:1;max-width:46%}
.buddy svg{width:100%;height:100%;display:block;overflow:visible}
.hat{position:absolute;transform:translate(-50%,-80%);font-size:clamp(22px,5vh,46px);line-height:1;pointer-events:none}
.hat.eye{transform:translate(-50%,-50%);font-size:clamp(14px,3vh,26px)}
.nest{position:absolute;right:4%;bottom:2%;height:64%;aspect-ratio:1;max-width:46%}
.nest svg{width:100%;height:100%;display:block;overflow:visible}
.bubble{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-weight:800;font-size:clamp(28px,5.5vh,48px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;text-shadow:0 4px 0 var(--ink);white-space:nowrap;pointer-events:none;opacity:0;z-index:4}
.bubble.show{animation:pop 1s ease-out forwards}
.fly{position:absolute;font-size:30px;pointer-events:none;z-index:3}
.card{background:var(--card);border:4px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:8px 12px 10px}
.card.good{background:#ddffe6}
.card.bad{animation:shake .4s}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:800;background:var(--soft);border:2px solid var(--ink);border-radius:10px;padding:0 8px;line-height:1.6}
.chip.again{background:#ffd6f0}
.stinfo{margin-left:auto;font-size:13px;font-weight:700;opacity:.75}
.say{width:44px;height:36px;border-radius:12px;border:3px solid var(--ink);background:#fff;font-size:18px;display:grid;place-items:center;padding:0}
.q{text-align:center;font-weight:800;font-size:clamp(20px,3.4vh,28px);line-height:1.3;padding:4px 0;overflow-wrap:anywhere}
.q .pic{display:block;font-size:clamp(44px,8vh,72px);line-height:1.1}
.q .big{display:block;font-size:clamp(30px,5.6vh,48px);line-height:1.2;margin-top:2px}
.q mark{background:#ffe066;border-radius:6px;padding:0 4px;text-decoration:underline 3px;text-underline-offset:4px}
.slot{display:inline-block;min-width:1.3em;padding:0 .2em;border:3px dashed var(--sky);border-radius:10px;color:var(--sky);line-height:1.15;text-align:center}
.slot.ok{border-style:solid;border-color:var(--go);color:#14833f;background:#eafff1}
.slot.no{border-style:solid;border-color:var(--coral);color:#c0392b;background:#fff0ee}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:6px}
.letters span{width:clamp(30px,5vh,42px);height:clamp(38px,6vh,50px);border-bottom:4px solid var(--ink);font-size:clamp(24px,4.4vh,36px);font-weight:800;display:grid;place-items:center}
.letters span.on{color:#14833f}
.fb{min-height:1.4em;text-align:center;font-weight:700;font-size:16px}
.fb.bad{color:#c0392b}
.ctrl{display:grid;min-height:calc(var(--kh)*2 + 14px)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(var(--kh),auto);gap:10px;padding-bottom:4px}
.choices.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices.long{grid-template-columns:minmax(0,1fr)}
.key{min-height:var(--kh);border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);font-size:clamp(22px,3.8vh,32px);font-weight:800;line-height:1.15;padding:4px 8px}
.long .key{font-size:clamp(17px,2.6vh,21px);text-align:left;padding:8px 14px;font-weight:700}
.emo .key{font-size:clamp(38px,7vh,60px)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.key.wrong{background:#ffd0c4;opacity:.55}
.key.right{background:var(--go);color:#fff}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-content:start}
.tile{width:clamp(48px,7.6vh,64px);height:clamp(52px,8vh,68px);border:3px solid var(--ink);border-radius:14px;background:#fff8dc;box-shadow:0 4px 0 var(--ink);font-size:clamp(26px,4.6vh,36px);font-weight:800}
.tile.used{visibility:hidden}
.tile.err{background:#ffd0c4;animation:shake .35s}
.bigbtn{min-height:clamp(64px,10vh,90px);border:3px solid var(--ink);border-radius:20px;background:var(--sky);color:#fff;font-size:28px;font-weight:800;box-shadow:0 5px 0 var(--ink);width:100%}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.bigbtn.go{background:var(--go)}
.bigbtn.coral{background:var(--coral)}
#weiter{height:calc(100% - 5px);font-size:clamp(28px,5vh,44px)}
[hidden]{display:none!important}
@media (min-width:860px) and (min-aspect-ratio:1/1){
main{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.arena{grid-row:1/3;min-height:420px}
.card{display:flex;flex-direction:column}
.card .q{flex:1;display:flex;flex-direction:column;justify-content:center}
.q{font-size:clamp(24px,3.6vh,32px)}
.ctrl{align-self:start}
}
@media (max-width:420px){.ttl{font-size:13px}.pill{padding:0 7px;font-size:15px;height:34px;gap:3px}.lvl{width:40px;height:40px;font-size:19px}.menu{width:40px;height:40px}#dayP b{display:none}}
.ov{position:fixed;inset:0;background:rgba(31,42,28,.62);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.sheet{background:#fff;border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);width:min(560px,100%);max-height:92%;overflow:auto;padding:16px 16px 18px;position:relative}
.sheet h2{margin:0 0 6px;font-size:32px;line-height:1.05}
.sheet p{margin:4px 0 10px}
.x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.item{border:3px solid var(--ink);border-radius:18px;background:var(--soft);padding:6px 4px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.item .e{font-size:44px;line-height:1.1}
.item .n{font-weight:800;font-size:14px;line-height:1.15}
.item small{font-size:13px;line-height:1.2}
.item button{margin-top:4px;min-height:36px;width:100%;border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px}
.item.sel{background:#ddffe6}
.item.locked{opacity:.6}
.item svg{width:80px;height:80px}
.item.r1{border-color:#2f80ed}
.item.r2{border-color:#8b5cf6;background:#f1eaff}
.item.r3{border-color:#e07000;background:linear-gradient(#fff7cf,#ffd98a)}
.item.sil{background:#f2f2f2;border-style:dashed}
.item.sil svg{filter:brightness(0);opacity:.18}
.rar{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:0 6px;margin-left:6px;color:#fff;line-height:1.5;vertical-align:2px}
.rar.r0{background:#8a8f98}.rar.r1{background:#2f80ed}.rar.r2{background:#8b5cf6}.rar.r3{background:#ff7a00}.rar.new{background:#ff3d7f}
.tabs{display:flex;gap:8px;margin:6px 0 12px}
.tabs button{flex:1;min-height:44px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:800}
.tabs button.on{background:var(--ink);color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.mgrid button{min-height:84px;border:3px solid var(--ink);border-radius:18px;background:var(--soft);box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:18px;line-height:1.2}
.mgrid button span{display:block;font-size:30px}
.badge{display:flex;align-items:center;gap:10px;padding:8px 10px;border:3px solid var(--ink);border-radius:16px;margin-bottom:8px;background:#fff}
.badge .e{font-size:32px;flex:none;width:44px;text-align:center}
.badge.off{opacity:.45;filter:grayscale(1)}
.badge b{display:block;line-height:1.1}
.badge small{font-size:14px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 8px;font-size:20px;font-weight:800}
.sec small{font-size:15px;font-weight:700}
.prog{height:14px;border:3px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2fbf5b,#ff7a00)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.seg button{min-width:48px;min-height:44px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;font-size:18px}
.seg button.on{background:var(--sky);color:#fff}
label.l{font-weight:800;display:block;margin-top:8px}
input.t{font:inherit;font-size:20px;font-weight:700;width:100%;padding:8px 12px;border:3px solid var(--ink);border-radius:14px;min-height:50px}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:4px 6px;border-bottom:2px solid #eee;text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:10px;border-radius:6px;background:#eee;overflow:hidden;min-width:50px}
.meter i{display:block;height:100%;background:var(--go)}
.center{text-align:center}
.reveal{width:min(190px,48vw);display:block;margin:0 auto}
.start-dino{width:min(190px,46vw);display:block;margin:0 auto}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:8px 16px;border-radius:18px;z-index:30;max-width:calc(100% - 24px);text-align:center;animation:drop .3s ease-out}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.buddy .body{transform-origin:100px 190px;animation:breathe 2.6s ease-in-out infinite}
.buddy.cheer .body{animation:hop .45s}
.nest .egg{transform-origin:100px 175px}
.nest.hit .egg{animation:wob .45s}
.nest.laugh .egg{animation:wiggle .6s}
.nest.gone .egg{animation:gone .6s forwards}
.nest.enter .egg{animation:enter .5s ease-out}
@keyframes breathe{50%{transform:scale(1.02,.98)}}
@keyframes hop{40%{transform:translateY(-16px)}}
@keyframes wob{25%{transform:rotate(-9deg)}60%{transform:rotate(7deg)}85%{transform:rotate(-3deg)}}
@keyframes wiggle{20%{transform:translateY(-10px)}40%{transform:translateY(0)}60%{transform:translateY(-6px)}}
@keyframes gone{to{transform:scale(1.3);opacity:0}}
@keyframes enter{from{transform:translateY(-120%)}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
@media (prefers-reduced-motion:reduce){.buddy .body,.nest .egg{animation:none!important}.bubble.show{animation-duration:1.4s}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="lvl" id="lvlBtn" aria-label="Level"><span id="lvlN">1</span></button>
    <div class="xpw"><div class="ttl" id="lvlT">Ei-Entdecker</div><div class="xpb"><i id="xpF"></i></div></div>
    <div class="pill" title="Münzen"><span class="coin"></span><b id="coinN">0</b></div>
    <div class="pill fire" id="comboP" title="Richtig in Folge">🔥<b id="comboN">0</b></div>
    <div class="pill" id="dayP" title="Tagesziel"><svg class="ring" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="none" stroke="#eee" stroke-width="5"/><circle id="dayRing" cx="11" cy="11" r="8" fill="none" stroke="#2fbf5b" stroke-width="5" stroke-dasharray="0 60" transform="rotate(-90 11 11)" stroke-linecap="round"/></svg><b id="dayN">0/25</b></div>
    <button class="menu" id="menuBtn" aria-label="Menü">☰</button>
  </header>
  <main>
    <section class="arena" id="arena">
      <svg class="scene" id="scene" viewBox="0 0 800 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
      <div class="wtag" id="wtag">Farnwald</div>
      <div class="mhud"><div class="mname" id="mname">Dino-Ei</div><div class="hp"><i id="hpF" style="width:100%"></i><b id="hpT"></b></div></div>
      <div class="buddy" id="buddy"></div>
      <div class="nest" id="nest"></div>
      <div class="bubble" id="bubble"></div>
    </section>
    <section class="card" id="card">
      <div class="crow"><span class="chip" id="topic">Anlaute</span><span class="chip again" id="again" hidden>Nochmal!</span><span class="stinfo" id="stinfo">Klasse 1 · Stufe 1</span><button class="say" id="say" aria-label="Aufgabe vorlesen">🔊</button></div>
      <div class="q" id="q"></div>
      <div class="fb" id="fb"></div>
    </section>
    <section class="ctrl">
      <div class="choices" id="choices"></div>
      <div class="tiles" id="tiles" hidden></div>
      <button class="bigbtn go" id="weiter" hidden>Weiter ➜</button>
    </section>
  </main>
</div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
<canvas id="fx"></canvas>
<script>
{
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickN=(arr,n)=>shuffle(arr.slice()).slice(0,n);
const rng=seed=>{let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lc=s=>s.toLowerCase();

/* ---------- word data ---------- */

const T=(q,a,ch,topic,x={})=>Object.assign({q,a,ch:shuffle([...new Set(ch)]),topic},x);
const umlaut=w=>{const m=w.match(/^(.*)(au|a|o|u)([^aeiouäöü]*)$/i);if(!m)return w;const map={au:'äu',a:'ä',o:'ö',u:'ü',Au:'Äu',A:'Ä',O:'Ö',U:'Ü'};return m[1]+(map[m[2]]||m[2])+m[3]};
const nouns=f=>N.filter(f||(()=>true));
const anlaut=()=>{const n=P(nouns(x=>simpleStart(x[0])&&x[0].length<=7)),L=n[0][0];return T(`Welcher Buchstabe fehlt?<span class="pic">${n[3]}</span><span class="big">□${esc(n[0].slice(1))}</span>`,L,[L,...pickN('ABDEFGHIKLMNOPRTWZ'.split('').filter(c=>c!==L),2)],'Anlaute',{say:`${n[0]}. Mit welchem Buchstaben beginnt ${n[0]}?`,h:`${n[0]} beginnt mit ${L}.`,raw:1})};
const bildAnlaut=()=>{const n=P(nouns(x=>simpleStart(x[0]))),L=n[0][0],others=pickN(nouns(x=>x[0][0]!==L),2);return T(`Welches Bild beginnt mit <span class="big">${L}</span>`,n[3],[n[3],...others.map(o=>o[3])],'Anlaute',{emo:1,raw:1,say:`Welches Bild beginnt mit ${L}?`,h:`${n[0]} beginnt mit ${L}.`})};
const kleinBuchst=()=>{const k=P(Object.keys(CONF)),L=k.toUpperCase();return T(`Welcher kleine Buchstabe gehört zu<span class="big">${L}</span>`,k,[k,...CONF[k]],'Buchstaben',{raw:1,say:`Welcher kleine Buchstabe gehört zum großen ${L}?`,h:`Groß ${L}, klein ${k}.`})};
const wortBild=(maxL=6)=>{const n=P(nouns(x=>x[0].length<=maxL)),o=pickN(nouns(x=>x[0]!==n[0]&&(x[0][0]===n[0][0]||Math.abs(x[0].length-n[0].length)<=1)),3);return T(`Welches Wort passt zum Bild?<span class="pic">${n[3]}</span>`,n[0],[n[0],...o.slice(0,2).map(x=>x[0])],'Wörter lesen',{raw:1,h:`Das ist ${n[1]} ${n[0]}.`})};
const silben=()=>{const n=P(nouns()),s=n[4];const ch=s>=4?['3','4','5']:['1','2','3','4'];return T(`Wie viele Silben hat das Wort? Klatsche mit!<span class="pic">${n[3]}</span><span class="big">${esc(n[0])}</span>`,String(s),ch,'Silben',{raw:1,say:`Wie viele Silben hat ${n[0]}? Klatsche mit!`,h:`${n[0]} hat ${s} Silbe${s>1?'n':''}.`})};
const reim=()=>{const g=P(RHYME),[b,c]=pickN(g,2),o=pickN(RHYME.filter(x=>x!==g),2).map(x=>P(x));return T(`Was reimt sich auf<span class="big">${b}</span>`,c,[c,...o],'Reime',{raw:1,say:`Was reimt sich auf ${b}?`,h:`${b} und ${c} reimen sich.`})};
const artikel=()=>{const n=P(nouns());return T(`der, die oder das?<span class="pic">${n[3]}</span><span class="big">□ ${esc(n[0])}</span>`,n[1],['der','die','das'],'Artikel',{raw:1,say:`Der, die oder das: ${n[0]}?`,h:`Es heißt: ${n[1]} ${n[0]}.`})};
const vokal=()=>{const c=nouns(x=>x[0].length>=3&&x[0].length<=6);for(let t=0;t<30;t++){const n=P(c),w=n[0],idx=[];for(let i=1;i<w.length;i++){if('aeiou'.includes(w[i])&&!'aeiouäöü'.includes(w[i-1]||'')&&!'aeiouäöü'.includes(w[i+1]||''))idx.push(i)}if(!idx.length)continue;const i=P(idx),v=w[i];return T(`Welcher Buchstabe fehlt?<span class="pic">${n[3]}</span><span class="big">${esc(w.slice(0,i))}□${esc(w.slice(i+1))}</span>`,v,[v,...pickN('aeiou'.split('').filter(x=>x!==v),2)],'Vokale',{raw:1,say:w,h:`Es heißt ${w}.`})}return anlaut()};
const abcNext=()=>{const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ',i=R(1,23),L=A[i];return T(`Welcher Buchstabe kommt im ABC nach<span class="big">${L}</span>`,A[i+1],[A[i+1],A[i-1],A[i+2]],'ABC',{raw:1,say:`Welcher Buchstabe kommt im ABC nach ${L}?`,h:`… ${A[i-1]}, ${L}, ${A[i+1]}, ${A[i+2]} …`})};
const abcFirst=(same)=>{let ws;if(same){const groups={};N.forEach(n=>{(groups[n[0][0]]=groups[n[0][0]]||[]).push(n[0])});const g=P(Object.values(groups).filter(x=>new Set(x.map(w=>w[1])).size>=3));ws=[];shuffle(g.slice()).forEach(w=>{if(ws.length<3&&!ws.some(v=>v[1]===w[1]))ws.push(w)})}else{ws=[];shuffle(N.slice()).forEach(n=>{if(ws.length<3&&!ws.some(v=>v[0]===n[0][0]))ws.push(n[0])})}

const plural=()=>{const n=P(nouns(x=>x[2])),w=n[0],p=n[2];const ds=[w+'e',w+'en',w+'s',w+'er',umlaut(w)+'e',umlaut(w)+'er',w+'n'].filter(x=>x!==p&&x!==w);return T(`Ein ${n[3]} – viele …?<span class="big">${n[1]} ${esc(w)} → die □</span>`,p,[p,...pickN(ds,2)],'Mehrzahl',{raw:1,say:`${n[1]} ${w}. Und viele?`,h:`${n[1]} ${w}, die ${p}.`})};

const gross=()=>{const n=P(nouns()),v=P(VERBS),a=P(ADJS);return T('Welches Wort schreibt man groß?',lc(n[0]),[lc(n[0]),v,a],'Großschreibung',{h:`${n[0]} ist ein Nomen. Nomen schreibt man groß.`,showA:n[0]})};
const wortart=(k)=>{const t=P(['Nomen','Verb','Adjektiv']);const nm={Nomen:'Nomen (Namenwort)',Verb:'Verb (Tunwort)',Adjektiv:'Adjektiv (Wiewort)'};const n=P(nouns())[0],v=P(VERBS),a=P(ADJS);const c={Nomen:n,Verb:v,Adjektiv:a}[t];return T(`Welches Wort ist ein ${nm[t]}?`,c,[n,v,a],'Wortarten',{h:`${c} ist ein ${nm[t]}.`})};
const wortartWelche=(four)=>{const types=four?['Nomen','Verb','Adjektiv','Pronomen','Präposition']:['Nomen','Verb','Adjektiv'];const t=P(types);const w={Nomen:P(N)[0],Verb:P(VERBS),Adjektiv:P(ADJS),Pronomen:P(PRON),Präposition:P(PREP)}[t];const ch=four?[t,...pickN(types.filter(x=>x!==t),3)]:types;return T(`Zu welcher Wortart gehört<span class="big">${esc(w)}</span>`,t,ch,'Wortarten',{raw:1,h:`${w} ist ein${t==='Präposition'?'e':''} ${t}.`})};
const gegenteil=()=>{const p=P(OPP),i=R(0,1),w=p[i],a=p[1-i],o=pickN(OPP.filter(x=>x!==p),2).map(x=>P(x));return T(`Was ist das Gegenteil von<span class="big">${w}</span>`,a,[a,...o],'Gegenteile',{raw:1,h:`${w} – ${a}`})};
const gap=(key)=>{const it=P(GAP[key]),m=it.match(/\[([^\]]+)\]/),parts=m[1].split('|'),a=parts[0],full=it.replace(m[0],a),q=esc(it.replace(m[0],'□'));const sentence=key==='dass'||key==='punkt'||key==='pron';return T(`${sentence?'Was gehört in die Lücke?':'Was fehlt?'}<span class="big">${q}</span>`,a,parts,GAPT[key],{raw:1,say:key==='punkt'?it.replace(m[0],''):full,h:`${full} – ${GAPH[key]}`,ws:1})};

const comp=()=>{const c=P(COMP);if(Math.random()<.5)return T(`${c[0]} + ${c[1]} = ?`,c[2],[c[2],c[1]+lc(c[0]),c[0]+' '+c[1]],'Zusammengesetzte Nomen',{h:`${c[0]} + ${c[1]} = ${c[2]}`});return T(`Welcher Artikel passt?<span class="big">□ ${c[2]}</span>`,c[3],['der','die','das'],'Zusammengesetzte Nomen',{raw:1,h:`Das letzte Wort bestimmt den Artikel: ${c[3]} ${c[1]} → ${c[3]} ${c[2]}.`})};
const trenn=()=>{const s=P(SPLIT),w=s.replace(/-/g,'');const pos=[];let i=0;for(const ch of s){if(ch==='-')pos.push(i);else i++}const mk=ps=>{let o='';for(let k=0;k<w.length;k++){if(ps.includes(k))o+='-';o+=w[k]}return o};const ds=new Set();for(let t=0;t<30&&ds.size<2;t++){const ps=pos.map(p=>Math.random()<.5?p:Math.min(w.length-1,Math.max(1,p+(Math.random()<.5?-1:1))));const v=mk([...new Set(ps)].sort((a,b)=>a-b));if(v!==s)ds.add(v)}return T(`Wie trennt man das Wort richtig?<span class="big">${w}</span>`,s,[s,...ds],'Silbentrennung',{raw:1,h:`Richtig: ${s}. Sprich langsam und klatsche die Silben.`})};

 renderTask('ok');$('#card').classList.add('good');if(t.kind!=='build'){$('#choices').hidden=false;const b=$(`#choices [data-i="${cur.sel}"]`);if(b)b.classList.add('right')}
 SFX.ok();bubble(first?(COMBO[S.combo]||(blitz?'⚡ Blitzschnell!':P(PRAISE))):'Geschafft!');
 $('#fb').textContent=first?`+${coins} Münze${coins>1?'n':''}  ·  +${xp} XP`:'Geschafft! +'+xp+' XP';
 const bd=$('#buddy');bd.classList.remove('cheer');void bd.offsetWidth;bd.classList.add('cheer');
 attack(dmg,()=>{S.coins+=coins;addXP(xp);dayCount();checkAch();save();renderHUD();
  if(S.egg.hp<=0)setTimeout(hatch,450);else setTimeout(newTask,first?650:900)})}
function wrong(){const t=cur.t;cur.tries++;S.combo=0;SFX.bad();const c=$('#card');c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');
 const n=$('#nest');n.classList.remove('laugh','hit','enter');void n.offsetWidth;n.classList.add('laugh');
 if(cur.tries===1&&t.ch.length>2){renderTask();$('#fb').textContent='Fast! Probier es nochmal.';$('#fb').className='fb bad';renderHUD();return}
 finalWrong()}
function finalWrong(){const t=cur.t;stat(t,false);adapt(false);queue.push({t:Object.assign({},t,{tiles:null}),due:served+R(3,5)});
 cur.done=true;renderTask('no');const ans=t.kind==='build'?t.w:(t.showA||t.a);
 $('#fb').innerHTML=`Richtig ist <b>${esc(ans)}</b>. ${t.h?esc(t.h):''} Die Aufgabe kommt gleich nochmal.`;$('#fb').className='fb';
 S.combo=0;renderHUD();save();if(S.voice&&voiceUnlocked&&t.kind==='build')speak(t.w)}
function attack(dmg,done){const ar=$('#arena').getBoundingClientRect(),h=$('#buddy').getBoundingClientRect(),m=$('#nest').getBoundingClientRect();
 const s=document.createElement('span');s.className='fly';s.textContent=dmg>=3?'💥':dmg===2?'🌟':'⭐';$('#arena').appendChild(s);
 const x0=h.left-ar.left+h.width*.7,y0=h.top-ar.top+h.height*.35,x1=m.left-ar.left+m.width*.4,y1=m.top-ar.top+m.height*.5;s.style.left=x0+'px';s.style.top=y0+'px';
 let fired=false;const fin=()=>{if(fired)return;fired=true;s.remove();S.egg.hp-=dmg;$('#nest').innerHTML=eggSVG(S.egg.rar,S.egg.giant,1-Math.max(0,S.egg.hp)/S.egg.max);renderHP();SFX.hit();const el=$('#nest');el.className='nest';void el.offsetWidth;el.classList.add('hit');done()};
 if(reduced||!s.animate){fin();return}
 const a=s.animate([{transform:'translate(0,0) scale(.7)'},{transform:`translate(${(x1-x0)/2}px,${(y1-y0)/2-50}px) rotate(180deg) scale(1.2)`},{transform:`translate(${x1-x0}px,${y1-y0}px) rotate(360deg) scale(1)`}],{duration:360,easing:'ease-in'});a.onfinish=fin;setTimeout(fin,1200)}
function addXP(x){S.xp+=x;S.xpAll+=x;while(S.xp>=need(S.lvl)){S.xp-=need(S.lvl);S.lvl++;S.coins+=10;setTimeout(()=>{SFX.lvl();confetti(140)},200);toast(`🎉 Level ${S.lvl}! Du bist jetzt ${title(S.lvl)}. +10 Münzen`)}}
function rollDay(){const d=today();if(S.day.d!==d)S.day={d,n:0,done:false}}
function streakNow(){return S.lastGoal===today()||S.lastGoal===today(-1)?S.dstreak:0}
function dayCount(){rollDay();S.day.n++;if(!S.day.done&&S.day.n>=S.goal){S.day.done=true;S.dstreak=S.lastGoal===today(-1)?S.dstreak+1:S.lastGoal===today()?S.dstreak:1;S.lastGoal=today();S.coins+=20;confetti(160);SFX.lvl();toast(`🔥 Tagesziel geschafft! ${S.dstreak} ${S.dstreak===1?'Tag':'Tage'} in Folge. +20 Münzen`)}}
function checkAch(){ACH.forEach(a=>{if(!S.ach[a[0]]&&a[4](S)){S.ach[a[0]]=today();S.coins+=10;toast(`${a[1]} Abzeichen: ${a[2]}! +10 Münzen`)}})}
function hatch(){try{hatch0()}catch(err){rescue(err)}}
function hatch0(){const e=S.egg;if(!e||e.dead)return;e.dead=1;SFX.win();const el=$('#nest');el.className='nest';void el.offsetWidth;el.classList.add('gone');
 const isNew=!S.dex[e.sp];S.dex[e.sp]=(S.dex[e.sp]||0)+1;if(e.sh)S.shiny[e.sp]=(S.shiny[e.sp]||0)+1;S.hatched++;S.park.unshift({sp:e.sp,sh:e.sh?1:0});if(S.park.length>300)S.park.length=300;
 for(let w=0;w<7;w++)if(!S.wdone[w]&&DINO.every((x,i)=>x[1]!==w||S.dex[i])){S.wdone[w]=1;S.coins+=50;toast(`🌍 ${WORLDS[w].n} komplett! Alle Dinos gefunden. +50 Münzen`)}
 S.mi++;let newWorld=false;if(S.mi>=5){S.mi=0;S.world++;newWorld=true}
 const gain=R(5,12)+[0,5,12,40][e.rar]+(e.giant?10:0)+(e.sh?20:0);S.coins+=gain;if(e.rar>=2||e.sh)confetti(160);checkAch();save();
 setTimeout(()=>{try{sheet(`<div class="center"><h2>${isNew?'Ein neuer Dino!':'Geschlüpft!'}</h2><div class="reveal">${dinoSVG(e.sp,e.sh)}</div><p>${e.sh?'✨ ':''}<b>${esc(DINO[e.sp][0])}</b>${rarTag(e.rar)||'<span class="rar r0">gewöhnlich</span>'}${isNew?'<span class="rar new">NEU im Dino-Park!</span>':` – du hast ihn jetzt ${S.dex[e.sp]}×.`}</p><div style="font-size:26px;font-weight:800"><span class="coin" style="width:24px;height:24px;vertical-align:-3px"></span> +${gain} Münzen</div>${newWorld?`<p><b>Auf zur nächsten Welt: ${WORLDS[S.world%7].n}!</b></p>`:''}<div class="row" style="justify-content:center"><button class="bigbtn" data-act="mkbuddy" data-sp="${e.sp}" data-sh="${e.sh?1:0}" style="width:auto;padding:0 18px;font-size:20px;min-height:52px">Als Begleiter wählen</button></div><button class="bigbtn go" id="cont">Weiter ➜</button></div>`,false);
  $('#cont').addEventListener('click',()=>{try{closeOv();S.egg=null;newEgg();renderWorld();renderEgg(true);save();newTask()}catch(err){rescue(err)}})}catch(err){rescue(err)}},550)}

/* ---------- overlays ---------- */
function sheet(html,closable=true){$('#sheet').innerHTML=(closable?'<button class="x" data-act="close" aria-label="Schließen">✕</button>':'')+html;$('#ov').hidden=false;$('#sheet').scrollTop=0}
function closeOv(){$('#ov').hidden=true;$('#sheet').innerHTML=''}
function showMenu(){sheet(`<h2>Menü</h2><p>${esc(S.name||'')} · Level ${S.lvl} · ${S.right} Aufgaben richtig</p><div class="mgrid"><button data-act="park"><span>🦕</span>Dino-Park</button><button data-act="shop"><span>🛍️</span>Laden</button><button data-act="badges"><span>🏅</span>Abzeichen</button><button data-act="parents"><span>🔒</span>Für Eltern</button></div><p style="margin-top:14px">🔥 Tage in Folge: <b>${streakNow()}</b> · Tagesziel heute: <b>${Math.min(S.day.n,S.goal)}/${S.goal}</b><br>🦕 Dino-Park: <b>${dexCount(S)}/${DINO.length}</b> Arten · 🥚 Ausgebrütet: <b>${S.hatched}</b> · Beste Kombo: <b>${S.best}</b></p>`)}
function showPark(){const got=dexCount(S),tot=DINO.length;let h=`<h2>Dino-Park</h2><p>Entdeckt: <b>${got} von ${tot}</b> Dino-Arten. Tippe auf einen Dino, um ihn als Begleiter mitzunehmen.</p><div class="prog"><i style="width:${got/tot*100}%"></i></div>`;
 [0,1,2,3,4,5,6,-1].forEach(w=>{const ids=DINO.map((x,i)=>i).filter(i=>DINO[i][1]===w),c=ids.filter(i=>S.dex[i]).length;
  h+=`<div class="sec">${w<0?'🌟 Legendär':WORLDS[w].n}<small>${S.wdone[w]?'✅ ':''}${c}/${ids.length}</small></div><div class="grid">${ids.map(i=>{const q=DINO[i][2],has=S.dex[i],sel=S.buddy===i;return `<div class="item r${q} ${has?'':'sil'} ${sel?'sel':''}">${dinoSVG(i,false)}<div class="n">${has?esc(DINO[i][0]):'???'}</div><small>${RAR[q]}${has?` · ${S.dex[i]}×`:''}${S.shiny[i]?' · ✨':''}</small>${has?`<button data-act="mkbuddy" data-sp="${i}" data-sh="0">${sel?'Dabei ✓':'Begleiter'}</button>`:''}${has&&S.shiny[i]?`<button data-act="mkbuddy" data-sp="${i}" data-sh="1">✨ Glitzer</button>`:''}</div>`}).join('')}</div>`});
 h+=`<p style="margin-top:14px"><small>Die Farbe des Eis verrät die Seltenheit: beige gewöhnlich, blau selten, lila episch, gold legendär. Glitzer-Dinos sind ganz selten und funkeln. Dino-Babys tragen noch ihre Eierschale.</small></p>`;sheet(h)}
let shopTab='h';
function showShop(){const tabs=`<div class="tabs"><button data-act="tabh" class="${shopTab==='h'?'on':''}">Hüte</button><button data-act="tabe" class="${shopTab==='e'?'on':''}">Eier</button></div>`,top=`<h2>Laden</h2><p>Du hast <span class="coin" style="vertical-align:-3px"></span> <b>${S.coins}</b> Münzen.</p>${tabs}`;
 if(shopTab==='e'){sheet(top+`<div class="grid"><div class="item r2"><div class="e">🥚</div><div class="n">Spezial-Ei</div><small>Das nächste Ei wird episch – vielleicht sogar legendär!</small><button data-act="buyegg" ${S.special?'disabled':''}>${S.special?'Gekauft ✓':'<span class="coin"></span>150'}</button></div></div>`);return}
 sheet(top+`<div class="grid">${HATS.map(it=>{const o=S.hats.includes(it[0]),s=S.hat===it[0];return `<div class="item ${s?'sel':''} ${!o&&S.coins<it[3]?'locked':''}"><div class="e">${it[1]}</div><div class="n">${it[2]}</div><button data-buy="${it[0]}">${s?'Ablegen':o?'Aufsetzen':`<span class="coin"></span>${it[3]}`}</button></div>`}).join('')}</div><p>Dein Begleiter-Dino trägt den Hut im Spiel.</p>`)}
function buy(id){const it=HATS.find(x=>x[0]===id);if(!it)return;
 if(S.hats.includes(id))S.hat=S.hat===id?null:id;
 else if(S.coins>=it[3]){S.coins-=it[3];S.hats.push(id);S.hat=id;SFX.coin();confetti(60);checkAch()}
 else{toast(`Dir fehlen noch ${it[3]-S.coins} Münzen. Weiter üben!`);return}
 renderBuddy();renderHUD();save();showShop()}
function showBadges(){const n=ACH.filter(a=>S.ach[a[0]]).length;sheet(`<h2>Abzeichen</h2><p><b>${n}</b> von ${ACH.length} gesammelt. Jedes Abzeichen bringt 10 Münzen.</p>${ACH.map(a=>`<div class="badge ${S.ach[a[0]]?'':'off'}"><span class="e">${a[1]}</span><div><b>${a[2]}</b><small>${a[3]}</small></div></div>`).join('')}`)}
let gate=null,parentsOK=false,confirmReset=false;
function showParents(){if(!parentsOK){gate=[R(12,19),R(3,9)];sheet(`<h2>Für Eltern</h2><p>Bitte löse diese Aufgabe, um die Einstellungen zu öffnen:</p><p style="font-size:30px;font-weight:800">${gate[0]} · ${gate[1]} = ?</p><form id="gateF"><input class="t" id="gateI" inputmode="numeric" autocomplete="off" aria-label="Ergebnis"><div style="height:10px"></div><button class="bigbtn" type="submit">Öffnen</button></form><p class="fb bad" id="gateM"></p>`);
 $('#gateF').addEventListener('submit',e=>{e.preventDefault();if(+$('#gateI').value===gate[0]*gate[1]){parentsOK=true;showParents()}else $('#gateM').textContent='Leider falsch.'});return}
 const tp=Object.entries(S.topics).sort((a,b)=>b[1][1]-a[1][1]),auto=autoRead();
 sheet(`<h2>Für Eltern</h2>
 <label class="l" for="nameI">Name</label><input class="t" id="nameI" value="${esc(S.name)}" maxlength="16" autocomplete="off">
 <label class="l">Klasse</label><div class="row seg">${[1,2,3,4].map(k=>`<button data-k2="${k}" class="${S.k===k?'on':''}">${k}</button>`).join('')}</div>
 <label class="l">Stufe in Klasse ${S.k} <small>(passt sich automatisch an)</small></label><div class="row seg">${[1,2,3,4,5].map(s=>`<button data-st="${s}" class="${S.st[S.k]===s?'on':''}">${s}</button>`).join('')}</div>
 <label class="l">Tagesziel (richtige Aufgaben)</label><div class="row seg">${[15,25,40,60].map(g=>`<button data-goal="${g}" class="${S.goal===g?'on':''}">${g}</button>`).join('')}</div>
 <label class="l">Töne</label><div class="row seg"><button data-snd="1" class="${S.sound?'on':''}">An</button><button data-snd="0" class="${S.sound?'':'on'}">Aus</button></div>
 <label class="l">Vorlese-Knopf</label><div class="row seg"><button data-voice="1" class="${S.voice?'on':''}">An</button><button data-voice="0" class="${S.voice?'':'on'}">Aus</button></div>
 <label class="l">Aufgaben automatisch vorlesen <small>(gut für Leseanfänger)</small></label><div class="row seg"><button data-auto="1" class="${auto?'on':''}">An</button><button data-auto="0" class="${auto?'':'on'}">Aus</button></div>
 <label class="l">Statistik nach Thema (beim ersten Versuch richtig)</label>
 ${tp.length?`<table><thead><tr><th>Thema</th><th class="n">Aufgaben</th><th class="n">Richtig</th><th></th></tr></thead><tbody>${tp.map(([n,[r,t]])=>`<tr><td>${esc(n)}</td><td class="n">${t}</td><td class="n">${Math.round(r/t*100)} %</td><td style="width:30%"><div class="meter"><i style="width:${r/t*100}%"></i></div></td></tr>`).join('')}</tbody></table>`:'<p>Noch keine Aufgaben gelöst.</p>'}
 <p>Insgesamt: ${S.ans} Aufgaben, ${S.right} beim ersten Versuch richtig${S.ans?` (${Math.round(S.right/S.ans*100)} %)`:''}.</p>
 <p><small>Themen nach Klasse – 1: Anlaute, Buchstaben, Silben, Reime, Artikel, Wörter lesen und bauen. 2: Mehrzahl, Großschreibung, ABC, Gegenteile, Wortarten, ie/ei, doppelte Mitlaute, Satzzeichen. 3: Zeitformen, Steigerung, zusammengesetzte Nomen, äu/eu, ä/e, ss/ß, ck/tz, Silbentrennung, Wortfamilien, Pronomen, wörtliche Rede. 4: vier Fälle, Satzglieder, das/dass, Komma, Perfekt und Futur, Wortfelder. Falsch gelöste Aufgaben kommen nach ein paar Runden noch einmal.</small></p>
 <button class="bigbtn coral" data-act="reset">${confirmReset?'Wirklich alles löschen? Nochmal tippen':'Spielstand zurücksetzen'}</button>`);
 $('#nameI').addEventListener('change',e=>{S.name=e.target.value.trim().slice(0,16);renderHUD();save()})}
function showStart(){sheet(`<div class="center"><h2 style="font-size:44px">Deutsch-Dino</h2><div class="start-dino">${dinoSVG(0,false)}</div><p>Löse Deutsch-Aufgaben, knacke Dino-Eier und entdecke alle ${DINO.length} Dinos für deinen Dino-Park!</p></div>
 <form id="startF"><label class="l" for="startN">Wie heißt du?</label><input class="t" id="startN" maxlength="16" autocomplete="off" value="${esc(S.name)}" placeholder="Dein Name">
 <label class="l">In welche Klasse gehst du?</label><div class="row seg" id="startK">${[1,2,3,4].map(k=>`<button type="button" data-sk="${k}" class="${S.k===k?'on':''}" style="flex:1">${k}. Klasse</button>`).join('')}</div>
 <button class="bigbtn go" type="submit">Los geht's! ➜</button></form>`,false);
 $('#startK').addEventListener('click',e=>{const b=e.target.closest('[data-sk]');if(!b)return;S.k=+b.dataset.sk;[...$('#startK').children].forEach(x=>x.classList.toggle('on',x===b))});
 $('#startF').addEventListener('submit',e=>{e.preventDefault();voiceUnlocked=true;S.name=($('#startN').value.trim()||'Dino-Fan').slice(0,16);SFX.ok();closeOv();renderAll();save();newTask()})}

/* ---------- events ---------- */
$('#choices').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)pickChoice(+b.dataset.i)});
$('#tiles').addEventListener('click',e=>{const b=e.target.closest('[data-j]');if(b)pickTile(+b.dataset.j)});
$('#weiter').addEventListener('click',()=>{if(cur&&cur.done)newTask()});
$('#say').addEventListener('click',()=>{voiceUnlocked=true;if(cur)speak(sayText(cur.t))});
$('#menuBtn').addEventListener('click',showMenu);$('#lvlBtn').addEventListener('click',showBadges);
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&$('#sheet .x'))closeOv()});
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.act;
 if(a==='close')closeOv();else if(a==='park')showPark();else if(a==='shop')showShop();else if(a==='badges')showBadges();else if(a==='parents')showParents();
 else if(a==='tabh'){shopTab='h';showShop()}else if(a==='tabe'){shopTab='e';showShop()}
 else if(a==='mkbuddy'){S.buddy=+b.dataset.sp;S.buddyShiny=b.dataset.sh==='1';renderBuddy();save();toast(`${DINO[S.buddy][0]} ist jetzt dein Begleiter!`);if($('#sheet .x'))showPark();else b.textContent='Dabei ✓'}
 else if(a==='buyegg'){if(S.special)return;if(S.coins<150){toast(`Dir fehlen noch ${150-S.coins} Münzen. Weiter üben!`);return}S.coins-=150;S.special=true;SFX.coin();confetti(60);renderHUD();save();showShop()}
 else if(b.dataset.buy)buy(b.dataset.buy);
 else if(b.dataset.k2){S.k=+b.dataset.k2;queue=[];recent=[];save();renderHUD();newTask();showParents()}
 else if(b.dataset.st){S.st[S.k]=+b.dataset.st;recent=[];save();renderHUD();newTask();showParents()}
 else if(b.dataset.goal){S.goal=+b.dataset.goal;save();renderHUD();showParents()}
 else if(b.dataset.snd){S.sound=b.dataset.snd==='1';save();showParents()}
 else if(b.dataset.voice){S.voice=b.dataset.voice==='1';$('#say').hidden=!S.voice||!window.speechSynthesis;save();showParents()}
 else if(b.dataset.auto){S.auto=b.dataset.auto==='1';save();showParents()}
 else if(a==='reset'){if(!confirmReset){confirmReset=true;showParents();return}confirmReset=false;parentsOK=false;S=fresh();sceneW=-1;queue=[];save();renderAll();showStart()}});
document.addEventListener('keydown',e=>{if(!$('#ov').hidden){if(e.key==='Escape'&&$('#sheet .x'))closeOv();return}if(!cur)return;
 if(cur.done&&(e.key==='Enter'||e.key===' ')){e.preventDefault();newTask();return}
 if(cur.t.kind==='build'){const j=cur.t.tiles.findIndex(x=>!x.used&&lc(x.c)===lc(e.key));if(j>=0)pickTile(j);return}
 if(/^[1-4]$/.test(e.key)&&cur.t.ch[+e.key-1]!=null&&!cur.picked.includes(+e.key-1))pickChoice(+e.key-1)});

/* ---------- boot ---------- */
async function start(){if(!window.speechSynthesis)$('#say').hidden=true;
 sheet(LOADING,false);
 const d=await loadLoop();S=merge(d);S.combo=0;closeOv();
 $('#say').hidden=!S.voice||!window.speechSynthesis;renderAll();
 if(S.name)newTask();else showStart();
 if(!store)toast('Hinweis: Ohne Anmeldung wird der Spielstand nicht gespeichert.')}
/* ---------- safety net: never leave the child stuck ---------- */
function rescue(e){try{console.error(e)}catch(_){}try{closeOv()}catch(_){}
 try{if(!S.egg||S.egg.dead||!(S.egg.hp>0)){S.egg=null;newEgg()}renderWorld();renderEgg(true);renderHUD()}catch(_){}
 try{save()}catch(_){}try{newTask()}catch(_){}}
setInterval(()=>{try{if(!cur||!$('#ov').hidden||!cur.lock||cur.done)return;if(performance.now()-(cur.lockAt||0)<7000)return;cur.lockAt=performance.now();
 if(S.egg&&!(S.egg.hp>0)&&!S.egg.dead)hatch();else{if(!S.egg||S.egg.dead){S.egg=null;newEgg();renderWorld();renderEgg(true)}newTask()}}catch(e){try{rescue(e)}catch(_){}}},1500);
start();
}
</script>
</body>
</html>
