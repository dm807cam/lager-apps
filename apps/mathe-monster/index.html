<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathe-Monster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--kh:clamp(46px,7.2vh,68px);color-scheme:light;--bg:#ffd23f;--ink:#1d1b3a;--card:#fff;--go:#3ccf6e;--coral:#ff6b5b;--sky:#2f80ed;--soft:#fff4c2;--gold:#ffcc33}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.4 "Baloo 2",ui-rounded,"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;padding:env(safe-area-inset-top,0) max(10px,env(safe-area-inset-right,0)) env(safe-area-inset-bottom,0) max(10px,env(safe-area-inset-left,0))}
.top{display:flex;align-items:center;gap:8px;padding:8px 0}
.lvl{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--coral);color:#fff;font-weight:800;font-size:22px;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center}
.xpw{flex:1;display:flex;flex-direction:column;gap:2px}
.ttl{font-weight:800;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpb{height:12px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ad7ff,var(--sky));transition:width .5s}
.pill{flex:none;display:flex;align-items:center;gap:4px;height:38px;padding:0 10px;border:3px solid var(--ink);border-radius:20px;background:#fff;font-weight:800;font-size:17px;white-space:nowrap}
.pill.fire{background:#ffe1d6}
.pill.fire.hot{background:#ff9a3c;color:#fff}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a6,var(--gold) 55%,#d99a00);border:2px solid #8a5a00;flex:none}
.ring{width:22px;height:22px;flex:none}
.menu{flex:none;width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-size:22px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
main{flex:1;min-height:0;display:grid;grid-template-rows:minmax(150px,1fr) auto auto;gap:10px;padding-bottom:10px}
.arena{position:relative;border:4px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 5px 0 var(--ink);background:#7fd3ff}
.arena>svg.scene{position:absolute;inset:0;width:100%;height:100%}
.wtag{position:absolute;left:10px;top:10px;max-width:42%;background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:14px;padding:2px 10px 3px;font-weight:800;font-size:15px;line-height:1.2}
.wtag small{display:block;font-size:13px;font-weight:700;opacity:.8;white-space:nowrap}
.hero{position:absolute;left:7%;bottom:7%;display:flex;align-items:flex-end;gap:2px}
.hero .me{font-size:clamp(52px,11vh,110px);line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.hero .pet{font-size:clamp(26px,5vh,50px);line-height:1;margin-bottom:2px}
.mon{position:absolute;right:5%;bottom:3%;height:70%;aspect-ratio:1;max-width:48%}
.mon svg{width:100%;height:100%;display:block;overflow:visible}
.mhud{position:absolute;right:10px;top:10px;width:min(50%,300px);background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:14px;padding:3px 10px 6px}
.mname{font-weight:800;font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp{height:20px;border:3px solid var(--ink);border-radius:9px;background:#ffe0e0;overflow:hidden;position:relative}
.hp i{display:block;height:100%;background:linear-gradient(#ff8a8a,#e63946);transition:width .35s}
.hp b{position:absolute;inset:0;font-size:13px;line-height:14px;text-align:center;color:var(--ink)}
.bubble{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-weight:800;font-size:clamp(28px,5.5vh,48px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;text-shadow:0 4px 0 var(--ink);white-space:nowrap;pointer-events:none;opacity:0}
.bubble.show{animation:pop 1s ease-out forwards}
.fly{position:absolute;font-size:34px;pointer-events:none;z-index:3}
.dmg{position:absolute;font-weight:800;font-size:30px;color:#fff;-webkit-text-stroke:2px #b00020;paint-order:stroke;pointer-events:none;animation:rise .9s ease-out forwards}
.card{background:var(--card);border:4px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:8px 12px 10px}
.card.good{background:#d8ffe5}
.card.bad{animation:shake .4s}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:800;background:var(--soft);border:2px solid var(--ink);border-radius:10px;padding:0 8px;line-height:1.6}
.chip.again{background:#ffd6f0}
.stinfo{margin-left:auto;font-size:13px;font-weight:700;opacity:.75}
.say{width:44px;height:36px;border-radius:12px;border:3px solid var(--ink);background:#fff;font-size:18px;display:grid;place-items:center;padding:0}
.q{text-align:center;font-weight:800;font-size:clamp(34px,7vh,60px);line-height:1.15;padding:4px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.q.w{font-size:clamp(19px,2.9vh,24px);font-weight:700;line-height:1.3;text-align:left;padding:6px 2px}
.q.w .ans{display:block;text-align:center;font-size:clamp(30px,5.5vh,46px);font-weight:800;margin-top:4px}
.slot{display:inline-block;min-width:1.6em;padding:0 .18em;border:4px dashed var(--sky);border-radius:14px;color:var(--sky);line-height:1.1;text-align:center}
.slot.filled{border-style:solid}
.slot.ok{border-color:var(--go);color:#14833f;background:#eafff1}
.slot.no{border-color:var(--coral);color:#c0392b;background:#fff0ee}
.vis{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:clamp(26px,4.6vh,38px);line-height:1.1;padding:2px 0}
.vis span{white-space:nowrap;letter-spacing:2px}
.fb{min-height:1.4em;text-align:center;font-weight:700;font-size:16px}
.fb.bad{color:#c0392b}
.ctrl{display:grid;min-height:calc(var(--kh)*4 + 28px)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{height:var(--kh);border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);font-size:30px;font-weight:800;line-height:1}
.key:active,.key.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.key.ok{background:var(--go);color:#fff;-webkit-text-stroke:1px var(--ink)}
.key.del{background:#ffd0c4}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:10px;padding-bottom:4px}
.choices.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices .key{height:auto;font-size:clamp(30px,5vh,48px)}
.choices .key.wrong{background:#ffd0c4;opacity:.55}
.choices .key.right{background:var(--go);color:#fff}
.big{min-height:clamp(64px,10vh,90px);border:3px solid var(--ink);border-radius:20px;background:var(--sky);color:#fff;font-size:28px;font-weight:800;box-shadow:0 5px 0 var(--ink);width:100%}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.big.go{background:var(--go)}
#weiter{height:calc(100% - 5px);font-size:clamp(28px,5vh,44px)}
.big.coral{background:var(--coral)}
[hidden]{display:none!important}
@media (min-width:860px) and (min-aspect-ratio:1/1){
main{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
:root{--kh:clamp(56px,9vh,88px)}
.arena{grid-row:1/3;min-height:420px}
.card{display:flex;flex-direction:column}
.card .q{flex:1;display:flex;flex-direction:column;justify-content:center}
.card .q:not(.w){display:block;align-content:center}
.key{font-size:34px}
.q{font-size:clamp(44px,8vh,72px);padding:14px 0}
.ctrl{align-self:start}
}
@media (max-width:420px){.ttl{font-size:13px}.pill{padding:0 7px;font-size:15px;height:34px;gap:3px}.lvl{width:40px;height:40px;font-size:19px}.menu{width:40px;height:40px}#dayP b{display:none}}
.ov{position:fixed;inset:0;background:rgba(29,27,58,.62);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.sheet{background:#fff;border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);width:min(560px,100%);max-height:92%;overflow:auto;padding:16px 16px 18px;position:relative}
.sheet h2{margin:0 0 6px;font-size:32px;line-height:1.05;letter-spacing:-.01em}
.sheet p{margin:4px 0 10px}
.x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.item{border:3px solid var(--ink);border-radius:18px;background:var(--soft);padding:6px 4px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.item .e{font-size:44px;line-height:1.1}
.item .n{font-weight:800;font-size:14px;line-height:1.15}
.item button{margin-top:4px;min-height:36px;width:100%;border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px}
.item.sel{background:#d8ffe5}
.item.locked{opacity:.6}
.item.boss{background:#fff1b8;border-color:#b07d00}
.item svg{width:72px;height:72px}
.tabs{display:flex;gap:8px;margin:6px 0 12px}
.tabs button{flex:1;min-height:44px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:800}
.tabs button.on{background:var(--ink);color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.mgrid button{min-height:84px;border:3px solid var(--ink);border-radius:18px;background:var(--soft);box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:18px;line-height:1.2}
.mgrid button span{display:block;font-size:30px}
.badge{display:flex;align-items:center;gap:10px;padding:8px 10px;border:3px solid var(--ink);border-radius:16px;margin-bottom:8px;background:#fff}
.badge .e{font-size:32px;flex:none;width:44px;text-align:center}
.badge.off{opacity:.45;filter:grayscale(1)}
.badge b{display:block;line-height:1.1}
.badge small{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.seg button{min-width:48px;min-height:44px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;font-size:18px}
.seg button.on{background:var(--sky);color:#fff}
label.l{font-weight:800;display:block;margin-top:8px}
input.t{font:inherit;font-size:20px;font-weight:700;width:100%;padding:8px 12px;border:3px solid var(--ink);border-radius:14px;min-height:50px}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:4px 6px;border-bottom:2px solid #eee;text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:10px;border-radius:6px;background:#eee;overflow:hidden;min-width:50px}
.meter i{display:block;height:100%;background:var(--go)}
.tapw{display:block;margin:0 auto;padding:0;border:0;background:none;cursor:pointer}
.chest{width:min(170px,44vw);margin:4px auto;display:block;cursor:pointer}
.chest .lid{transition:transform .45s cubic-bezier(.3,1.6,.5,1);transform-origin:20px 62px}
.chest.open .lid{transform:translate(0,-26px) rotate(-18deg)}
.chest .glow{opacity:0;transition:opacity .4s}
.chest.open .glow{opacity:1}
.center{text-align:center}
.rar{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:0 6px;margin-left:6px;color:#fff;line-height:1.5;vertical-align:2px}
.rar.r0{background:#8a8f98}.rar.r1{background:#2f80ed}.rar.r2{background:#8b5cf6}.rar.r3{background:#c98a00}.rar.r4{background:#ff7a00}.rar.new{background:#ff3d7f}.rar.sh{background:#00a6a6}
.item.r1{border-color:#2f80ed}
.item.r2{border-color:#8b5cf6;background:#f1eaff}
.item.r3{border-color:#b07d00;background:#fff1b8}
.item.r4{border-color:#e07000;background:linear-gradient(#fff7cf,#ffd98a)}
.item.sil{background:#f2f2f2;border-style:dashed}
.item.sil svg{filter:brightness(0);opacity:.18}
.item small{font-size:13px;line-height:1.2}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 8px;font-size:20px;font-weight:800}
.sec small{font-size:15px;font-weight:700}
.prog{height:14px;border:3px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#ff7a00)}
.won{width:min(110px,30vw);display:block;margin:0 auto}
.egg{width:min(150px,40vw);display:block;margin:8px auto;cursor:pointer;transform-origin:50% 90%;animation:wob 1.1s ease-in-out infinite}
.chip.eggc{background:#e8ffe0}
@keyframes wob{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.reward{font-size:30px;font-weight:800;text-align:center;min-height:1.3em}
.start-mon{width:min(200px,46vw);display:block;margin:0 auto}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:8px 16px;border-radius:18px;z-index:30;max-width:calc(100% - 24px);text-align:center;animation:drop .3s ease-out}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.mon .body{transform-origin:100px 190px;animation:breathe 2.4s ease-in-out infinite}
.mon.hit .body{animation:hit .4s}
.mon.laugh .body{animation:laugh .6s}
.mon.gone .body{animation:gone .6s forwards}
.mon.enter .body{animation:enter .5s ease-out}
.hero.cheer .me{animation:hop .45s}
.hero.cheer .pet{animation:hop .45s .1s}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes hit{20%{transform:translateX(10px) rotate(6deg)}50%{transform:translateX(-8px) rotate(-4deg)}80%{transform:translateX(4px)}}
@keyframes laugh{25%{transform:translateY(-14px) rotate(-5deg)}50%{transform:translateY(0)}75%{transform:translateY(-8px) rotate(4deg)}}
@keyframes gone{to{transform:scale(0) rotate(200deg);opacity:0}}
@keyframes enter{from{transform:translateX(120%) scale(.6)}}
@keyframes hop{40%{transform:translateY(-16px)}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
@media (prefers-reduced-motion:reduce){.mon .body,.hero .me,.hero .pet,.egg{animation:none!important}.bubble.show{animation-duration:1.4s}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="lvl" id="lvlBtn" aria-label="Level"><span id="lvlN">1</span></button>
    <div class="xpw"><div class="ttl" id="lvlT">Rechen-Raupe</div><div class="xpb"><i id="xpF"></i></div></div>
    <div class="pill" title="Münzen"><span class="coin"></span><b id="coinN">0</b></div>
    <div class="pill fire" id="comboP" title="Richtig in Folge">🔥<b id="comboN">0</b></div>
    <div class="pill" id="dayP" title="Tagesziel"><svg class="ring" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="none" stroke="#eee" stroke-width="5"/><circle id="dayRing" cx="11" cy="11" r="8" fill="none" stroke="#3ccf6e" stroke-width="5" stroke-dasharray="0 60" transform="rotate(-90 11 11)" stroke-linecap="round"/></svg><b id="dayN">0/25</b></div>
    <button class="menu" id="menuBtn" aria-label="Menü">☰</button>
  </header>
  <main>
    <section class="arena" id="arena">
      <svg class="scene" id="scene" viewBox="0 0 800 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
      <div class="wtag" id="wtag">Welt 1 · Blumenwiese</div>
      <div class="mhud"><div class="mname" id="mname">Monster</div><div class="hp"><i id="hpF" style="width:100%"></i><b id="hpT"></b></div></div>
      <div class="hero" id="hero"><span class="me" id="heroE">👧</span><span class="pet" id="petE"></span></div>
      <div class="mon" id="mon"></div>
      <div class="bubble" id="bubble"></div>
    </section>
    <section class="card" id="card">
      <div class="crow"><span class="chip" id="topic">Plus</span><span class="chip again" id="again" hidden>Nochmal!</span><span class="chip eggc" id="eggc" hidden></span><span class="stinfo" id="stinfo">Klasse 1 · Stufe 1</span><button class="say" id="say" aria-label="Aufgabe vorlesen">🔊</button></div>
      <div class="q" id="q"></div>
      <div class="fb" id="fb"></div>
    </section>
    <section class="ctrl">
      <div class="pad" id="pad">
        <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
        <button class="key del" data-k="del" aria-label="Löschen">⌫</button><button class="key" data-k="0">0</button><button class="key ok" data-k="ok" aria-label="Fertig">✓</button>
      </div>
      <div class="choices" id="choices" hidden></div>
      <button class="big go" id="weiter" hidden>Weiter ➜</button>
    </section>
  </main>
</div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
<canvas id="fx"></canvas>
<script>
{
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>{const s=String(n);return typeof n==='number'&&n>=10000?s.replace(/\B(?=(\d{3})+(?!\d))/g,' '):s};
const cap=s=>s[0].toUpperCase()+s.slice(1);
const rng=seed=>{let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- task generators (German Grundschule, Klasse 1–4) ---------- */
const T=(q,a,topic,x={})=>Object.assign({q:String(q),a,topic},x);
const NAMES=[['Mia','sie'],['Ben','er'],['Lena','sie'],['Paul','er'],['Emma','sie'],['Noah','er'],['Lina','sie'],['Finn','er'],['Ella','sie'],['Leon','er'],['Hanna','sie'],['Emil','er']];
const addHint=(a,b)=>{const f=10-a%10;return a%10&&b<10&&a%10+b>10?`${a} + ${f} = ${a+f}, dann + ${b-f} = ${a+b}`:''};
const subHint=(a,b)=>{const f=a%10;return b<10&&b>f&&f?`${a} − ${f} = ${a-f}, dann − ${b-f} = ${a-b}`:''};
const mulHint=(g,f)=>g>5&&g<10?`${g} · ${f} = 5 · ${f} + ${g-5} · ${f} = ${5*f} + ${(g-5)*f} = ${g*f}`:g===1?`Einmal ${f} ist ${f}.`:'';
const mul=(g,f,topic='Einmaleins')=>Math.random()<.5?T(`${g} · ${f}`,g*f,topic,{h:mulHint(g,f)}):T(`${f} · ${g}`,g*f,topic,{h:mulHint(f,g)||mulHint(g,f)});
const div=(f,g)=>T(`${f*g} : ${f}`,g,'Geteilt',{h:`Denk an das Einmaleins: ${g} · ${f} = ${f*g}`});

function afterTurn(fn){if(S.egg&&S.egg.n>=S.egg.need)hatch(fn);else fn()}
function hatch(fn){try{hatch0(fn)}catch(e){S.egg=null;try{closeOv()}catch(_){}fn()}}
function hatch0(fn){const all=SPEC.map((x,i)=>i).filter(i=>(SPEC[i][2]<3&&SPEC[i][1]<=Math.min(S.world,6))||SPEC[i][2]===4);
 const sp=wpick(all,i=>[10,45,30,0,4][SPEC[i][2]]*(S.dex[i]?1:2)),sh=Math.random()<.12,seed=R(1,2147483000);let done=false;
 sheet(`<div class="center"><h2>Dein Ei schlüpft!</h2><button class="tapw" id="eggB" aria-label="Ei öffnen"><div id="eggbox">${eggSVG}</div></button><p id="eggtxt">Tippe auf das Ei!</p><button class="big" id="eggOpenB">Ei öffnen 🐣</button><button class="big go" id="eggok" hidden>Juhu! Weiter ➜</button></div>`,false);
 const showOk=()=>{try{$('#eggok').hidden=false;$('#eggOpenB').hidden=true}catch(e){}};const open=()=>{showOk();if(done)return;done=true;S.egg=null;try{S.hatched++;S.album.unshift({s:seed,n:SPEC[sp][0],b:0,w:Math.max(0,SPEC[sp][1]),sp,sh:sh?1:0});const isNew=catchMon(sp,sh);
  SFX.win();confetti(150);$('#eggbox').innerHTML=`<div class="won" style="width:min(170px,44vw)">${monsterSVG(seed,false,sp,sh)}</div>`;
  $('#eggtxt').innerHTML=`${sh?'✨ ':''}<b>${esc(SPEC[sp][0])}</b>${rarTag(sp)||'<span class="rar r0">gewöhnlich</span>'}${isNew?'<span class="rar new">NEU im Lexikon!</span>':''}`;
  checkAch();save();renderHUD()}catch(e){save()}showOk()};
 $('#eggB').addEventListener('click',open);$('#eggOpenB').addEventListener('click',open);
 $('#eggok').addEventListener('click',()=>{closeOv();try{fn()}catch(e){rescue(e)}})}

/* ---------- overlays ---------- */
function sheet(html,closable=true){$('#sheet').innerHTML=(closable?'<button class="x" data-act="close" aria-label="Schließen">✕</button>':'')+html;$('#ov').hidden=false;$('#sheet').scrollTop=0}
function closeOv(){$('#ov').hidden=true;$('#sheet').innerHTML=''}
function showMenu(){sheet(`<h2>Menü</h2><p>${esc(S.name||'')} · Level ${S.lvl} · ${S.right} Aufgaben richtig</p><div class="mgrid"><button data-act="album"><span>📖</span>Monster-Lexikon</button><button data-act="shop"><span>🛍️</span>Laden</button><button data-act="badges"><span>🏅</span>Abzeichen</button><button data-act="parents"><span>🔒</span>Für Eltern</button></div><p style="margin-top:14px">🔥 Tage in Folge: <b>${streakNow()}</b> · Tagesziel heute: <b>${Math.min(S.day.n,S.goal)}/${S.goal}</b><br>📖 Lexikon: <b>${dexCount(S)}/${SPEC.length}</b> Arten · ⚔️ Monster besiegt: <b>${S.defeated}</b> · 👑 Bosse: <b>${S.bosses}</b> · Beste Kombo: <b>${S.best}</b></p>`)}
let albumTab='lex';
function showAlbum(){const tabs=`<div class="tabs"><button data-act="alex" class="${albumTab==='lex'?'on':''}">Lexikon</button><button data-act="acol" class="${albumTab==='col'?'on':''}">Meine Sammlung</button></div>`;
 if(albumTab==='lex'){const got=dexCount(S),tot=SPEC.length;let h=`<h2>Monster-Lexikon</h2>${tabs}<p>Entdeckt: <b>${got} von ${tot}</b> Monster-Arten. Jede Welt hat eigene Monster, manche sind sehr selten!</p><div class="prog"><i style="width:${got/tot*100}%"></i></div>`;
  [0,1,2,3,4,5,6,-1].forEach(w=>{const ids=SPEC.map((x,i)=>i).filter(i=>SPEC[i][1]===w),c=ids.filter(i=>S.dex[i]).length;
   h+=`<div class="sec">${w<0?'🌟 Legendär':WORLDS[w].n}<small>${S.wdone[w]?'✅ ':''}${c}/${ids.length}</small></div><div class="grid">${ids.map(i=>{const q=SPEC[i][2],has=S.dex[i];return `<div class="item r${q} ${has?'':'sil'}">${monsterSVG(spSeed(i),q===3,i,false)}<div class="n">${has?esc(SPEC[i][0]):'???'}</div><small>${RAR[q]}${has?` · ${S.dex[i]}×`:''}${S.shiny[i]?' · ✨':''}</small></div>`}).join('')}</div>`});
  h+=`<p style="margin-top:14px"><small>Tipp: Glitzer-Monster haben eine andere Farbe und funkeln. Aus Monster-Eiern schlüpfen oft seltene Monster.</small></p>`;sheet(h);return}
 const a=S.album;const list=a.slice(0,240).map(x=>`<div class="item ${x.sp!=null?'r'+SPEC[x.sp][2]:x.b?'r3':''}">${monsterSVG(x.s,!!x.b,x.sp,x.sh)}<div class="n">${x.sh?'✨ ':''}${esc(x.n)}</div><small>${WORLDS[x.w].n}</small></div>`).join('');
 sheet(`<h2>Meine Sammlung</h2>${tabs}<p>${a.length?`Du hast <b>${a.length}</b> Monster besiegt oder ausgebrütet.`:'Noch leer. Besiege dein erstes Monster!'}</p><div class="grid">${list}</div>${a.length>240?`<p>… und ${a.length-240} ältere.</p>`:''}`)}
let shopTab='h';
function showShop(){const tabs=`<div class="tabs"><button data-act="tabh" class="${shopTab==='h'?'on':''}">Helden</button><button data-act="tabp" class="${shopTab==='p'?'on':''}">Begleiter</button><button data-act="tabe" class="${shopTab==='e'?'on':''}">Eier</button></div>`;
 if(shopTab==='e'){sheet(`<h2>Laden</h2><p>Du hast <span class="coin" style="vertical-align:-3px"></span> <b>${S.coins}</b> Münzen.</p>${tabs}<div class="grid"><div class="item r2"><div class="e">🥚</div><div class="n">Monster-Ei</div><small>schlüpft nach 20 richtigen Antworten</small><button data-act="buyegg" ${S.egg?'disabled':''}>${S.egg?`Brütet: ${Math.min(S.egg.n,S.egg.need)}/${S.egg.need}`:'<span class="coin"></span>150'}</button></div></div><p>Aus Eiern schlüpfen oft seltene, epische oder sogar legendäre Monster! Du kannst immer nur ein Ei gleichzeitig ausbrüten.</p>`);return}
 const items=shopTab==='h'?HEROES:PETS,own=shopTab==='h'?S.heroes:S.pets,sel=shopTab==='h'?S.hero:S.pet;
 sheet(`<h2>Laden</h2><p>Du hast <span class="coin" style="vertical-align:-3px"></span> <b>${S.coins}</b> Münzen.</p>${tabs}<div class="grid">${items.map(it=>{const o=own.includes(it[0]),s=sel===it[0];return `<div class="item ${s?'sel':''} ${!o&&S.coins<it[3]?'locked':''}"><div class="e">${it[1]}</div><div class="n">${it[2]}</div><button data-buy="${it[0]}">${s?'Dabei ✓':o?'Auswählen':`<span class="coin"></span>${it[3]}`}</button></div>`}).join('')}</div>${shopTab==='p'?'<p>Dein Begleiter jubelt bei jeder richtigen Antwort mit.</p>':''}`)}
function buy(id){const isH=id[0]==='h',items=isH?HEROES:PETS,own=isH?S.heroes:S.pets,it=items.find(x=>x[0]===id);if(!it)return;
 if(own.includes(id)){if(isH)S.hero=id;else S.pet=S.pet===id?null:id}
 else if(S.coins>=it[3]){S.coins-=it[3];own.push(id);if(isH)S.hero=id;else S.pet=id;SFX.coin();confetti(60);checkAch()}
 else{toast(`Dir fehlen noch ${it[3]-S.coins} Münzen. Weiter rechnen!`);return}
 renderHero();renderHUD();save();showShop()}
function showBadges(){const n=ACH.filter(a=>S.ach[a[0]]).length;sheet(`<h2>Abzeichen</h2><p><b>${n}</b> von ${ACH.length} gesammelt. Jedes Abzeichen bringt 10 Münzen.</p>${ACH.map(a=>`<div class="badge ${S.ach[a[0]]?'':'off'}"><span class="e">${a[1]}</span><div><b>${a[2]}</b><small>${a[3]}</small></div></div>`).join('')}`)}
let gate=null,parentsOK=false,confirmReset=false;
function showParents(){if(!parentsOK){gate=[R(12,19),R(3,9)];sheet(`<h2>Für Eltern</h2><p>Bitte löse diese Aufgabe, um die Einstellungen zu öffnen:</p><p style="font-size:30px;font-weight:800">${gate[0]} · ${gate[1]} = ?</p><form id="gateF"><input class="t" id="gateI" inputmode="numeric" autocomplete="off" aria-label="Ergebnis"><div style="height:10px"></div><button class="big" type="submit">Öffnen</button></form><p class="fb bad" id="gateM"></p>`);
 $('#gateF').addEventListener('submit',e=>{e.preventDefault();if(+$('#gateI').value===gate[0]*gate[1]){parentsOK=true;showParents()}else $('#gateM').textContent='Leider falsch.'});return}
 const tp=Object.entries(S.topics).sort((a,b)=>b[1][1]-a[1][1]);
 sheet(`<h2>Für Eltern</h2>
 <label class="l" for="nameI">Name</label><input class="t" id="nameI" value="${esc(S.name)}" maxlength="16" autocomplete="off">
 <label class="l">Klasse</label><div class="row seg">${[1,2,3,4].map(k=>`<button data-k2="${k}" class="${S.k===k?'on':''}">${k}</button>`).join('')}</div>
 <label class="l">Stufe in Klasse ${S.k} <small>(passt sich automatisch an)</small></label><div class="row seg">${[1,2,3,4,5].map(s=>`<button data-st="${s}" class="${S.st[S.k]===s?'on':''}">${s}</button>`).join('')}</div>
 <label class="l">Tagesziel (richtige Aufgaben)</label><div class="row seg">${[15,25,40,60].map(g=>`<button data-goal="${g}" class="${S.goal===g?'on':''}">${g}</button>`).join('')}</div>
 <label class="l">Töne</label><div class="row seg"><button data-snd="1" class="${S.sound?'on':''}">An</button><button data-snd="0" class="${S.sound?'':'on'}">Aus</button></div>
 <label class="l">Vorlese-Knopf</label><div class="row seg"><button data-voice="1" class="${S.voice?'on':''}">An</button><button data-voice="0" class="${S.voice?'':'on'}">Aus</button></div>
 <label class="l">Statistik nach Thema (beim ersten Versuch richtig)</label>
 ${tp.length?`<table><thead><tr><th>Thema</th><th class="n">Aufgaben</th><th class="n">Richtig</th><th></th></tr></thead><tbody>${tp.map(([n,[r,t]])=>`<tr><td>${esc(n)}</td><td class="n">${t}</td><td class="n">${Math.round(r/t*100)} %</td><td style="width:30%"><div class="meter"><i style="width:${r/t*100}%"></i></div></td></tr>`).join('')}</tbody></table>`:'<p>Noch keine Aufgaben gelöst.</p>'}
 <p>Insgesamt: ${S.ans} Aufgaben, ${S.right} beim ersten Versuch richtig${S.ans?` (${Math.round(S.right/S.ans*100)} %)`:''}.</p>
 <p><small>Falsch gelöste Aufgaben kommen nach ein paar Runden noch einmal. Bei vielen Richtigen in Folge steigt die Stufe, bei mehreren Fehlern sinkt sie.</small></p>
 <button class="big coral" data-act="reset">${confirmReset?'Wirklich alles löschen? Nochmal tippen':'Spielstand zurücksetzen'}</button>`);
 $('#nameI').addEventListener('change',e=>{S.name=e.target.value.trim().slice(0,16);renderHUD();save()})}
function showStart(){const seed=R(1,2147483000);sheet(`<div class="center"><h2 style="font-size:44px">Mathe-Monster</h2><div class="start-mon">${monsterSVG(seed,false)}</div><p>Rechne richtig, besiege die Monster und entdecke alle ${SPEC.length} Monster-Arten für dein Lexikon!</p></div>
 <form id="startF"><label class="l" for="startN">Wie heißt du?</label><input class="t" id="startN" maxlength="16" autocomplete="off" value="${esc(S.name)}" placeholder="Dein Name">
 <label class="l">In welche Klasse gehst du?</label><div class="row seg" id="startK">${[1,2,3,4].map(k=>`<button type="button" data-sk="${k}" class="${S.k===k?'on':''}" style="flex:1">${k}. Klasse</button>`).join('')}</div>
 <button class="big go" type="submit">Los geht's! ➜</button></form>`,false);
 $('#startK').addEventListener('click',e=>{const b=e.target.closest('[data-sk]');if(!b)return;S.k=+b.dataset.sk;[...$('#startK').children].forEach(x=>x.classList.toggle('on',x===b))});
 $('#startF').addEventListener('submit',e=>{e.preventDefault();S.name=($('#startN').value.trim()||'Rechenheld').slice(0,16);SFX.ok();closeOv();renderAll();save();newTask()})}

/* ---------- events ---------- */
$('#pad').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k)});
$('#choices').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b||!cur||cur.lock||cur.done)return;const v=b.dataset.c;cur.input=v;check(cur.t.numch?+v:v)});
$('#weiter').addEventListener('click',()=>{if(cur&&cur.done)newTask()});
$('#say').addEventListener('click',()=>{if(cur)speak(sayText(cur.t))});
$('#menuBtn').addEventListener('click',showMenu);$('#lvlBtn').addEventListener('click',showBadges);
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&$('#sheet .x'))closeOv()});
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.act;
 if(a==='close')closeOv();else if(a==='album')showAlbum();else if(a==='shop')showShop();else if(a==='badges')showBadges();else if(a==='parents')showParents();
 else if(a==='tabh'){shopTab='h';showShop()}else if(a==='tabp'){shopTab='p';showShop()}else if(a==='tabe'){shopTab='e';showShop()}
 else if(a==='alex'){albumTab='lex';showAlbum()}else if(a==='acol'){albumTab='col';showAlbum()}
 else if(a==='buyegg'){if(S.egg)return;if(S.coins<150){toast(`Dir fehlen noch ${150-S.coins} Münzen. Weiter rechnen!`);return}S.coins-=150;S.egg={n:0,need:20};SFX.coin();confetti(60);renderHUD();save();showShop()}
 else if(b.dataset.buy)buy(b.dataset.buy);
 else if(b.dataset.k2){S.k=+b.dataset.k2;queue=[];recent=[];save();renderHUD();newTask();showParents()}
 else if(b.dataset.st){S.st[S.k]=+b.dataset.st;recent=[];save();renderHUD();newTask();showParents()}
 else if(b.dataset.goal){S.goal=+b.dataset.goal;save();renderHUD();showParents()}
 else if(b.dataset.snd){S.sound=b.dataset.snd==='1';save();showParents()}
 else if(b.dataset.voice){S.voice=b.dataset.voice==='1';$('#say').hidden=!S.voice||!window.speechSynthesis;save();showParents()}
 else if(a==='reset'){if(!confirmReset){confirmReset=true;showParents();return}confirmReset=false;parentsOK=false;S=fresh();sceneW=-1;queue=[];save();renderAll();showStart()}});
document.addEventListener('keydown',e=>{if(!$('#ov').hidden){if(e.key==='Escape'&&$('#sheet .x'))closeOv();return}if(!cur)return;
 if(cur.done&&(e.key==='Enter'||e.key===' ')){e.preventDefault();newTask();return}
 if(cur.t.kind==='choice'){const map={'<':'<','>':'>','=':'='};let v=map[e.key];if(!v&&/^[1-4]$/.test(e.key)&&cur.t.ch[+e.key-1]!=null)v=String(cur.t.ch[+e.key-1]);if(v&&!cur.lock&&!cur.picked.includes(v)&&cur.t.ch.map(String).includes(v)){cur.input=v;check(cur.t.numch?+v:v)}return}
 if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del');else if(e.key==='Enter')press('ok');else return;
 const b=$(`#pad [data-k="${/^[0-9]$/.test(e.key)?e.key:e.key==='Enter'?'ok':'del'}"]`);if(b){b.classList.add('down');setTimeout(()=>b.classList.remove('down'),100)}});

/* ---------- boot ---------- */
async function start(){if(!window.speechSynthesis)$('#say').hidden=true;
 sheet(LOADING,false);
 const d=await loadLoop();S=merge(d);S.combo=0;closeOv();
 $('#say').hidden=!S.voice||!window.speechSynthesis;renderAll();
 if(S.name)newTask();else showStart();
 if(!store)toast('Hinweis: Ohne Anmeldung wird der Spielstand nicht gespeichert.')}
/* ---------- safety net: never leave the child stuck ---------- */
function rescue(e){try{console.error(e)}catch(_){}try{closeOv()}catch(_){}
 try{if(!S.mon||S.mon.dead||!(S.mon.hp>0)){S.mon=null;newMonster()}renderWorld();renderMon(true);renderHUD()}catch(_){}
 try{save()}catch(_){}try{newTask()}catch(_){}}
setInterval(()=>{try{if(!cur||!$('#ov').hidden||!cur.lock||cur.done)return;if(performance.now()-(cur.lockAt||0)<7000)return;cur.lockAt=performance.now();
 if(S.mon&&!(S.mon.hp>0)&&!S.mon.dead)defeat();else{if(!S.mon||S.mon.dead){S.mon=null;newMonster();renderWorld();renderMon(true)}afterTurn(newTask)}}catch(e){try{rescue(e)}catch(_){}}},1500);
start();
}
</script>
</body>
</html>
