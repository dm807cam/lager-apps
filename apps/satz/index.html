<!doctype html>
<html lang="de" data-theme="auto" data-font="duo" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f6f4">
<title>Satz</title>
<style>
@font-face{font-family:"iA Duo";src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@master/iA%20Writer%20Duo/Webfonts/iAWriterDuoS-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"iA Duo";src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@master/iA%20Writer%20Duo/Webfonts/iAWriterDuoS-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"iA Duo";src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@master/iA%20Writer%20Duo/Webfonts/iAWriterDuoS-Italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"iA Duo";src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@master/iA%20Writer%20Duo/Webfonts/iAWriterDuoS-BoldItalic.woff2") format("woff2");font-weight:700;font-style:italic;font-display:swap}
@font-face{font-family:"iA Mono";src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@master/iA%20Writer%20Mono/Webfonts/iAWriterMonoS-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"iA Mono";src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@master/iA%20Writer%20Mono/Webfonts/iAWriterMonoS-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"iA Mono";src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@master/iA%20Writer%20Mono/Webfonts/iAWriterMonoS-Italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"iA Mono";src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@master/iA%20Writer%20Mono/Webfonts/iAWriterMonoS-BoldItalic.woff2") format("woff2");font-weight:700;font-style:italic;font-display:swap}
@font-face{font-family:"iA Quattro";src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@master/iA%20Writer%20Quattro/Webfonts/iAWriterQuattroS-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"iA Quattro";src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@master/iA%20Writer%20Quattro/Webfonts/iAWriterQuattroS-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}

:root{
  --bg:#f6f6f4;--fg:#222;--h:#0d0d0d;--soft:#707070;--mk:#b9b9b4;--panel:#eeeeea;--card:#fafaf8;--line:#e0e0db;
  --accent:#1aa3f0;--sel:rgba(26,163,240,.22);--code:#8a6a2e;--warn:#e4a23a;--danger:#d64b45;--ok:#57b36b;--dimop:.26;
  --font:"iA Duo",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:clamp(17px,calc(14.5px + .42vw),22px);--padx:28px;
}
[data-theme=dark]{--bg:#17181a;--fg:#cfcfcb;--h:#f0f0ec;--soft:#8c8c88;--mk:#55575b;--panel:#1f2023;--card:#26272a;--line:#303135;--accent:#22aaf5;--sel:rgba(34,170,245,.3);--code:#d4b46e}
@media (prefers-color-scheme:dark){[data-theme=auto]{--bg:#17181a;--fg:#cfcfcb;--h:#f0f0ec;--soft:#8c8c88;--mk:#55575b;--panel:#1f2023;--card:#26272a;--line:#303135;--accent:#22aaf5;--sel:rgba(34,170,245,.3);--code:#d4b46e}}
[data-font=mono]{--font:"iA Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
[data-font=quattro]{--font:"iA Quattro",ui-sans-serif,system-ui,sans-serif}
[data-size=s]{--fs:clamp(15px,calc(13px + .35vw),19px)}
[data-size=l]{--fs:clamp(19px,calc(16px + .5vw),25px)}
@media (max-width:760px){:root{--padx:20px}}

*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
body.dragging,body.dragging *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing!important}

/* ---------- Editor ---------- */
#page{max-width:calc(64.4ch + 2 * var(--padx));margin:0 auto;padding:max(22vh,90px) var(--padx) 58vh;font:400 var(--fs)/1.62 var(--font);min-height:100vh;cursor:text}
#ed{position:relative;min-height:calc(100vh - max(22vh,90px) - 12vh)}
body{transition:padding .24s cubic-bezier(.2,.8,.2,1)}
@media (min-width:761px){body.lib-open{padding-left:350px}body.notes-open{padding-right:350px}}
#mirror,#ta{font:inherit;line-height:inherit;letter-spacing:0;word-spacing:0;white-space:pre-wrap;white-space:break-spaces;-webkit-line-break:after-white-space;overflow-wrap:break-word;word-break:normal;tab-size:4;font-kerning:none;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;text-rendering:optimizeSpeed;margin:0;padding:0;border:0;text-align:left;hyphens:manual;text-indent:0}
#mirror{color:var(--fg);min-height:1.62em;pointer-events:none}
#ta{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;resize:none;overflow:hidden;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--accent);outline:none;appearance:none;-webkit-appearance:none;border-radius:0;display:block}
#ta::selection{background:var(--sel)}
html:not(.ready) #ta{color:var(--fg);-webkit-text-fill-color:var(--fg)}
html:not(.ready) #mirror{color:transparent!important}
html:not(.ready) #mirror *{color:transparent!important;background:none!important;text-decoration:none!important}
#errbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:300;background:#c0392b;color:#fff;border-radius:12px;padding:12px 14px;font:14px/1.45 var(--ui);display:none;user-select:text;-webkit-user-select:text}
#mirror .mk,#mirror .li{color:var(--mk)}
#mirror .h{color:var(--h);font-weight:700}
#mirror .b{color:var(--h);font-weight:700}
#mirror .i{font-style:italic}
[data-font=quattro] #mirror .i{font-style:normal;color:var(--soft)}
#mirror .code{color:var(--code)}
#mirror .q{color:var(--soft)}
#mirror .lk{text-decoration:underline;text-decoration-color:var(--mk);text-underline-offset:3px}
#mirror .tag{color:var(--accent)}
#mirror .dim{opacity:var(--dimop)}
#mirror .fill{text-decoration:underline wavy var(--warn);text-underline-offset:4px;text-decoration-thickness:1.5px}
#mirror .dup{background:rgba(228,162,58,.28);border-radius:2px}
#mirror .ph{color:var(--mk)}
#cm{display:inline}

/* ---------- Chrome ---------- */
.bar{position:fixed;left:0;right:0;z-index:20;display:flex;align-items:center;gap:4px;transition:opacity .4s ease;font:13px/1 var(--ui);color:var(--soft)}
#top{top:0;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;background:linear-gradient(var(--bg) 55%,transparent)}
body.typing .bar,body.typing #hint{opacity:0;pointer-events:none}
.ib{min-width:36px;height:36px;padding:0 8px;border-radius:9px;display:inline-grid;place-items:center;background:none;border:0;color:var(--soft);cursor:pointer;position:relative;font-size:13px}
.ib:hover{background:var(--line);color:var(--fg)}
.ib.on{color:var(--accent)}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font:600 10px/16px var(--ui);padding:0 4px}
.badge:empty{display:none}
#crumb{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:0 8px}
#crumb b{font-weight:500;color:var(--fg)}
#stat{cursor:pointer;padding:0 8px;height:36px;display:inline-flex;align-items:center;border-radius:9px;white-space:nowrap;font-variant-numeric:tabular-nums}
#stat:hover{background:var(--line)}
#dot{width:7px;height:7px;border-radius:50%;background:var(--mk);margin:0 6px;flex:none;transition:background .3s}
#dot.pending{background:var(--warn)}#dot.err{background:var(--danger)}#dot.ok{background:var(--mk)}
#goalbar{position:fixed;top:0;left:0;height:2px;background:var(--accent);z-index:21;opacity:.7;transition:width .6s}
#mbar{bottom:0;justify-content:space-around;padding:6px 12px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%);display:none}
#mbar .ib{width:48px;height:44px}
#mbar .ib svg{width:22px;height:22px}
#mbar .plus{background:var(--accent);color:#fff;border-radius:22px;width:52px}
#mbar .plus:hover{background:var(--accent);color:#fff}
#hint{position:fixed;bottom:22px;left:0;right:0;text-align:center;font:12.5px var(--ui);color:var(--mk);pointer-events:none;transition:opacity .4s}
#hint kbd{font:inherit;border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin:0 2px}
@media (pointer:coarse),(max-width:760px){#mbar{display:flex}#top .desk{display:none}#hint{display:none}}

/* ---------- Panels ---------- */
.panel{position:fixed;top:0;bottom:0;width:min(350px,100vw);background:var(--panel);z-index:30;display:flex;flex-direction:column;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility .24s;font:14px/1.45 var(--ui);color:var(--fg);visibility:hidden}
.panel.open{transform:none!important;visibility:visible}
#lib{left:0;transform:translateX(-102%);border-right:1px solid var(--line)}
#notes{right:0;transform:translateX(102%);border-left:1px solid var(--line)}
@media (max-width:760px){.panel{width:100vw;border:0!important}}
.phd{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 6px 18px;min-height:52px}
.phd h2{font:600 15px var(--ui);margin:0;flex:1}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px calc(90px + env(safe-area-inset-bottom))}
.sec{font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding:18px 8px 6px;display:flex;align-items:center;gap:6px}
.sec .sp{flex:1}
.btitle{font:600 20px/1.25 var(--ui);padding:6px 8px 2px;cursor:text;outline:none;border-radius:6px}
.btitle:focus{background:var(--card)}
.bmeta{padding:2px 8px 4px;color:var(--soft);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bmeta a{color:var(--soft);text-decoration:underline dotted;cursor:pointer}
.prog{height:4px;border-radius:2px;background:var(--line);margin:6px 8px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px}
.row{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:9px;cursor:pointer;min-height:40px;touch-action:pan-y}
.row:hover{background:var(--line)}
.row.act{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.row .num{width:22px;color:var(--soft);font-variant-numeric:tabular-nums;font-size:12px;text-align:right;flex:none}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .w{color:var(--soft);font-size:12px;font-variant-numeric:tabular-nums}
.row .more{opacity:0;min-width:28px;height:28px}
.row:hover .more,.row.act .more{opacity:1}
@media (pointer:coarse){.row .more{opacity:1}}
.grip{width:18px;height:28px;display:grid;place-items:center;color:var(--mk);cursor:grab;touch-action:none;flex:none}
.grip svg{width:12px;height:16px;fill:currentColor}
.outl{padding:0 0 4px 38px}
.outl div{padding:3px 8px;color:var(--soft);font-size:13px;cursor:pointer;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outl div:hover{color:var(--fg);background:var(--line)}
.addrow{color:var(--accent);font-weight:500}
.links{display:flex;flex-wrap:wrap;gap:6px;padding:4px 8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--fg);white-space:nowrap}
.chip:hover{border-color:var(--soft)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dragging-src{opacity:.25}
.ghost{position:fixed;z-index:100;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:.95;border-radius:10px;background:var(--card)}
input.inl{font:inherit;width:100%;border:0;outline:0;background:var(--card);color:var(--fg);border-radius:6px;padding:4px 6px;box-shadow:0 0 0 2px var(--accent)}

/* notes */
.cap{margin:0 10px;background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:10px 12px 8px}
.cap textarea,#qc textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--fg);font:15px/1.45 var(--ui);padding:0;min-height:22px;max-height:40vh}
.caprow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--soft)}
.caprow .sp{flex:1}
.filt{display:flex;gap:6px;flex-wrap:wrap;padding:10px 10px 0;align-items:center}
.seg{display:inline-flex;background:var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;font-size:12.5px;cursor:pointer;color:var(--soft)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
select.sel{font:12.5px var(--ui);background:var(--line);color:var(--fg);border:0;border-radius:9px;padding:6px 8px;outline:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0}
.nlist{padding:10px 10px calc(100px + env(safe-area-inset-bottom));flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.note{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line);margin-bottom:8px;padding:10px 10px 8px 4px;display:flex;gap:4px;cursor:grab;user-select:none;-webkit-user-select:none}
.note .nb{flex:1;min-width:0}
.note .nt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.note.open .nt{-webkit-line-clamp:unset;display:block}
.note .nt .tg{color:var(--accent)}
.note .nm{font-size:11.5px;color:var(--soft);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.note.used .nt{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--mk)}
.note .na{display:none;gap:6px;flex-wrap:wrap;margin-top:8px}
.note.open .na{display:flex}
.note .na button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.note .na button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.note .na button.dg{color:var(--danger)}
.note .na select{font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:5px}
.note textarea{width:100%;font:14.5px/1.45 var(--ui);border:0;outline:0;background:transparent;color:var(--fg);resize:none}
.note.flash{animation:fl 1.2s}
@keyframes fl{0%,40%{box-shadow:0 0 0 2px var(--accent)}}
.ngh{font:600 11px var(--ui);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);padding:10px 4px 6px}
.empty{color:var(--soft);text-align:center;padding:40px 20px;font-size:13.5px;line-height:1.6}
#dropind{position:fixed;width:2px;background:var(--accent);z-index:99;pointer-events:none;display:none;border-radius:1px;box-shadow:0 0 0 3px var(--sel)}

/* overlays */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:max(12vh,calc(env(safe-area-inset-top) + 16px));background:rgba(0,0,0,.08)}
.ov.open{display:flex}
.box{width:min(580px,94vw);background:var(--card);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.22),0 0 0 1px var(--line);overflow:hidden;font:15px/1.4 var(--ui);color:var(--fg)}
#pin{width:100%;border:0;outline:0;background:transparent;color:var(--fg);font:17px var(--ui);padding:16px 18px;border-bottom:1px solid var(--line)}
#plist{max-height:min(58vh,480px);overflow-y:auto;padding:6px}
.pi{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;cursor:pointer}
.pi.act{background:var(--sel)}
.pi .pl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .ps{color:var(--soft);font-size:12px;white-space:nowrap}
.pi .pk{color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em;width:64px;flex:none}
#qc .box{padding:16px 18px 12px}
#qc textarea{font-size:17px;min-height:26px}
#menu{position:fixed;z-index:70;background:var(--card);border-radius:11px;box-shadow:0 12px 40px rgba(0,0,0,.2),0 0 0 1px var(--line);padding:5px;display:none;min-width:200px;font:14px var(--ui);color:var(--fg)}
#menu div{padding:8px 12px;border-radius:7px;cursor:pointer}
#menu div:hover{background:var(--sel)}
#menu .dg{color:var(--danger)}
#pop{position:fixed;z-index:65;top:calc(50px + env(safe-area-inset-top));right:10px;background:var(--card);border-radius:14px;box-shadow:0 16px 50px rgba(0,0,0,.2),0 0 0 1px var(--line);padding:12px 14px;display:none;font:13px var(--ui);color:var(--fg);width:min(330px,94vw)}
#pop .pr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
#pop .pr span{color:var(--soft)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#222;color:#eee;border-radius:12px;padding:10px 14px;font:13.5px var(--ui);z-index:90;opacity:0;pointer-events:none;transition:.25s;display:flex;gap:14px;align-items:center;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:none;border:0;color:#5cc3ff;font-weight:600;cursor:pointer;padding:0}
#fatal{position:fixed;top:0;right:0;bottom:0;left:0;display:none;place-items:center;text-align:center;padding:30px;font:16px/1.6 var(--ui);color:var(--soft);background:var(--bg);z-index:200}

/* preview */
#preview{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:var(--bg);overflow-y:auto;display:none}
#preview.open{display:block}
#prbar{position:sticky;top:0;display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--bg);font:13px var(--ui);color:var(--soft);z-index:2}
#prbar .sp{flex:1}
.prose{max-width:36em;margin:0 auto;padding:30px 26px 120px;font:19px/1.7 "Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif;color:var(--fg);hyphens:auto;-webkit-hyphens:auto}
.prose h1,.prose h2,.prose h3{font-family:var(--ui);line-height:1.25;color:var(--h)}
.prose h1{font-size:1.7em;margin:2.4em 0 1.2em}
.prose h1:first-child{margin-top:.6em}
.prose h2{font-size:1.25em;margin:2em 0 .8em}
.prose p{margin:0}
.prose p+p{text-indent:1.4em}
.prose hr{border:0;text-align:center;margin:1.6em 0}
.prose hr:after{content:"* * *";color:var(--soft);letter-spacing:.4em}
.prose blockquote{margin:1em 0;padding-left:1em;border-left:3px solid var(--line);color:var(--soft)}
.prose pre{font:14px/1.5 var(--font);background:var(--panel);padding:12px;border-radius:8px;overflow:auto}
.prose code{font-family:var(--font);font-size:.85em}
.prose ul,.prose ol{margin:.6em 0}
.prose img{max-width:100%}
.prose .chap{break-before:page}
@media print{
  body>*:not(#preview){display:none!important}
  #preview{position:static;display:block!important;overflow:visible;background:#fff}
  #prbar{display:none}
  .prose{color:#000;max-width:none;padding:0;font-size:11.5pt}
  @page{margin:2.2cm 2cm}
}
</style>
</head>
<body>
<div id="goalbar" style="width:0"></div>

let setT;

/* ================= highlighter ================= */

const FILL = /(eigentlich|irgendwie|irgendwo|quasi|halt|eben|wirklich|ziemlich|einfach|gewissermaßen|sozusagen|natürlich|vielleicht|bisschen|letztendlich|gewiss|durchaus|absolut|total|regelrecht|praktisch|tatsächlich|förmlich|äußerst|relativ|mehr oder weniger|irgendein\w*|scheinbar|sicherlich|überhaupt|ohnehin|nun mal|ja auch)(?![\p{L}])|([\p{L}]{2,})(\s+)\2(?![\p{L}])/giu;

/* ================= saving ================= */

/* ================= markdown → html ================= */
function inlineMd(s, xhtml) {

    .replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, xhtml ? "$1" : '<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (m, t, u) => /^(https?:|mailto:)/i.test(u.replace(/&amp;/g, "&")) ? `<a href="${u}">${t}</a>` : t)

  return h;
}
function mdToHtml(text, xhtml = false) {

    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) { const n = m[1].length; out.push(`<h${n}>${inlineMd(m[2].replace(/\s+#+\s*$/, ""), xhtml)}</h${n}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push(xhtml ? "<hr/>" : "<hr>"); i++; continue; }
    if (/^\s*>/.test(l)) { const buf = []; while (i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, "")); out.push("<blockquote>" + buf.filter(x => x.trim()).map(x => "<p>" + inlineMd(x, xhtml) + "</p>").join("") + "</blockquote>"); continue; }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ord = /^\s*\d/.test(l); const buf = [];
      while (i < L.length && /^\s*([-*+]|\d+[.)])\s+/.test(L[i])) { let t = L[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, ""); t = t.replace(/^\[([ xX])\]\s+/, (m, c) => c === " " ? "☐ " : "☑ "); buf.push("<li>" + inlineMd(t, xhtml) + "</li>"); }
      out.push((ord ? "<ol>" : "<ul>") + buf.join("") + (ord ? "</ol>" : "</ul>")); continue;
    }
    if (!xhtml && (m = /^!\[([^\]]*)\]\(([^)\s]+)[^)]*\)\s*$/.exec(l))) { out.push(`<figure><img alt="${esc(m[1])}" src="${esc(m[2])}"></figure>`); i++; continue; }
    out.push("<p>" + inlineMd(l, xhtml) + "</p>"); i++;

}

/* ================= export ================= */
const fileSafe = s => (s || "Text").replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, " ").trim().slice(0, 80) || "Text";

}

}

  const epub = buildEpub(b, chs, tx);
  return saveFile(fileSafe(b.title) + ".epub", new Blob([epub], { type: "application/epub+zip" }), "application/epub+zip");

/* --- tiny zip (store) --- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const name = enc.encode(f.name), data = typeof f.data === "string" ? enc.encode(f.data) : f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true); h.setUint16(10, tm, true); h.setUint16(12, dt, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);

    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);

function buildEpub(b, chs, tx) {

  return zip(files);
}

/* ================= shortcuts & buttons ================= */
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (e.key === "Escape") {
    if ($("#menu").style.display === "block") return hideMenu();
    if ($("#pop").style.display === "block") { $("#pop").style.display = "none"; return; }
    if (pal.classList.contains("open")) return closePalette();
    if (qc.classList.contains("open")) return closeCapture();
    if ($("#preview").classList.contains("open")) return closePreview();
    if (document.activeElement?.closest?.(".panel") && document.activeElement.matches("input,textarea,[contenteditable=true]")) return;
    if ($("#notes").classList.contains("open")) return closePanel("notes");
    if ($("#lib").classList.contains("open")) return closePanel("lib");
    return;
  }
  if (!mod || e.altKey) return;
  if (k === "k" && !e.shiftKey) { e.preventDefault(); pal.classList.contains("open") ? closePalette() : openPalette(); }
  else if (k === "j" && !e.shiftKey) { e.preventDefault(); const s = ta.value.slice(ta.selectionStart, ta.selectionEnd); openCapture(document.activeElement === ta ? s : ""); }
  else if (k === "d" && !e.shiftKey) { e.preventDefault(); toggleFocus(); }
  else if (k === "e" && e.shiftKey) { e.preventDefault(); togglePanel("lib"); }
  else if (k === "g" && e.shiftKey) { e.preventDefault(); togglePanel("notes"); }
  else if (k === "s" && !e.shiftKey) { e.preventDefault(); S.dirty = S.dirty || !!S.chId; doSave().then(() => toast("Gespeichert", null, 1000)); }
  else if (k === "p" && !e.shiftKey) { e.preventDefault(); openPreview("book", true); }
}, true);

  });
}
