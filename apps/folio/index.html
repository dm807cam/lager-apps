<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f0ea">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0c10">
<title>Folio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<style>
:root{color-scheme:light;--bg:#f4f0ea;--surface:#fffdfa;--surface-2:#f2ede6;--surface-3:#e7e0d6;--border:rgba(40,20,40,.07);--text:#1e1a22;--text-2:#4f4855;--text-3:#8b8490;--grid:#ece6dd;--good:#2f7d62;--good-bg:rgba(47,125,98,.1);--bad:#b8483f;--bad-bg:rgba(184,72,63,.09);--shadow:0 1px 1px rgba(0,0,0,.025),0 8px 24px rgba(40,20,40,.06);--radius:24px;
  --btn:#5b3b6e;--btn-ink:#fff;--hero-l:#9a7aa8;--hero-m:#5b3b6e;--hero-d:#2c1c38;--gold:#e9b872;--seg-on:var(--surface);--glow:rgba(255,206,164,.32);--h0:#ebe4da;--h1:#dccbe3;--h2:#b996c8;--h3:#86609c;--h4:#53346a}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0e0c10;--surface:#17141a;--surface-2:#201c24;--surface-3:#2b2630;--border:rgba(255,255,255,.06);--text:#f1ecf3;--text-2:#c7bfcc;--text-3:#8f8795;--grid:#241f28;--good:#6cc79f;--good-bg:rgba(108,199,159,.12);--bad:#e57d72;--bad-bg:rgba(229,125,114,.12);--shadow:0 1px 1px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --btn:#cfaee0;--btn-ink:#1b1220;--hero-l:#6b4c7c;--hero-m:#3f2950;--hero-d:#1b1023;--seg-on:var(--surface-3);--glow:rgba(255,190,140,.16);--h0:#211c25;--h1:#3b2c46;--h2:#5d4170;--h3:#8a63a0;--h4:#c49bd8}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
.col{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.serif{font-family:"Literata","Iowan Old Style",Charter,Georgia,serif}
.num{font-variant-numeric:tabular-nums}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand svg{width:32px;height:32px;border-radius:9px;flex:none;box-shadow:0 4px 12px rgba(44,28,56,.3)}
.hbtns{display:flex;gap:8px}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);display:grid;place-items:center;padding:0;flex:none}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:var(--text-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.pri{background:var(--btn);border-color:transparent}
.iconbtn.pri svg{stroke:var(--btn-ink);stroke-width:2.2}
.iconbtn i{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--text-3);box-shadow:0 0 0 2px var(--surface)}
.iconbtn[data-s="ok"] i{background:var(--good)}
.iconbtn[data-s="error"] i,.iconbtn[data-s="slow"] i{background:var(--bad)}
.iconbtn[data-s="saving"] i,.iconbtn[data-s="loading"] i{background:var(--btn)}

/* Segmented */
.seg{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:12px}
.seg button{flex:1;border:0;background:transparent;font-size:13px;font-weight:550;color:var(--text-2);padding:7px 11px;border-radius:9px;min-height:34px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--text);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-h > div{min-width:0}
.card-h h2,.card-t{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.sub{display:block;font-size:12.5px;color:var(--text-3);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2 .wide{grid-column:1/-1}}

/* Buttons */
.btn{border:0;background:var(--btn);color:var(--btn-ink);font-weight:650;font-size:15px;padding:11px 20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn2{border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px}
.btn2.sm{font-size:13px;padding:6px 12px;min-height:34px}
.btn2.danger{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.btn svg,.btn2 svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1;min-width:0}
.tf{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:10px 12px;min-height:44px;outline:none}
.tf:focus{border-color:var(--btn)}
textarea.tf{min-height:110px;resize:vertical;line-height:1.45}
.lab{display:block;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin:16px 0 7px}

/* Hero: continue reading */
.hero{position:relative;color:#fff;border-radius:28px;padding:20px;display:flex;gap:18px;align-items:center;overflow:hidden;min-height:200px;
  background:radial-gradient(110% 90% at 100% 0%,var(--glow),transparent 60%),linear-gradient(160deg,var(--tint-l,var(--hero-l)) 0%,var(--tint-m,var(--hero-m)) 55%,var(--tint-d,var(--hero-d)) 100%);box-shadow:0 14px 34px rgba(44,28,56,.25)}
.hero .cv{width:112px;flex:none;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.hero .lbl{font-size:12.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.hero h2{margin:6px 0 2px;font-family:"Literata","Iowan Old Style",Charter,Georgia,serif;font-size:clamp(21px,5.2vw,28px);font-weight:600;line-height:1.15;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .au{font-size:14px;color:rgba(255,255,255,.78)}
.hero .ch{font-size:13px;color:rgba(255,255,255,.66);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.hero .go{margin-top:14px;border:0;background:#fff;color:var(--tint-d,var(--hero-d));font-weight:700;font-size:15px;padding:11px 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.hero .go svg{width:15px;height:15px;fill:currentColor}
.hero .goal{position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(255,255,255,.8);background:rgba(0,0,0,.14);padding:5px 10px 5px 6px;border-radius:999px}
.hero .goal svg{width:22px;height:22px}
@media (max-width:420px){.hero{flex-direction:column;align-items:flex-start;padding-top:56px}.hero .cv{width:96px}}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-size:12.5px;font-weight:650;padding:4px 10px;background:rgba(255,255,255,.15);color:#fff;white-space:nowrap}

/* Covers */
.cv{position:relative;aspect-ratio:2/3;border-radius:4px 7px 7px 4px;overflow:hidden;background:var(--surface-3);box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 18px rgba(40,20,40,.14)}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--surface-3)}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.08) 3%,rgba(0,0,0,0) 7%,rgba(0,0,0,0) 94%,rgba(0,0,0,.08));pointer-events:none}
.gcv{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12% 10% 10%;color:#fff;text-align:center;font-family:"Literata","Iowan Old Style",Charter,Georgia,serif}
.gcv::before{content:"";position:absolute;inset:6%;border:1px solid rgba(255,255,255,.35);border-radius:2px}
.gcv b{font-weight:600;font-size:var(--gs,15px);line-height:1.15;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;position:relative}
.gcv span{font-size:calc(var(--gs,15px)*.62);letter-spacing:.08em;text-transform:uppercase;opacity:.82;position:relative;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Shelf */
.shelf-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shelf-h .seg{flex:1;min-width:250px}
.shelf-h select{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 10px;min-height:40px;font-size:13px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);fill:none;stroke:var(--text-3);stroke-width:2;stroke-linecap:round}
.search input{padding-left:36px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:22px 16px;padding:4px 2px}
@media (min-width:700px){.books{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:26px 20px}}
.bk{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px;min-width:0}
.bk .cv{transition:transform .2s ease,box-shadow .2s}
@media (hover:hover){.bk:hover .cv{transform:translateY(-3px);box-shadow:0 2px 3px rgba(0,0,0,.12),0 14px 26px rgba(40,20,40,.2)}}
.bk .t{font-size:13.5px;font-weight:650;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .a{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-4px}
.pbar{height:3px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--btn)}
.badge{position:absolute;top:7px;left:7px;font-size:10.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;z-index:1;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.badge.done{background:rgba(47,125,98,.92);top:auto;bottom:7px;left:auto;right:7px;font-size:0;width:24px;height:24px;padding:0;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.badge.done::before{content:"✓";font-size:13px;font-weight:800}
.bk .a .new{color:var(--btn);font-weight:700}
.empty{text-align:center;padding:36px 18px}
.empty svg.ill{width:120px;height:120px;margin:0 auto 6px;display:block}
.empty h2{margin:6px 0;font-size:21px;letter-spacing:-.01em}
.empty p{color:var(--text-2);max-width:42ch;margin:6px auto 16px}
.small{font-size:12.5px;color:var(--text-3)}
.small a{color:var(--btn);font-weight:600}
.drop{position:fixed;inset:0;z-index:80;background:rgba(44,28,56,.55);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.drop div{border:2px dashed rgba(255,255,255,.7);border-radius:28px;padding:44px 54px}
.imp{display:flex;align-items:center;gap:14px}
.imp .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--btn);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-top:1px solid var(--border);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.li:first-child{border-top:0}
.li .cv{width:38px;flex:none}
.li .q{font-family:"Literata","Iowan Old Style",Charter,Georgia,serif;font-size:15px;line-height:1.45;padding-left:11px;border-left:3px solid var(--mk,#f2c94c)}
.li .n{font-size:13.5px;color:var(--text-2);margin-top:6px;white-space:pre-wrap}
.li .m{font-size:12px;color:var(--text-3);margin-top:5px}
.grp{display:flex;align-items:center;gap:12px;margin:4px 0 6px}
.grp .cv{width:34px}
.grp b{font-size:15px}

/* Stats */
.shero{position:relative;color:#fff;border-radius:28px;padding:20px;overflow:hidden;display:grid;gap:16px;
  background:radial-gradient(110% 90% at 100% 0%,var(--glow),transparent 60%),linear-gradient(160deg,var(--hero-l) 0%,var(--hero-m) 55%,var(--hero-d) 100%);box-shadow:0 14px 34px rgba(44,28,56,.25)}
.shero .top{display:flex;gap:16px;align-items:center}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .v b{font-size:30px;font-weight:700;letter-spacing:-.03em;display:block}
.ring .v span{font-size:11.5px;color:rgba(255,255,255,.7)}
.shero .lbl{font-size:13px;color:rgba(255,255,255,.72)}
.shero .big{font-size:clamp(30px,8vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:3px}
.shero .line{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;min-width:0}
.tile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.62)}
.tile .v{font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .n{font-size:12px;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:14px;position:relative}
.week .c{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .b{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--h2);min-height:3px}
.week .b.met{background:var(--btn)}
.week .b.z{background:var(--surface-3)}
.week span{font-size:11.5px;color:var(--text-3)}
.week span.today{color:var(--text);font-weight:700}
.week .gl{position:absolute;left:0;right:0;border-top:1.5px dashed var(--text-3);opacity:.45;pointer-events:none}
.week .gl em{position:absolute;right:0;top:-17px;font-size:10.5px;font-style:normal;color:var(--text-3)}
.heat{overflow-x:auto;margin-top:12px;padding-bottom:4px}
.heat svg{display:block}
.legend{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-3);justify-content:flex-end;margin-top:8px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.kv div{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.kv b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--text-3)}
.done-row{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 4px}
.done-row .cv{width:64px;flex:none}
.goalbar{height:8px;border-radius:9px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.goalbar i{display:block;height:100%;background:var(--btn);border-radius:9px}
.link{display:flex;gap:12px;align-items:center}
.link .lg{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;background:#c2521f}
.link .lg svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text-3);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--good)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(14,10,18,.42);z-index:60;opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);color:var(--text);border-radius:24px 24px 0 0;max-height:88vh;max-height:88dvh;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.2);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--surface-3);margin:0 auto 12px}
.sheet h2{margin:0;font-size:20px;letter-spacing:-.01em}
@media (min-width:720px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-height:84vh;border-radius:24px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .25s,opacity .2s}.sheet.on{transform:translate(-50%,-50%);opacity:1}.sheet .grab{display:none}}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#221a28;color:#fff;font-size:14px;font-weight:550;padding:11px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:120;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.det{display:flex;gap:16px;align-items:flex-start}
.det .cv{width:110px;flex:none}
.det h2{font-family:"Literata","Iowan Old Style",Charter,Georgia,serif;font-weight:600;font-size:22px;line-height:1.2}
.desc{font-size:14px;color:var(--text-2);line-height:1.55;margin-top:12px;max-height:9.3em;overflow:hidden;position:relative}
.desc.open{max-height:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* ============ Reader ============ */
.rd{position:fixed;inset:0;z-index:40;background:var(--rbg);color:var(--rink);overflow:hidden;--rbg:#fbf8f3;--rink:#211c18;--rink2:#857c72;--rchrome:rgba(251,248,243,.94);--rline:rgba(60,40,20,.1);--rsel:rgba(91,59,110,.22);--rlink:#6d4686;--rbtn:#5b3b6e;
  --hy:rgba(255,206,40,.42);--hg:rgba(110,200,120,.36);--hb:rgba(90,170,255,.32);--hp:rgba(255,120,170,.32);
  user-select:none;-webkit-user-select:none}
.rd[data-rt="sepia"]{--rbg:#f3e7d3;--rink:#3b2d1f;--rink2:#8c7559;--rchrome:rgba(243,231,211,.95);--rline:rgba(90,60,20,.14);--rlink:#7c4a1e;--rbtn:#7c4a1e;--rsel:rgba(124,74,30,.22)}

const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const keyDate=k=>{const p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])};
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=s=>{let x=5381;for(let i=0;i<s.length;i++)x=(x*33^s.charCodeAt(i))>>>0;return x};
const plural=(n,a,b)=>n+" "+(n===1?a:(b||a+"s"));

/* ---------- toast ---------- */
let toastT=0;

/* ---------- sync indicator ---------- */
const SYNC_TXT={local:"Storage isn’t available here, so nothing can be saved.",loading:"Loading your library…",slow:"Can’t reach your library yet.",ok:"Everything is saved to your account.",saving:"Saving…",error:"Something didn’t save. Folio retries by itself."};
let inflight=0,syncErr=false;
function setSync(s){sync=s;const b=$("syncbtn");b.dataset.s=s;b.setAttribute("aria-label","Sync status: "+(SYNC_TXT[s]||""))}
function track(p){inflight++;setSync("saving");
  return p.then(v=>{inflight--;if(!inflight)setSync(syncErr?"error":"ok");return v},
    e=>{inflight--;syncErr=true;setSync("error");console.warn("Folio write failed",e);
      if(e&&e.code==="quota_exceeded")toast("Your storage on this server is full.");setTimeout(()=>{syncErr=false;if(!inflight&&sync==="error")setSync("ok")},15000);throw e})}
const P=s=>base+"/"+s;
const docRef=p=>db.doc(P(p));
const colRef=p=>db.collection(P(p));
function put(p,data){if(!db)return Promise.reject({code:"local"});return track(docRef(p).set(data))}
function patch(p,data){if(!db)return Promise.reject({code:"local"});return track(docRef(p).update(data))}
function del(p){if(!db)return Promise.reject({code:"local"});return track(docRef(p).delete())}
const quiet=p=>p.catch(()=>{});

/* ---------- derived data ---------- */
function books(){return[...BOOKS.values()].filter(b=>b&&b.ready&&!deleted.has(b.id))}
function sessions(){return[...SESS.values()].filter(s=>s&&isFinite(s.start)&&s.ms>0)}
function marksOf(bid,kind){return[...MARKS.values()].filter(m=>m.bookId===bid&&(!kind||m.kind===kind)).sort((a,b)=>a.ch-b.ch||a.start-b.start)}
function chStarts(b){if(b._st)return b._st;const st=[];let s=0;(b.chapters||[]).forEach(c=>{st.push(s);s+=c.c||0});b._st=st;b._tot=s||1;return st}
function total(b){chStarts(b);return b._tot}
function gpos(b,ch,off){const st=chStarts(b);ch=clamp(ch|0,0,Math.max(0,st.length-1));return (st[ch]||0)+clamp(off||0,0,((b.chapters||[])[ch]||{}).c||0)}
function fromG(b,g){const st=chStarts(b);let ch=0;for(let i=0;i<st.length;i++)if(st[i]<=g)ch=i;return{ch,off:Math.max(0,Math.min((b.chapters[ch]||{}).c||0,g-st[ch]))}}
function pct(b){if(b.finishedAt)return 1;const p=b.progress;if(!p)return 0;return clamp(gpos(b,p.ch,p.off)/total(b),0,1)}
function status(b){if(b.finishedAt)return"done";if(b.progress&&(b.progress.ch>0||b.progress.off>0))return"reading";return"new"}
function chapterTitle(b,ch){const c=(b.chapters||[])[ch];if(!c)return"";if(c.t)return c.t;let t="";(b.toc||[]).forEach(e=>{if(e.ch<=ch&&!t)t="";if(e.ch===ch&&!t)t=e.t});return t||("Section "+(ch+1))}
function tocEntryAt(b,ch,off){let cur=-1;(b.toc||[]).forEach((e,i)=>{if(e.ch<ch||(e.ch===ch&&(e.o||0)<=off+1))cur=i});return cur}
function bookMs(bid){return sessions().filter(s=>s.bookId===bid).reduce((a,s)=>a+s.ms,0)}
function minutesByDay(){const m={};sessions().forEach(s=>{const k=dayKey(s.start);m[k]=(m[k]||0)+s.ms/MIN});return m}
/* characters per minute, from the last 40 sessions that moved forward; 1100 (about 200 words) until there is enough */
function cpm(){const L=sessions().filter(s=>s.chars>200&&s.ms>2*MIN).sort((a,b)=>b.start-a.start).slice(0,40);
  const c=L.reduce((a,s)=>a+s.chars,0),m=L.reduce((a,s)=>a+s.ms/MIN,0);
  if(m<15)return 1100;return clamp(c/m,300,4000)}
function fmtMin(m){m=Math.round(m);if(m<1)return"under a minute";if(m<60)return m+" min";const h=Math.floor(m/60),r=m%60;return h+" h"+(r?" "+r+" min":"")}
function fmtDur(ms){const m=Math.round(ms/MIN);if(m<60)return m+" min";const h=Math.floor(m/60),r=m%60;return h+"h "+pad(r)+"m"}
function fmtDay(t,o){return new Date(t).toLocaleDateString(undefined,o||{day:"numeric",month:"short",year:"numeric"})}
function streak(){const m=minutesByDay();let n=0;const d=new Date();d.setHours(12,0,0,0);
  if(!(m[dayKey(d)]>=1))d.setDate(d.getDate()-1);
  while(m[dayKey(d)]>=1){n++;d.setDate(d.getDate()-1)}return n}
function bestStreak(){const ks=Object.keys(minutesByDay()).filter(k=>minutesByDay()[k]>=1).sort();let best=0,run=0,prev=null;
  ks.forEach(k=>{const t=keyDate(k).getTime();run=prev!=null&&Math.round((t-prev)/DAY)===1?run+1:1;prev=t;best=Math.max(best,run)});return best}

/* ---------- covers ---------- */
function coverHTML(b,gs){
  const h=hash((b.title||"")+(b.author||""))%360;
  const gen=`<div class="gcv" style="background:linear-gradient(160deg,hsl(${h} 32% 42%),hsl(${(h+24)%360} 38% 20%));--gs:${gs||15}px"><b>${esc(b.title||"Untitled")}</b><span>${esc(b.author||"")}</span></div>`;
  return`<div class="cv">${gen}${b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy" decoding="async">`:""}</div>`}
function tintVars(b){if(!b.tint)return"";const [r,g,bl]=b.tint;const mix=(k,f)=>Math.round(k*f);
  return`--tint-l:rgb(${mix(r,.95)},${mix(g,.95)},${mix(bl,.95)});--tint-m:rgb(${mix(r,.6)},${mix(g,.6)},${mix(bl,.6)});--tint-d:rgb(${mix(r,.28)},${mix(g,.28)},${mix(bl,.28)})`}

/* ---------- remote ---------- */
function takeBook(id,r){
  if(deleted.has(id))return false;
  const mine=BOOKS.get(id);
  if(mine&&(mine.updatedAt||0)>(r.updatedAt||0))return false;
  const b=clone(r);b.id=id;
  if(RD.open&&RD.book&&RD.book.id===id){
    const rp=b.progress,lp=RD.book.progress;
    if(rp&&rp.dev!==DEV&&(!lp||rp.at>lp.at+2000))offerRemote(rp);
    b.progress=lp&&(!rp||lp.at>=rp.at)?lp:b.progress;
    b._st=null;RD.book=b;
  }
  BOOKS.set(id,b);return true}
async function pageBy(col,f){const out=new Map();let last=null;
  for(let n=0;n<200;n++){const q=last==null?col.orderBy(f):col.where(f,">=",last).orderBy(f);const s=await q.limit(1000).get();let fresh=0;
    s.docs.forEach(d=>{if(!out.has(d.id)){out.set(d.id,d.data());fresh++}});
    if(s.size<1000||!fresh)break;const nl=s.docs[s.docs.length-1].data()[f];if(nl==null||nl===last)break;last=nl}
  return out}
async function loadSessions(tries){
  const col=colRef("lib/sessions");
  try{
    const all=await pageBy(col,"start");
    all.forEach((v,k)=>{if(v)SESS.set(k,clone(v))});
    loaded.sess=true;sessComplete=true;refresh();
    col.orderBy("start","desc").limit(40).onSnapshot(s=>{let c=false;s.docChanges().forEach(ch=>{if(ch.type==="removed"){if(SESS.delete(ch.doc.id))c=true}else{const d=ch.doc.data();const mine=SESS.get(ch.doc.id);if(d&&(!mine||(d.end||0)>=(mine.end||0))){SESS.set(ch.doc.id,clone(d));c=true}}});if(c)refresh()},()=>{});
  }catch(e){setTimeout(()=>loadSessions((tries||0)+1),Math.min(60000,5000*((tries||0)+1)))}
}
async function initRemote(){
  if(!R||!R.use){setSync("local");renderAll();return}
  try{
    [db,user]=await Promise.all([R.use("db"),R.use("user")]);
    R.use("assets").then(a=>{assets=a}).catch(()=>{});
    R.use("downloads").then(d=>{downloads=d}).catch(()=>{});
    if(user){try{uname=((await user.name())||"").split(" ")[0]}catch(e){}}
    if(!db||!user){db=null;setSync("local");renderAll();return}
    uid=await user.id();if(!uid){db=null;setSync("local");renderAll();return}
    base="data/users/"+uid;
    const slow=setTimeout(()=>{if(sync==="loading")setSync("slow")},10000);
    docRef("settings").onSnapshot(s=>{const d=s.exists?s.data():null;if(d&&(d.updatedAt||0)>=(SET.updatedAt||0)){SET=Object.assign({},DEFAULTS,clone(d));if(RD.open)applyReader(true);refresh()}},()=>{});
    colRef("lib/books").limit(1000).onSnapshot(snap=>{
      clearTimeout(slow);const seen=new Set();let c=false;
      snap.docs.forEach(d=>{const r=d.data();if(!r)return;seen.add(d.id);pendingBooks.delete(d.id);if(takeBook(d.id,r))c=true});
      [...BOOKS.keys()].forEach(id=>{if(!seen.has(id)&&!pendingBooks.has(id)){BOOKS.delete(id);c=true}});
      const first=!loaded.books;loaded.books=true;if(sync==="loading"||sync==="slow")setSync("ok");
      if(c||first)refresh();
      if(first)route();
    },()=>{clearTimeout(slow);setSync("error")});
    colRef("lib/marks").orderBy("updatedAt","desc").limit(1000).onSnapshot(snap=>{
      const seen=new Set();snap.docs.forEach(d=>{const r=d.data();if(!r)return;seen.add(d.id);const mine=MARKS.get(d.id);if(!mine||(r.updatedAt||0)>=(mine.updatedAt||0))MARKS.set(d.id,clone(r))});
      [...MARKS.keys()].forEach(id=>{if(!seen.has(id)&&!MARKS.get(id)._local)MARKS.delete(id)});
      loaded.marks=true;refresh();if(RD.open)marksChanged();
    },()=>{});
    loadSessions(0);
    docRef("bridge/habit-tracker/state").get().then(s=>{if(s.exists)bridgeAt=s.data().at||0}).catch(()=>{});
  }catch(e){console.warn(e);db=null;setSync("local");renderAll()}
}

function saveSettings(){SET.updatedAt=Date.now();clearTimeout(setT);setT=setTimeout(()=>{const o={};Object.keys(DEFAULTS).forEach(k=>o[k]=SET[k]);o.updatedAt=SET.updatedAt;quiet(put("settings",o))},600)}

/* ---------- import: EPUB, plain text, Markdown and HTML become sanitised chapters ----------
   A book is stored as data/users/<uid>/lib/books/<id> (metadata, chapters, contents) plus its chapter text in
   .../books/<id>/ch/<chapter>_<part>, at most CHUNK characters per document. Images go to Lager assets. */
const CHUNK=60000;
let JSZipP=null;
function loadZip(){if(window.JSZip)return Promise.resolve(window.JSZip);
  if(!JSZipP)JSZipP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";s.onload=()=>res(window.JSZip);s.onerror=()=>{JSZipP=null;rej(new Error("Couldn’t load the EPUB reader. Check your connection."))};document.head.appendChild(s)});
  return JSZipP}

const KEEP=new Set("p div span br hr h1 h2 h3 h4 h5 h6 em i strong b u s sub sup small big blockquote pre code ul ol li dl dt dd table thead tbody tfoot tr td th caption colgroup col figure figcaption img a section article aside header footer cite q abbr ruby rt rp mark del ins var kbd samp center font address".split(" "));
const DROP=new Set("script style link meta title head iframe object embed form input button select textarea noscript audio video canvas template frame frameset applet math base".split(" "));
const INLINE=new Set("span em i strong b u s sub sup small big cite q abbr mark del ins var kbd samp code a font ruby rt rp".split(" "));

/* class name -> flags from the book's stylesheets (italic, bold, centred, right, small caps, underline, no indent, hidden) */
function cssFlags(cssText){
  const map={};cssText=cssText.replace(/\/\*[\s\S]*?\*\//g,"");
  const re=/([^{}@]+)\{([^{}]*)\}/g;let m;
  while((m=re.exec(cssText))){
    const body=m[2].toLowerCase(),f=[];
    if(/font-style\s*:\s*(italic|oblique)/.test(body))f.push("i");
    if(/font-weight\s*:\s*(bold|bolder|[6-9]00)/.test(body))f.push("b");
    if(/text-align\s*:\s*center/.test(body))f.push("c");
    if(/text-align\s*:\s*right/.test(body))f.push("r");
    if(/font-variant\s*:\s*small-caps/.test(body)||/font-variant-caps\s*:\s*(all-)?small-caps/.test(body))f.push("sc");
    if(/text-decoration[^;]*underline/.test(body))f.push("u");
    if(/text-indent\s*:\s*0(px|em|%)?\s*(;|$|!)/.test(body))f.push("ni");
    if(/display\s*:\s*none/.test(body))f.push("x");
    if(!f.length)continue;
    m[1].split(",").forEach(sel=>{const s=sel.trim();const k=s.match(/^(?:[a-z0-9]+)?\.([\w-]+)$/i);if(k)(map[k[1]]=map[k[1]]||new Set()),f.forEach(x=>map[k[1]].add(x))});
  }
  return map}
function styleFlags(st){const f=[];if(!st)return f;st=st.toLowerCase();
  if(/font-style\s*:\s*italic/.test(st))f.push("i");if(/font-weight\s*:\s*(bold|[6-9]00)/.test(st))f.push("b");
  if(/text-align\s*:\s*center/.test(st))f.push("c");if(/text-align\s*:\s*right/.test(st))f.push("r");
  if(/small-caps/.test(st))f.push("sc");if(/display\s*:\s*none/.test(st))f.push("x");return f}

function resolvePath(base,href){try{const u=new URL(href,"http://x/"+base.split("/").map(encodeURIComponent).join("/"));return decodeURIComponent(u.pathname.slice(1))+(u.hash||"")}catch(e){return href}}
function splitHash(p){const i=p.indexOf("#");return i<0?[p,""]:[p.slice(0,i),p.slice(i+1)]}

/* Build a clean copy of a body: only known tags, few attributes, links rewritten, images collected. */
function sanitize(srcRoot,ctx){
  const out=document.implementation.createHTMLDocument("x"),root=out.createElement("div");
  const walk=(node,parent)=>{
    for(let n=node.firstChild;n;n=n.nextSibling){
      if(n.nodeType===3){const pre=parent.closest&&parent.closest("pre");let t=n.nodeValue;if(!pre)t=t.replace(/[\t\n\r ]+/g," ");if(t)parent.appendChild(out.createTextNode(t));continue}
      if(n.nodeType!==1)continue;
      const tag=(n.localName||n.nodeName).toLowerCase();
      if(DROP.has(tag))continue;
      if(tag==="svg"){const im=n.querySelector("image");const h=im&&(im.getAttribute("xlink:href")||im.getAttributeNS("http://www.w3.org/1999/xlink","href")||im.getAttribute("href"));
        if(h){const img=out.createElement("img");img.setAttribute("data-p",resolvePath(ctx.path,h));ctx.imgs.add(img.getAttribute("data-p"));img.alt="";parent.appendChild(img)}continue}
      const cls=(n.getAttribute("class")||"").split(/\s+/).filter(Boolean);
      const fl=new Set(styleFlags(n.getAttribute("style")));cls.forEach(c=>{const s=ctx.css[c];if(s)s.forEach(x=>fl.add(x))});
      if(fl.has("x"))continue;fl.delete("x");
      const et=(n.getAttribute("epub:type")||n.getAttributeNS("http://www.idpf.org/2007/ops","type")||n.getAttribute("role")||"").toLowerCase();
      if(/pagebreak/.test(et)){if(n.id){const s=out.createElement("span");s.id=n.id;parent.appendChild(s)}continue}
      if(!KEEP.has(tag)){walk(n,parent);continue}
      let el;
      if(tag==="center"){el=out.createElement("div");fl.add("c")}
      else if(tag==="font"||tag==="big"){el=out.createElement("span")}
      else el=out.createElement(tag);
      if(n.id)el.id=n.id;
      if(n.getAttribute("title"))el.title=n.getAttribute("title");
      if(et)el.setAttribute("data-et",et.slice(0,40));
      if(tag==="td"||tag==="th"){["colspan","rowspan"].forEach(a=>{const v=n.getAttribute(a);if(v&&/^\d+$/.test(v))el.setAttribute(a,v)})}
      if(tag==="img"){const s=n.getAttribute("src");if(!s)continue;el.setAttribute("data-p",resolvePath(ctx.path,s));ctx.imgs.add(el.getAttribute("data-p"));el.alt=(n.getAttribute("alt")||"").slice(0,200);
        const w=parseInt(n.getAttribute("width"),10);if(w&&w<48)el.className="il"}
      if(tag==="a"){const h=n.getAttribute("href");
        if(h){if(/^(https?:|mailto:)/i.test(h)){el.setAttribute("href",h);el.setAttribute("target","_blank");el.setAttribute("rel","noopener noreferrer")}
          else if(!/^[a-z]+:/i.test(h)){const [p,f]=splitHash(h.startsWith("#")?ctx.path+h:resolvePath(ctx.path,h));const si=ctx.spineIdx[p];if(si!=null)el.setAttribute("data-h",si+"|"+f)}}
        if(/noteref/.test(et))el.className="nr"}
      if(fl.size)el.setAttribute("data-s",[...fl].join(" "));
      parent.appendChild(el);walk(n,el);
      if(INLINE.has(tag)&&!el.firstChild&&!el.id)el.remove();
    }
  };
  walk(srcRoot,root);
  return root}

/* character offset of an element inside a chapter: the length of all text before it */
function offsetIn(root,el){const r=(root.ownerDocument||document).createRange();r.selectNodeContents(root);try{r.setEndBefore(el)}catch(e){return 0}return r.toString().length}

async function blobDims(blob){try{const b=await createImageBitmap(blob);const d=[b.width,b.height];b.close&&b.close();return d}catch(e){return null}}
async function shrink(blob,max,q){
  try{const bm=await createImageBitmap(blob);let {width:w,height:h}=bm;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(bm,0,0,w,h);bm.close&&bm.close();
    const out=await new Promise(r=>c.toBlob(r,"image/jpeg",q||.85));return out||blob}catch(e){return blob}}
async function avgColor(blob){try{const bm=await createImageBitmap(blob);const c=document.createElement("canvas");c.width=12;c.height=18;const g=c.getContext("2d");g.drawImage(bm,0,0,12,18);bm.close&&bm.close();
  const d=g.getImageData(0,0,12,18).data;let r=0,gg=0,b=0,n=0;for(let i=0;i<d.length;i+=4){r+=d[i];gg+=d[i+1];b+=d[i+2];n++}
  r/=n;gg/=n;b/=n;const mx=Math.max(r,gg,b)||1,f=Math.min(1.6,200/mx);return[Math.round(clamp(r*f,30,235)),Math.round(clamp(gg*f,30,235)),Math.round(clamp(b*f,30,235))]}catch(e){return null}}
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
const MIME={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif",svg:"image/svg+xml",webp:"image/webp"};
/* stores one image and returns its address; without assets small images are kept inline */
async function storeImage(blob,name,opts){
  const ext=(name.split(".").pop()||"").toLowerCase();let type=MIME[ext]||blob.type||"image/jpeg";
  blob=new Blob([blob],{type});
  if(type!=="image/svg+xml"&&type!=="image/gif"&&(blob.size>700000||opts&&opts.max)){const s=await shrink(blob,opts&&opts.max||1800,.85);if(s.size<blob.size){blob=s;type="image/jpeg"}}
  if(assets){try{const r=await assets.upload(blob,{type});const url=typeof r==="string"?r:(r&&(r.url||(r.id&&"/_blob/"+r.id)));if(url)return{url,stored:true,blob}}catch(e){console.warn("upload failed",e)}}
  if(blob.size>350000){const s=await shrink(blob,1000,.72);if(s.size>350000)return null;blob=s}
  return{url:await blobToData(blob),stored:false,blob}}

  if(kind==="csv"){const rows=[["date","start","end","minutes","pages","title","author"]].concat(sessions().sort((a,b)=>a.start-b.start).map(s=>[dayKey(s.start),new Date(s.start).toISOString(),new Date(s.end).toISOString(),(s.ms/MIN).toFixed(1),Math.round((s.chars||0)/CPS),s.title,s.author||""]));
    await downloads.save({filename:"folio-sessions.csv",data:new Blob([rows.map(r=>r.map(v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(",")).join("\n")],{type:"text/csv"})})}
  else{const strip=b=>{const o=Object.assign({},b);delete o._st;delete o._tot;return o};await downloads.save({filename:"folio-export.json",data:new Blob([JSON.stringify({exportedAt:new Date().toISOString(),settings:SET,books:books().map(strip),marks:[...MARKS.values()],sessions:sessions()},null,1)],{type:"application/json"})})}

/* book details */
function openDetails(id){const b=BOOKS.get(id);if(!b)return;
  const draw=()=>{const b=BOOKS.get(id);if(!b){closeSheet();return""}const st=status(b),ms=bookMs(id),n=marksOf(id,"hl").length,ss=sessions().filter(s=>s.bookId===id);
    const left=Math.max(0,total(b)-(b.progress?gpos(b,b.progress.ch,b.progress.off):0))/cpm();
    return`<div class="det">${coverHTML(b,14)}<div class="sp"><h2>${esc(b.title)}</h2><div class="sub" style="font-size:14px;margin-top:4px">${esc(b.author||"Unknown author")}</div>

      <div class="pbar" style="margin-top:12px;height:5px"><i style="width:${pct(b)*100}%"></i></div><div class="sub">${st==="done"?"Finished "+esc(fmtDay(b.finishedAt)):st==="new"?"Not started · about "+esc(fmtMin(total(b)/cpm())):Math.floor(pct(b)*100)+"% · "+esc(fmtMin(left))+" left"}</div></div></div>
      ${b.desc?`<div class="desc" id="desc">${esc(b.desc)}</div>${b.desc.length>420?'<button type="button" class="btn2 sm" style="margin-top:6px" data-act="more">More</button>':""}`:""}
      <div class="kv"><div><b>${esc(ms?fmtDur(ms):"—")}</b><span>time reading</span></div><div><b>${ss.length}</b><span>${ss.length===1?"session":"sessions"}${ss.length?" since "+esc(fmtDay(Math.min(...ss.map(s=>s.start)),{day:"numeric",month:"short"})):""}</span></div>
      <div><b>${n}</b><span>${n===1?"highlight":"highlights"}</span></div><div><b>${esc(fmtDay(b.addedAt,{day:"numeric",month:"short",year:"numeric"}))}</b><span>added</span></div></div>
      <div class="acts"><button type="button" class="btn" data-open="${esc(id)}">${IC.play.replace("<svg",'<svg style="fill:currentColor;stroke:none"')}${st==="reading"?"Continue":st==="done"?"Read again":"Start reading"}</button>
      ${st!=="done"?`<button type="button" class="btn2" data-bact="finish">Mark as finished</button>`:`<button type="button" class="btn2" data-bact="unfinish">Mark as unread</button>`}
      ${st==="reading"?`<button type="button" class="btn2" data-bact="restart">Start over</button>`:""}
      ${n&&downloads?`<button type="button" class="btn2" data-bact="export">${IC.dl}Notes</button>`:""}
      <button type="button" class="btn2 danger" data-bact="delete">Remove</button></div>`};
  openSheet(draw(),{live:()=>rerenderSheet(draw())});$("sheet")._book=id}
async function bookAction(act,id){const b=BOOKS.get(id);if(!b)return;const now=Date.now();
  if(act==="finish"){b.finishedAt=now;b.updatedAt=now;quiet(patch("lib/books/"+id,{finishedAt:now,updatedAt:now}));toast("Marked as finished")}
  if(act==="unfinish"){b.finishedAt=null;b.progress=null;b.updatedAt=now;quiet(patch("lib/books/"+id,{finishedAt:null,progress:null,updatedAt:now}))}
  if(act==="restart"){b.progress={ch:0,off:0,pct:0,at:now,dev:DEV};b.finishedAt=null;b.updatedAt=now;quiet(patch("lib/books/"+id,{progress:b.progress,finishedAt:null,updatedAt:now}))}
  if(act==="export"){exportNotes([id],b.title+" – notes");return}
  if(act==="delete"){
    if(!$("sheet").querySelector("[data-bact=delete-yes]")){const a=$("sheet").querySelector(".acts");a.insertAdjacentHTML("afterend",`<div class="card" style="margin-top:14px;background:var(--bad-bg);box-shadow:none;border:0"><b>Remove “${esc(b.title)}”?</b><p class="sub" style="margin:4px 0 10px">The book, its pictures${marksOf(id).length?", and its "+plural(marksOf(id).length,"highlight","highlights and bookmarks"):""} are deleted from your account. Reading time stays in your stats.</p><div class="row"><button type="button" class="btn2 danger" data-bact="delete-yes">Remove book</button><button type="button" class="btn2" data-bact="keep">Keep</button></div></div>`);return}}
  if(act==="keep"){rerenderSheet(sheetLive?"":"");openDetails(id);return}
  if(act==="delete-yes"){closeSheet();await deleteBook(id);return}
  if(sheetLive)sheetLive();render()}
async function deleteBook(id){const b=BOOKS.get(id);if(!b)return;deleted.add(id);BOOKS.delete(id);render();toast("Removed “"+b.title+"”");
  try{await del("lib/books/"+id);
    const jobs=[];(b.chapters||[]).forEach((c,ci)=>{for(let k=0;k<(c.p||1);k++)jobs.push(()=>del("lib/books/"+id+"/ch/"+ci+"_"+k))});
    marksOf(id).forEach(m=>{MARKS.delete(m.id);jobs.push(()=>del("lib/marks/"+m.id))});
    await mapLimit(jobs,4,j=>quiet(j()));
    if(assets)await mapLimit(b.assets||[],4,u=>assets.delete(u).catch(()=>{}));
    [...cache.keys()].forEach(k=>{if(k.startsWith(id+":"))cache.delete(k)});
  }catch(e){deleted.delete(id);toast("Couldn’t remove the book. Try again later.")}}

/* search in the open book */
let searchQ="",searchRes=null,searchRun=0;
function openSearch(q){if(q!=null){searchQ=q;searchRes=null}
  const draw=()=>`<div class="search">${IC.search}<input class="tf" type="search" id="sq" placeholder="Search in this book" value="${esc(searchQ)}" autocomplete="off" enterkeyhint="search"></div>
    <div id="sres" class="res">${searchHTML()}</div>`;
  openSheet(draw(),{reader:true});setTimeout(()=>{const i=$("sq");if(i){i.focus();if(q)runSearch()}},300)}
function searchHTML(){if(!searchRes)return searchQ?"":`<p class="small" style="margin-top:14px">Search the whole book. Words from a selection work too.</p>`;
  if(searchRes.busy&&!searchRes.hits.length)return`<p class="small" style="margin-top:14px">Searching… ${searchRes.done} of ${searchRes.of} chapters</p>`;
  if(!searchRes.hits.length)return`<p class="small" style="margin-top:14px">No results for “${esc(searchRes.q)}”.</p>`;
  return`<p class="small" style="margin:12px 0 4px">${searchRes.hits.length>=300?"300+":searchRes.hits.length} results${searchRes.busy?" so far":""}</p><div class="list">${searchRes.hits.map((h,i)=>`<button type="button" class="li" data-hit="${i}"><div class="sp"><div class="m" style="margin:0 0 3px">${esc(h.t)} · ${h.p}%</div><div style="font-family:var(--rfont);font-size:14.5px;line-height:1.45">${esc(h.a)}<b>${esc(h.m)}</b>${esc(h.z)}</div></div></button>`).join("")}</div>`}
const BLOCK=/^(P|DIV|LI|H[1-6]|BLOCKQUOTE|TD|TH|DT|DD|FIGCAPTION|PRE|SECTION|ASIDE)$/;
function textNodes(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const L=[];let s=0,n;while((n=w.nextNode())){let p=n.parentNode;while(p&&p.nodeType===1&&!BLOCK.test(p.tagName))p=p.parentNode;L.push({n,s,b:p});s+=n.nodeValue.length}return L}
/* text between two offsets, with a space where one paragraph ends and the next begins */
function snip(L,a,z){let out="",prev=null;for(const e of L){const e1=e.s+e.n.nodeValue.length;if(e1<=a)continue;if(e.s>=z)break;if(prev&&e.b!==prev&&!/\s$/.test(out))out+=" ";out+=e.n.nodeValue.slice(Math.max(0,a-e.s),z-e.s);prev=e.b}return out.replace(/\s+/g," ")}
async function runSearch(){const b=RD.book,q=searchQ.trim();if(!b||q.length<2){searchRes=null;const r=$("sres");if(r)r.innerHTML=searchHTML();return}
  const run=++searchRun;searchRes={q,hits:[],busy:true,done:0,of:b.chapters.length};const ql=q.toLowerCase(),tot=total(b);
  for(let ch=0;ch<b.chapters.length&&searchRes.hits.length<300;ch++){
    let html;try{html=await loadChapter(b,ch)}catch(e){continue}
    if(run!==searchRun)return;
    const t=document.createElement("template");t.innerHTML=html;const text=t.content.textContent,low=text.toLowerCase();
    let nodes=null;
    let i=low.indexOf(ql);while(i>=0&&searchRes.hits.length<300){if(!nodes)nodes=textNodes(t.content);
      const a=Math.max(0,i-60),z=Math.min(text.length,i+q.length+80);
      searchRes.hits.push({ch,off:i,len:q.length,t:chapterTitle(b,ch),p:Math.floor(gpos(b,ch,i)/tot*100),a:(a>0?"…":"")+snip(nodes,a,i).replace(/^\S*\s/,a>0?"":"$&"),m:text.slice(i,i+q.length),z:snip(nodes,i+q.length,z)+"…"});
      i=low.indexOf(ql,i+q.length)}
    searchRes.done=ch+1;if(ch%4===3||ch===b.chapters.length-1){const r=$("sres");if(r&&sheetOn)r.innerHTML=searchHTML()}}
  searchRes.busy=false;const r=$("sres");if(r&&sheetOn)r.innerHTML=searchHTML()}

  if(t.dataset.hit!=null){const h=searchRes&&searchRes.hits[+t.dataset.hit];if(!h)return;closeSheet();gotoPos(h.ch,h.off,{jump:true}).then(()=>flashRange(h.off,h.len));return}
  if(t.dataset.set){let v=t.dataset.v;if(t.dataset.set==="lh")v=+v;setSetting(t.dataset.set,v);return}

  if(a==="more"){const d=$("desc");if(d){d.classList.add("open");t.remove()}return}

  if(a==="export-notes"){exportNotes([...new Set([...MARKS.values()].map(m=>m.bookId))].filter(id=>BOOKS.get(id)),"Folio notes");return}
  if(a==="export-csv"){exportData("csv");return}
  if(a==="export-json"){exportData("json");return}

/* ---------- Habit Tracker bridge · Activity API v1 ----------
   Tells the Habits app on this Lager server about finished sessions, so habits linked to this app tick themselves.
   It compares the app's sessions with what it already sent (data/users/<uid>/bridge/habit-tracker/state) and posts only
   what changed: new and edited sessions as "upsert", deleted ones as "delete". The first run sends the whole history.
   Every 30 days it sends everything again, which repairs anything that got lost. Sending the same id twice is harmless. */
function habitBridge(cfg){
  const DAY=864e5,h=location.hostname.split(".");
  const URL_=h.length>2?location.protocol+"//habit-tracker."+h.slice(1).join(".")+"/_ingest/activity":null;
  let ref=null,state=null,busy=false,again=false,timer=0,off=false,opaque=false,tries=0;
  const pad=n=>String(n).padStart(2,"0");
  const day=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  const hash=s=>{let x=5381;for(let i=0;i<s.length;i++)x=(x*33^s.charCodeAt(i))>>>0;return x.toString(36)};
  function event(a){const e={op:"upsert",id:String(a.id),kind:a.kind,date:day(a.start),start:new Date(a.start).toISOString()};
    if(a.end)e.end=new Date(a.end).toISOString();
    if(a.minutes!=null&&isFinite(a.minutes))e.minutes=Math.round(a.minutes*10)/10;
    if(a.value!=null&&isFinite(a.value)){e.value=Math.round(a.value*100)/100;if(a.unit)e.unit=a.unit}
    if(a.title)e.title=String(a.title).slice(0,80);
    if(a.url)e.url=a.url;
    return e}
  async function init(){
    const [db,user]=await Promise.all([cfg.R.use("db"),cfg.R.use("user")]);if(!db||!user)return false;
    const uid=await user.id();if(!uid)return false;
    ref=db.doc("data/users/"+uid+"/bridge/habit-tracker/state");
    const s=await ref.get();state=s.exists?JSON.parse(JSON.stringify(s.data())):{};state.sent=state.sent||{};return true}
  /* "ok", or the HTTP status. Lager answers without CORS headers for some setups; then the request still arrives, so send blind from then on. */
  async function post(body){
    if(!opaque){try{const r=await fetch(URL_,{method:"POST",body});return r.ok?"ok":r.status}catch(e){opaque=true}}
    try{await fetch(URL_,{method:"POST",body,mode:"no-cors"});return"ok"}catch(e){return"net"}}
  async function run(){
    if(off||!URL_||!cfg.R||!cfg.R.use||!navigator.onLine)return;
    if(!cfg.ready()){kick(4000);return}
    if(busy){again=true;return}busy=true;
    try{
      if(!ref&&!(await init())){off=true;return}
      const now=Date.now(),full=!state.full||now-state.full>30*DAY,cur={},out=[];
      cfg.collect().forEach(a=>{try{const e=event(a);cur[e.id]=e}catch(x){}});
      Object.keys(cur).forEach(id=>{const hs=hash(JSON.stringify(cur[id]));if(full||state.sent[id]!==hs)out.push([id,hs,cur[id]])});
      if(!(cfg.partial&&cfg.partial()))Object.keys(state.sent).forEach(id=>{if(!cur[id])out.push([id,null,{op:"delete",id}])});
      const source={app:cfg.app,name:cfg.name,url:location.origin+"/",kinds:cfg.kinds};
      if(!out.length&&!full)return;
      if(!out.length)out.push(null);                 /* nothing to say: still announce the app once a month */
      let i=0,changed=false;
      while(i<out.length){
        const batch=[];let size=0;
        while(i<out.length&&batch.length<200){const x=out[i];const len=x?JSON.stringify(x[2]).length+1:0;if(batch.length&&size+len>56000)break;batch.push(x);size+=len;i++}
        const events=batch.filter(Boolean).map(x=>x[2]);
        const r=await post(JSON.stringify({v:1,source,sentAt:new Date().toISOString(),events}));
        if(r!=="ok"){if(r===404||r===403)off=true;else{tries++;kick(Math.min(300000,15000*tries))}break}
        tries=0;changed=true;batch.forEach(x=>{if(!x)return;if(x[1])state.sent[x[0]]=x[1];else delete state.sent[x[0]]});
        if(i>=out.length&&full)state.full=now;
      }
      if(changed){state.at=now;await ref.set(state).catch(()=>{})}
    }catch(e){kick(60000)}
    finally{busy=false;if(again){again=false;kick()}}
  }
  function kick(ms){clearTimeout(timer);timer=setTimeout(run,ms==null?2500:ms)}
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)kick()});
  addEventListener("online",()=>kick());
  kick(5000);
  return{kick};
}
let HB=null;
HB=habitBridge({R,app:"folio",name:"Folio",kinds:[{kind:"reading",label:"Reading",unit:"min"}],ready:()=>loaded.sess,partial:()=>!sessComplete,
  collect:()=>sessions().filter(s=>s.ms>=MIN).map(s=>{const pages=Math.round((s.chars||0)/CPS);const a={id:s.id,kind:"reading",title:s.title,start:s.start,end:s.end,minutes:s.ms/MIN,url:location.origin+"/#book/"+s.bookId};if(pages>0){a.value=pages;a.unit="pages"}return a})});

/* ---------- start ---------- */
render();initRemote();
