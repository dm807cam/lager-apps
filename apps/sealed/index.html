<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Sealed</title>
<style>
:root{--bg:#f2f5f4;--panel:#fff;--ink:#111b21;--muted:#62716d;--line:#e1e7e4;--accent:#1f8a70;--accent-ink:#fff;--head:#0f3d3a;--head-ink:#e9f5f1;--out:#d6f2e6;--in:#fff;--chat:#e8eeeb;--warn:#8a4b06;--warnbg:#fff2db;--danger:#c0392b;--chip:#edf2f0;--shadow:0 1px 1px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0a1311;--panel:#101b19;--ink:#e5ecea;--muted:#8c9c98;--line:#1d2b28;--accent:#2fb38f;--accent-ink:#04110d;--head:#0c2724;--head-ink:#dff3ec;--out:#164638;--in:#192623;--chat:#0c1614;--warn:#f5b45a;--warnbg:#2b1f0d;--danger:#ff6b5b;--chip:#182522;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
#root{height:100dvh;height:100vh;height:100dvh;display:flex;flex-direction:column}
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.card{width:100%;max-width:420px;background:var(--panel);border-radius:18px;padding:28px 22px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.card h1{margin:12px 0 6px;font-size:24px}
.card p{color:var(--muted);margin:6px 0 14px}
.brand{width:56px;height:56px;border-radius:16px;background:var(--head);color:var(--head-ink);display:flex;align-items:center;justify-content:center}
.brand svg{width:30px;height:30px}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.in{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none;min-width:0}
.in:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%;margin-top:18px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.link{color:var(--accent);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.meter{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--danger);transition:width .2s}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.err{color:var(--danger);font-size:13.5px;min-height:1.2em;margin-top:10px}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:14px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px}
.chk input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* app shell */
#app{flex:1;display:flex;min-height:0;position:relative}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
#list{width:100%}
#conv{display:none;flex:1;background:var(--chat)}
#app.in-chat #list{display:none}
#app.in-chat #conv{display:flex}
@media (min-width:820px){#list{width:360px;flex:none;border-right:1px solid var(--line)}#app.in-chat #list{display:flex}#conv{display:flex}.back-btn{display:none!important}}
.bar{display:flex;align-items:center;gap:6px;padding:10px 8px 10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--head);color:var(--head-ink);min-height:58px;flex:none}
.bar h2{font-size:19px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.bar h2 svg{width:16px;height:16px;opacity:.8;flex:none}
.ib{width:40px;height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:rgba(255,255,255,.08)}
.ib svg{width:22px;height:22px}
.search{padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.search .in{padding:9px 14px;border-radius:20px;background:var(--chip);border:0}
.scroll{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:hover,.item.on{background:var(--chip)}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;letter-spacing:.5px}
.av.sm{width:36px;height:36px;font-size:13px}
.av svg{width:22px;height:22px}
.meta{flex:1;min-width:0}
.meta .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.meta .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px;min-width:0}
.meta .n svg{width:14px;height:14px;color:var(--accent);flex:none}
.meta .time{font-size:12px;color:var(--muted);flex:none}
.meta .s{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:14px;margin-top:2px}
.meta .s span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:11px;min-width:22px;height:22px;padding:0 6px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.unread .time{color:var(--accent);font-weight:600}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.6}
.fab{position:absolute;right:18px;bottom:max(18px,env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.fab svg{width:26px;height:26px}
@media (min-width:820px){.fab{left:286px;right:auto}}
/* conversation */
.conv-head{cursor:pointer;flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.conv-head .sub{font-size:12.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-head .nm{font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.conv-head .nm svg{width:15px;height:15px}
.msgs{flex:1;overflow-y:auto;min-height:0;padding:10px 4% 8px;display:flex;flex-direction:column;gap:3px;background:var(--chat)}
.e2e{align-self:center;max-width:340px;background:var(--warnbg);color:var(--warn);font-size:12.5px;text-align:center;border-radius:10px;padding:8px 12px;margin:6px 0 10px;display:flex;gap:6px;align-items:flex-start}
.e2e svg{width:14px;height:14px;flex:none;margin-top:2px}
.day{align-self:center;background:var(--panel);color:var(--muted);font-size:12px;border-radius:8px;padding:4px 10px;margin:8px 0;box-shadow:var(--shadow)}
.sys{align-self:center;color:var(--muted);font-size:12.5px;background:var(--panel);border-radius:8px;padding:4px 10px;margin:4px 0;text-align:center;max-width:90%;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.sys svg{width:13px;height:13px;flex:none}
.b{max-width:min(78%,520px);padding:6px 9px 5px;border-radius:12px;background:var(--in);box-shadow:var(--shadow);align-self:flex-start;position:relative;word-wrap:break-word;overflow-wrap:anywhere;cursor:pointer;user-select:text}
.b.me{align-self:flex-end;background:var(--out)}
.b.first{margin-top:6px}
.b .who{font-size:12.5px;font-weight:700;margin-bottom:1px}
.b .tx{white-space:pre-wrap}
.b .ft{float:right;font-size:11px;color:var(--muted);margin:6px 0 -2px 10px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.b .ft svg{width:15px;height:15px}
.b .ft .rd{color:#34b7f1}
.b img{display:block;max-width:100%;max-height:320px;border-radius:8px;margin:2px 0 2px;min-width:120px;background:var(--chip)}
.b .q{border-left:3px solid var(--accent);background:rgba(0,0,0,.05);border-radius:6px;padding:4px 8px;margin:2px 0 4px;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b.bad{background:var(--warnbg);color:var(--warn);font-size:13.5px;font-style:italic}
.b.bad svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.banner{background:var(--warnbg);color:var(--warn);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex:none;border-bottom:1px solid var(--line)}
.banner .grow{flex:1}
.banner .btn{padding:7px 12px;font-size:13px}
.replybar{display:flex;align-items:center;gap:8px;background:var(--panel);padding:8px 12px;border-top:1px solid var(--line);flex:none}
.replybar .q{flex:1;border-left:3px solid var(--accent);padding:2px 8px;font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compose{display:flex;align-items:flex-end;gap:6px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--chat);flex:none}
.compose .box{flex:1;display:flex;align-items:flex-end;background:var(--panel);border-radius:22px;padding:2px 4px 2px 14px;min-width:0;box-shadow:var(--shadow)}
.compose textarea{flex:1;border:0;outline:0;background:transparent;resize:none;padding:10px 0;max-height:140px;min-width:0;line-height:1.35}
.compose .ib{color:var(--muted)}
.send{width:46px;height:46px;border-radius:23px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.send svg{width:22px;height:22px}
.send:disabled{opacity:.5}
.closed{padding:14px;text-align:center;color:var(--muted);background:var(--panel);font-size:14px;flex:none;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:24px;gap:10px}
.placeholder svg{width:56px;height:56px;opacity:.5}
/* panels and sheets */
.panel{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:slide .16s ease-out}
@media (min-width:820px){.panel{left:auto;width:420px;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12)}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.sec{background:var(--panel);margin:10px 0;padding:6px 0}
.sec h3{font-size:13px;color:var(--accent);margin:8px 16px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.opt{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;text-align:left}
.opt:hover{background:var(--chip)}
.opt svg{width:22px;height:22px;color:var(--muted);flex:none}
.opt .l{flex:1;min-width:0}
.opt .l small{display:block;color:var(--muted);font-size:13px}
.opt.danger,.opt.danger svg{color:var(--danger)}
.pad{padding:12px 16px}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 16px;background:var(--panel)}
.hero .av{width:84px;height:84px;font-size:28px}
.hero .nm{font-size:21px;font-weight:600;text-align:center;overflow-wrap:anywhere}
.hero .sub{color:var(--muted);font-size:13.5px;text-align:center}
.safety{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;letter-spacing:.06em;padding:14px 16px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--chip)}
.pill.ok{color:var(--accent)}
.pill.warn{color:var(--warn);background:var(--warnbg)}
.pill svg{width:14px;height:14px}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:.15s}
.switch i:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i:after{left:21px}
.pick{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick svg{width:14px;height:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.chips:empty{display:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .12s}
@media (min-width:600px){.overlay{align-items:center}}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--panel);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:8px 0 max(8px,env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media (min-width:600px){.sheet{border-radius:16px}}
.sheet .pad p{margin:4px 0 10px;color:var(--muted)}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;padding:8px 16px 8px}
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.viewer .ib{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;color:#fff;background:rgba(255,255,255,.15)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;max-width:90vw;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
