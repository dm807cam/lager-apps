<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1eee8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1011">
<title>Stillwater</title>
<style>
:root{color-scheme:light;--bg:#f1eee8;--surface:#fffdf9;--surface-2:#f3f0ea;--surface-3:#e6e2d9;--border:rgba(40,40,20,.06);--text:#1b2321;--text-2:#4b5451;--text-3:#878d89;--grid:#ece8e0;--good:#2f7d62;--good-bg:rgba(47,125,98,.1);--bad:#b8483f;--bad-bg:rgba(184,72,63,.09);--shadow:0 1px 1px rgba(0,0,0,.025),0 8px 24px rgba(40,40,10,.055);--radius:24px;
  --btn:#3d6c67;--btn-ink:#fff;--hero-l:#86aaa1;--hero-m:#3f6d68;--hero-d:#1d3b3c;--seg-on:var(--surface);--glow:rgba(205,190,255,.42);--warmglow:rgba(255,206,164,.26)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0b1011;--surface:#131a1b;--surface-2:#1b2425;--surface-3:#253031;--border:rgba(255,255,255,.055);--text:#edf1ee;--text-2:#bfc8c4;--text-3:#87918d;--grid:#1f2829;--good:#6cc79f;--good-bg:rgba(108,199,159,.12);--bad:#e57d72;--bad-bg:rgba(229,125,114,.12);--shadow:0 1px 1px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --btn:#86c2b6;--btn-ink:#0b1213;--hero-l:#4f7f79;--hero-m:#2b5250;--hero-d:#122627;--seg-on:var(--surface-3);--glow:rgba(160,140,255,.32);--warmglow:rgba(255,190,140,.14)}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
.col{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.rnd{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand svg{width:32px;height:32px;border-radius:9px;flex:none;box-shadow:0 4px 12px rgba(29,59,60,.3)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);display:grid;place-items:center;padding:0;flex:none}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:var(--text-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn i{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--text-3);box-shadow:0 0 0 2px var(--surface)}
.iconbtn[data-s="ok"] i{background:var(--good)}
.iconbtn[data-s="error"] i,.iconbtn[data-s="slow"] i{background:var(--bad)}
.iconbtn[data-s="local"] i{display:none}
.iconbtn[data-s="saving"] i,.iconbtn[data-s="loading"] i{background:var(--btn)}

/* Segmented */
.seg{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:12px}
.seg button{flex:1;border:0;background:transparent;font-size:13px;font-weight:550;color:var(--text-2);padding:7px 11px;border-radius:9px;min-height:34px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--text);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-h > div{min-width:0}
.card-h h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.card-h small,.sub{display:block;font-size:12.5px;color:var(--text-3);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2 .wide{grid-column:1/-1}}

/* Hero (stats) */
.hero{position:relative;color:#fff;border:0;border-radius:24px;padding:22px 20px 18px;display:grid;gap:18px;overflow:hidden;
  background:radial-gradient(110% 90% at 100% 0%,var(--glow),transparent 60%),radial-gradient(80% 80% at 0% 100%,var(--warmglow),transparent 60%),linear-gradient(160deg,var(--hero-l) 0%,var(--hero-m) 55%,var(--hero-d) 100%);
  box-shadow:0 14px 34px rgba(20,50,50,.25)}
.hero > *:not(.deco){position:relative}
.hero .deco{position:absolute;top:-70px;right:-70px;width:250px;height:250px;opacity:.2;pointer-events:none}
.hero .lbl{font-size:13px;color:rgba(255,255,255,.72)}
.hero .big{font-size:clamp(40px,12vw,58px);font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:.38em;font-weight:600;letter-spacing:-.01em;margin-left:6px;color:rgba(255,255,255,.75)}
.hero .line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chip{display:inline-flex;align-items:center;border-radius:999px;font-size:12.5px;font-weight:650;padding:4px 10px;background:rgba(255,255,255,.15);color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.pos{background:rgba(190,245,215,.2);color:#d3f7e3}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;min-width:0}
.tile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.62)}
.tile .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .n{font-size:12px;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles .tile:last-child{grid-column:1/-1}}

/* Sanctuary (timer home) */
.sanct{position:relative;overflow:hidden;border-radius:30px;color:#fff;padding:22px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  background:radial-gradient(90% 70% at 85% 0%,var(--glow),transparent 62%),radial-gradient(80% 70% at 0% 100%,var(--warmglow),transparent 60%),linear-gradient(170deg,var(--hero-l) 0%,var(--hero-m) 50%,var(--hero-d) 100%);box-shadow:0 18px 40px rgba(20,50,50,.28)}
.sanct .greet{font-size:14px;color:rgba(255,255,255,.78);font-weight:550}
.sanct .intent{font-size:13.5px;color:rgba(255,255,255,.66);max-width:34ch;min-height:2.6em;margin:2px auto 0}
.sanct .orb{margin:10px 0 4px}
.sanct .meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:4px 0 14px}
.begin{border:0;background:#fff;color:var(--hero-d);font-weight:700;font-size:17px;padding:15px 40px;border-radius:999px;box-shadow:0 10px 26px rgba(0,0,0,.18);display:inline-flex;align-items:center;gap:9px}
.begin svg{width:18px;height:18px;fill:currentColor}
.begin:active{transform:scale(.98)}

/* Orb */
.orb{position:relative;width:min(64vw,250px);aspect-ratio:1;display:grid;place-items:center;--s:1}
.orb .halo,.orb .core,.orb .ring2{position:absolute;border-radius:50%}
.orb .halo{inset:-8%;background:radial-gradient(circle,rgba(255,255,255,.22) 0%,rgba(255,255,255,.06) 45%,transparent 70%);transform:scale(calc(.85 + var(--s)*.15))}
.orb .ring2{inset:4%;border:1px solid rgba(255,255,255,.18);transform:scale(calc(.7 + var(--s)*.3))}
.orb .core{inset:16%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.16) 42%,rgba(255,255,255,.05) 70%),radial-gradient(circle at 70% 80%,var(--glow),transparent 60%);box-shadow:inset 0 0 40px rgba(255,255,255,.12),0 0 60px rgba(255,255,255,.12);transform:scale(var(--s))}
.orb.idle .core,.orb.idle .ring2,.orb.idle .halo{animation:idle 10s ease-in-out infinite}
.orb.idle .ring2{animation-delay:-.6s}.orb.idle .halo{animation-delay:-1.2s}
@keyframes idle{0%,100%{transform:scale(.9)}50%{transform:scale(1.03)}}
.orb .prog{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.orb .prog circle{fill:none;stroke-width:2.2}
.orb .prog .tr{stroke:rgba(255,255,255,.13)}
.orb .prog .pv{stroke:rgba(255,255,255,.85);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.orb .read{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.orb .t{font-size:clamp(46px,14vw,64px);font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.orb .u{font-size:12.5px;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.7)}

/* Option chips */
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.opt{border:1.5px solid transparent;background:var(--surface-2);color:var(--text-2);font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;min-height:40px;display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;transition:background-color .15s,border-color .15s,color .15s}
.opt[aria-pressed="true"]{background:color-mix(in srgb,var(--btn) 14%,var(--surface));border-color:var(--btn);color:var(--text)}
.opt i{width:9px;height:9px;border-radius:50%;flex:none}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.setrow .l{font-size:14px;font-weight:600}
.setrow .l small{display:block;font-weight:500;color:var(--text-3);font-size:12.5px}
.range{flex:1;max-width:220px;accent-color:var(--btn)}
.sw{position:relative;width:50px;height:30px;border-radius:999px;border:0;background:var(--surface-3);padding:0;flex:none;transition:background-color .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--btn)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.lbl2{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin:18px 0 0}
.lbl2:first-child{margin-top:4px}

/* Buttons */
.btn2{border:0;background:var(--surface-2);color:var(--text);font-size:13px;font-weight:650;padding:8px 14px;border-radius:999px;min-height:36px;white-space:nowrap}
.btn2.pri{background:var(--btn);color:var(--btn-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:650;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.up{background:var(--good-bg);color:var(--good)}

/* Today strip */
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stile{background:var(--surface-2);border-radius:14px;padding:10px 12px;min-width:0}
.stile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3)}
.stile .v{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stile .n{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Rows */
.rows{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:14px;width:100%;border:0;background:transparent;text-align:left;transition:background-color .15s}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--surface-2)}
.row .m{min-width:0}
.row .m b{display:block;font-size:16px;font-weight:650;line-height:1.25;font-variant-numeric:tabular-nums}
.row .m small{display:block;font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.row .m em{display:block;font-style:normal;font-size:13px;color:var(--text-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bub{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2)}
.bub i{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 5px color-mix(in srgb,currentColor 18%,transparent);background:currentColor}
.bub svg{width:20px;height:20px;fill:none;stroke:var(--btn);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mon{font-size:12.5px;font-weight:650;color:var(--text-3);margin:4px 6px -6px;display:flex;justify-content:space-between}
.empty{text-align:center;padding:34px 20px;color:var(--text-3)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* Charts, heatmap, bars */
.chart{position:relative;margin-top:10px;min-height:60px;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-size:11px;fill:var(--text-3);font-variant-numeric:tabular-nums}
.ctip{position:absolute;top:0;z-index:2;pointer-events:none;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:14px;padding:7px 10px;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ctip b{display:block;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-3);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 2px;vertical-align:-1px}
.hm{display:flex;gap:6px;margin-top:12px}
.hm-days{display:grid;grid-template-rows:16px repeat(7,12px);row-gap:3px;font-size:10.5px;color:var(--text-3);flex:none}
.hm-days span{line-height:12px}
.hm-scroll{overflow-x:auto;min-width:0;flex:1;scrollbar-width:thin}
.hm-scroll svg{display:block}
.hm-scroll text{font-size:10.5px;fill:var(--text-3)}
.hm rect.cell{cursor:pointer}
.hm rect.sel{stroke:var(--text);stroke-width:1.5}
.c0{fill:var(--surface-3);background:var(--surface-3)}.c1{fill:color-mix(in srgb,var(--btn) 28%,var(--surface));background:color-mix(in srgb,var(--btn) 28%,var(--surface))}.c2{fill:color-mix(in srgb,var(--btn) 52%,var(--surface));background:color-mix(in srgb,var(--btn) 52%,var(--surface))}.c3{fill:color-mix(in srgb,var(--btn) 76%,var(--surface));background:color-mix(in srgb,var(--btn) 76%,var(--surface))}.c4{fill:var(--btn);background:var(--btn)}
.hm-cap{font-size:12.5px;color:var(--text-2);margin-top:8px;min-height:18px;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.bar{display:grid;grid-template-columns:118px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.bar span:first-child{color:var(--text-2);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar i{display:block;height:10px;border-radius:5px;min-width:3px}
.bar span:last-child{text-align:right;color:var(--text-3);font-variant-numeric:tabular-nums}
.next{margin-top:14px;background:var(--surface-2);border-radius:14px;padding:11px 12px}
.next .h{display:flex;justify-content:space-between;font-size:13px;gap:10px}
.next .h b{font-weight:650}.next .h span{color:var(--text-3);font-variant-numeric:tabular-nums}
.next .trk{height:8px;border-radius:4px;background:var(--surface-3);margin-top:8px;overflow:hidden}
.next .trk i{display:block;height:100%;border-radius:4px;background:var(--btn)}

/* Sheet */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.38);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.backdrop.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;margin:0 auto;max-width:560px;max-height:92vh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.9,.25,1),visibility .3s}
.sheet.on{transform:none;visibility:visible}
@media (min-width:640px){.sheet{bottom:auto;top:50%;border-radius:26px;width:calc(100% - 28px);transform:translate(0,-46%);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .25s,visibility .3s}.sheet.on{transform:translate(0,-50%);opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--surface-3);margin:4px auto 10px}
@media (min-width:640px){.grab{display:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sheet-h h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;padding:0;flex:none}
.x svg{width:16px;height:16px;fill:none;stroke:var(--text-2);stroke-width:2.2;stroke-linecap:round}
.lab{display:block;font-size:12.5px;font-weight:550;color:var(--text-3);padding-left:4px;margin:14px 0 6px}
.tf{width:100%;border:1.5px solid transparent;border-radius:14px;background:var(--surface-2);color:var(--text);padding:13px 14px;font-size:17px;min-height:52px;-webkit-appearance:none;appearance:none;outline:none}
.tf:focus{border-color:var(--btn);background:var(--surface)}
textarea.tf{min-height:86px;resize:vertical;font-size:15px;line-height:1.45}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.frow .lab{margin-top:14px}
.submit{width:100%;margin-top:18px;border:0;background:var(--btn);color:var(--btn-ink);border-radius:16px;min-height:54px;font-size:17px;font-weight:700}
.ghost{width:100%;margin-top:8px;border:0;background:transparent;color:var(--bad);border-radius:16px;min-height:48px;font-size:15px;font-weight:650}
.err{color:var(--bad);font-size:13px;margin:8px 4px 0}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{border:1.5px solid transparent;background:var(--surface-2);border-radius:16px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600;color:var(--text-2);min-width:0}
.mood svg{width:28px;height:28px}
.mood[aria-pressed="true"]{border-color:var(--btn);background:color-mix(in srgb,var(--btn) 12%,var(--surface));color:var(--text)}

/* Session overlay: a soft dawn in light mode, dusk in dark mode */
:root{--z-bg:radial-gradient(70% 50% at 80% 8%,rgba(205,190,255,.55),transparent 65%),radial-gradient(70% 50% at 10% 95%,rgba(255,200,160,.5),transparent 65%),linear-gradient(175deg,#f1f3ee 0%,#dce8e2 50%,#c2d8d1 100%);
  --z-ink:#163334;--z-ink2:rgba(22,51,52,.7);--z-ink3:rgba(22,51,52,.5);--z-glass:rgba(22,51,52,.07);--z-glass2:rgba(22,51,52,.13);--z-line:rgba(22,51,52,.16);--z-prog:rgba(22,51,52,.72);
  --z-sky1:rgba(150,190,255,.22);--z-sky2:rgba(210,180,255,.2);
  --z-halo:radial-gradient(circle,rgba(255,255,255,.75) 0%,rgba(255,255,255,.22) 45%,transparent 70%);
  --z-core:radial-gradient(circle at 35% 30%,rgba(255,255,255,.98),rgba(255,255,255,.55) 40%,rgba(110,165,155,.38) 78%),radial-gradient(circle at 70% 80%,rgba(175,160,255,.5),transparent 60%);
  --z-coresh:inset 0 0 40px rgba(255,255,255,.55),0 14px 50px rgba(40,90,85,.22);

(()=>{

/* ---------- data: the db is the record; this device keeps a copy so a session is never lost offline ---------- */
const LS="stillwater.v1",LSR="stillwater.run";

function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||"null");if(d&&d.docs&&typeof d.docs==="object")docs=d.docs}catch(e){}}

function put(d){d.updatedAt=Date.now();docs[d.id]=d;saveLocal();push(d.id)}
const ts=d=>d&&d.updatedAt||0;
function cached(k,f){if(memo.v!==ver)memo={v:ver};if(!(k in memo))memo[k]=f();return memo[k]}
const CFG=["dur","type","breath","interval","amb","ambVol","prep","bell","vol"];
/* The settings of the last sit are the defaults for the next. They live in the settings doc; a newer timed session (e.g. from another device) wins. */
function lastCfg(){return cached("lc",()=>{const l=sessions();for(let i=l.length-1;i>=0;i--)if(l[i].cfg)return l[i];return null})}
function S(){const o=Object.assign({},DEF,docs.settings||{}),l=lastCfg();if(l&&l.at>ts(docs.settings))CFG.forEach(k=>{if(l.cfg[k]!=null)o[k]=l.cfg[k]});return o}
function setS(p){put(Object.assign(S(),p,{id:"settings",kind:"settings"}))}
function sessions(){return cached("l",()=>Object.values(docs).filter(d=>d&&d.kind==="session"&&!d.deleted&&d.dur>0&&isFinite(d.at)).sort((a,b)=>a.at-b.at))}
const mins=s=>s.dur/60;
function dayMap(){return cached("dm",()=>{const m={};sessions().forEach(s=>{const k=dayStart(s.at);const o=m[k]||(m[k]={n:0,min:0,types:[]});o.n++;o.min+=mins(s);if(!o.types.includes(s.type))o.types.push(s.type)});return m})}
function weekCounts(n){const ws=weekStart(),out=[];for(let i=n-1;i>=0;i--){const a=weekStart(ws-i*7*DAY+3*DAY),b=weekStart(a+10*DAY);const l=sessions().filter(s=>s.at>=a&&s.at<b);const min=l.reduce((x,s)=>x+mins(s),0);out.push({a,n:l.length,min,avg:l.length?min/l.length:0})}return out}
/* Streaks: days or weeks in a row with at least one session. Today (or this week) without one yet doesn't break the run. */
function streaks(){return cached("st",()=>{
  const days=Object.keys(dayMap()).map(Number).sort((a,b)=>a-b);let dBest=0,run=0,prev=null;
  days.forEach(d=>{run=prev!=null&&Math.round((d-prev)/DAY)===1?run+1:1;dBest=Math.max(dBest,run);prev=d});
  const last=days[days.length-1],dCur=last!=null&&Math.round((dayStart(Date.now())-last)/DAY)<=1?run:0;
  const w=weekCounts(156);let wBest=0,r=0;w.forEach(x=>{r=x.n?r+1:0;wBest=Math.max(wBest,r)});
  let i=w.length-1,wCur=0;if(!w[i].n)i--;while(i>=0&&w[i].n){wCur++;i--}
  const l=sessions();let perWk=0,span=0;
  if(l.length){span=Math.min(8,Math.round((weekStart()-weekStart(l[0].at))/(7*DAY))+1);perWk=w.slice(-span).reduce((a,x)=>a+x.min,0)/span}

  return{dCur,dBest,wCur,wBest,perWk,span,active30};
})}
function milestones(){return cached("ms",()=>{
  const l=sessions(),ev=[],HRS=[1,5,10,25,50,100,250,500,1000],CNT=[1,10,25,50,100,250,500,1000],ST=[3,7,14,30,60,100,180,365];
  let tot=0,best=0,n=0,hi=0,ci=0;
  l.forEach(s=>{n++;tot+=mins(s);
    while(ci<CNT.length&&n>=CNT[ci]){ev.push({at:s.at,ic:"star",t:CNT[ci]===1?"First session":CNT[ci]+" sessions",sub:fmtMin(mins(s))+" · "+TY(s.type)[0]});ci++}

function openSession(id){
  const s=id?docs[id]:null,now=Date.now(),last=S();
  const at=s?s.at:now-(last.dur||10)*60e3,mood=s?s.mood:null;let ty=s?s.type:last.type;
  openSheet(s?"Session":"Log a session",`<div class="frow"><div><label class="lab" for="se-d">Date</label><input class="tf" id="se-d" type="date" value="${isoDay(at)}" max="${isoDay(now)}"></div><div><label class="lab" for="se-t">Start time</label><input class="tf" id="se-t" type="time" value="${isoTime(at)}"></div></div>
    <label class="lab" for="se-m">Minutes</label><input class="tf" id="se-m" type="number" inputmode="numeric" min="1" max="600" value="${s?Math.max(1,Math.round(s.dur/60)):(last.dur||10)}">
    <label class="lab">Practice</label><div class="opts" id="se-ty" style="margin-top:0">${Object.keys(TYPES).map(k=>opt("ty",k,ty===k,esc(TYPES[k][0]),TYPES[k][1])).join("")}</div>
    <label class="lab">How did you feel after?</label><div class="moods" id="se-mo">${[1,2,3,4,5].map(m=>`<button type="button" class="mood" data-mood="${m}" aria-pressed="${mood===m}">${FACE(m)}${MOODS[m]}</button>`).join("")}</div>
    <label class="lab" for="se-n">Note</label><textarea class="tf" id="se-n" placeholder="What came up, what helped…">${esc(s&&s.note||"")}</textarea>
    <p class="err" id="se-err" hidden></p><button type="button" class="submit" id="se-save">${s?"Save changes":"Add to journal"}</button>${s?`<button type="button" class="ghost" id="se-del">Delete session</button>`:""}`,root=>{
    let mo=mood;
    root.onclick=e=>{
      const t=e.target.closest("[data-ty]");if(t){ty=t.dataset.ty;root.querySelectorAll("[data-ty]").forEach(b=>b.setAttribute("aria-pressed",b===t?"true":"false"));return}
      const m=e.target.closest("[data-mood]");if(m){mo=mo===+m.dataset.mood?null:+m.dataset.mood;root.querySelectorAll("[data-mood]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.mood===mo?"true":"false"));return}
      if(e.target.id==="se-del"){put(Object.assign({},s,{deleted:true}));closeSheet();toast("Session deleted");render();return}
      if(e.target.id!=="se-save")return;
      const mi=Math.round(+$("se-m").value),dv=$("se-d").value,tv=$("se-t").value||"08:00",err=$("se-err");
      const start=dv?new Date(dv+"T"+tv+":00").getTime():NaN;
      if(!(mi>=1&&mi<=600)){err.textContent="Enter the minutes you sat, from 1 to 600.";err.hidden=false;return}
      if(!isFinite(start)){err.textContent="Pick a date.";err.hidden=false;return}
      if(start>Date.now()+60e3){err.textContent="That start time is in the future.";err.hidden=false;return}
      const note=$("se-n").value.trim().slice(0,2000);
      put(Object.assign({},s||{id:"s_m"+Date.now(),kind:"session",manual:true,breath:"off"},{at:start,dur:mi*60,type:ty,mood:mo,note}));
      closeSheet();toast(s?"Saved":"Added to your journal");render();
    };
  });
}

function capFor(k){const o=dayMap()[k];return esc(longDate(+k))+" · "+(o?plural(o.n,"session")+" · "+esc(fmtMin(o.min))+" · "+esc(o.types.map(t=>TY(t)[0]).join(", ")):"no session")}
function heatmap(){
  const m=dayMap(),cs=12,gap=3,step=cs+gap,weeks=53,start=weekStart()-(weeks-1)*7*DAY,today=dayStart(Date.now());
  const lvl=o=>!o?0:o.min<8?1:o.min<16?2:o.min<30?3:4;
  let svg="",ml="",lastM=-1,lastW=-9;
  for(let w=0;w<weeks;w++){const wsT=start+w*7*DAY;const mo=new Date(wsT+3*DAY).getMonth();if(mo!==lastM){lastM=mo;if(w<weeks-1&&w-lastW>=3){lastW=w;ml+=`<text x="${w*step}" y="11">${new Date(wsT+3*DAY).toLocaleDateString(undefined,{month:"short"})}</text>`}}
    for(let d=0;d<7;d++){const t=dayStart(wsT+d*DAY+3600e3);if(t>today)continue;const o=m[t];
      svg+=`<rect class="cell c${lvl(o)}${hmSel==t?" sel":""}" x="${w*step}" y="${16+d*step}" width="${cs}" height="${cs}" rx="3" data-day="${t}"><title>${esc(shortDate(t))}${o?": "+esc(fmtMin(o.min)):""}</title></rect>`}}
  return `<div class="hm"><div class="hm-days"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div><div class="hm-scroll"><svg width="${weeks*step-gap}" height="${16+7*step-gap}" role="img" aria-label="Meditation minutes per day over the last year">${ml}${svg}</svg></div></div>`;
}

});
async function exportCsv(){
  if(!downloads)return;const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[["Date","Start","Minutes","Practice","Breathing guide","Mood","Logged by hand","Note"]];
  sessions().forEach(s=>rows.push([isoDay(s.at),isoTime(s.at),Math.round(s.dur/6)/10,TY(s.type)[0],(BREATH[s.breath]||BREATH.off)[0],s.mood?MOODS[s.mood]:"",s.manual?"yes":"",s.note||""]));
  try{await downloads.save({filename:"stillwater-"+isoDay(Date.now())+".csv",data:rows.map(r=>r.map(q).join(",")).join("\n")});toast("Export ready")}catch(e){if(e&&e.code!=="cancelled")toast("Export didn’t work. Try again.")}
}

/* ---------- charts ---------- */
const charts={};let chartSeq=0;
function chartBox(sp){const id="c"+(++chartSeq);charts[id]=sp;return `<div class="chart" data-chart="${id}"></div>`}
function niceTicks(lo,hi,n){const span=hi-lo||1,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw)||raw;const out=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)out.push(Math.round(v*1000)/1000);return out}
function drawCharts(root){root.querySelectorAll(".chart[data-chart]").forEach(drawChart)}
function drawChart(el){
  const sp=charts[el.dataset.chart];if(!sp)return;const W=Math.max(240,el.clientWidth||320),H=sp.h||170,L=40,Rt=10,T=12,B=24,iw=W-L-Rt,ih=H-T-B;
  const ys=sp.ys,n=ys.length;const lo=0,hi=(Math.max(...ys)*1.12)||1;
  const ticks=niceTicks(lo,hi,3),y=v=>T+ih-(v-lo)/(hi-lo)*ih,bw=iw/n,xs=ys.map((_,i)=>L+bw*i+bw/2);sp.px=xs;
  let g=ticks.map(v=>`<line x1="${L}" x2="${W-Rt}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${esc(sp.fmt(v).replace(/ min$/,""))}</text>`).join("");
  for(let i=n-1;i>=0;i-=3)g+=`<text x="${xs[i].toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(sp.xl(i))}</text>`;
  const w=Math.min(28,bw*.62),marks=ys.map((v,i)=>`<rect x="${(xs[i]-w/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,T+ih-y(v)).toFixed(1)}" rx="6" fill="var(--btn)" opacity="${i===n-1?1:.72}"/>`).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Weekly chart">${g}${marks}<line class="xh" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="var(--text-3)" stroke-width="1" opacity="0"/></svg><div class="ctip" hidden></div>`;
}
function chartAt(el,clientX){
  const sp=charts[el.dataset.chart];if(!sp||!sp.px)return;const r=el.getBoundingClientRect(),x=clientX-r.left;
  let bi=0,bd=1e9;sp.px.forEach((p,i)=>{const d=Math.abs(p-x);if(d<bd){bd=d;bi=i}});
  const xh=el.querySelector(".xh"),tip=el.querySelector(".ctip");xh.setAttribute("x1",sp.px[bi]);xh.setAttribute("x2",sp.px[bi]);xh.setAttribute("opacity",".5");
  const t=sp.tip(bi);tip.innerHTML=`<b>${esc(t[1])}</b>${esc(t[0])}`;tip.hidden=false;
  const tw=tip.offsetWidth;tip.style.left=Math.max(0,Math.min(r.width-tw,sp.px[bi]-tw/2))+"px";tip.style.top="-8px";
}
function hideTips(except){document.querySelectorAll(".chart").forEach(el=>{if(el===except)return;const t=el.querySelector(".ctip");if(t)t.hidden=true;el.querySelectorAll(".xh").forEach(z=>z.setAttribute("opacity","0"))})}
document.addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;const el=e.target.closest&&e.target.closest(".chart");if(el){hideTips(el);chartAt(el,e.clientX)}else hideTips()});
document.addEventListener("pointerdown",e=>{const el=e.target.closest&&e.target.closest(".chart");hideTips(el);if(el)chartAt(el,e.clientX)});
let rzT=null;window.addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>drawCharts(document),150)});

const VIEWS=["sit","journal","stats"];

/* A session that was running when the page closed carries on, or is saved if its time ran out meanwhile. */
function restoreRun(){
  let r=null;try{r=JSON.parse(localStorage.getItem(LSR)||"null")}catch(e){}
  if(!r||!isFinite(r.startAt))return;run=r;
  const e=el();if(Date.now()-r.startAt>12*3600e3){run=null;saveRun();return}
  if(run.target&&e>=run.target&&!run.pausedAt){openZen();finish(true,true);return}
  needTap=!run.pausedAt;openZen();
}
/* ---------- Habit Tracker bridge · Activity API v1 ----------
   Tells the Habits app on this Lager server about finished sessions, so habits linked to this app tick themselves.
   It compares the app's sessions with what it already sent (data/users/<uid>/bridge/habit-tracker/state) and posts only
   what changed: new and edited sessions as "upsert", deleted ones as "delete". The first run sends the whole history.
   Every 30 days it sends everything again, which repairs anything that got lost. Sending the same id twice is harmless. */
function habitBridge(cfg){
  const DAY=864e5,h=location.hostname.split(".");
  const URL_=h.length>2?location.protocol+"//habit-tracker."+h.slice(1).join(".")+"/_ingest/activity":null;
  let ref=null,state=null,busy=false,again=false,timer=0,off=false,opaque=false,tries=0;
  const pad=n=>String(n).padStart(2,"0");
  const day=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  const hash=s=>{let x=5381;for(let i=0;i<s.length;i++)x=(x*33^s.charCodeAt(i))>>>0;return x.toString(36)};
  function event(a){const e={op:"upsert",id:String(a.id),kind:a.kind,date:day(a.start),start:new Date(a.start).toISOString()};
    if(a.end)e.end=new Date(a.end).toISOString();
    if(a.minutes!=null&&isFinite(a.minutes))e.minutes=Math.round(a.minutes*10)/10;
    if(a.value!=null&&isFinite(a.value)){e.value=Math.round(a.value*100)/100;if(a.unit)e.unit=a.unit}
    if(a.title)e.title=String(a.title).slice(0,80);
    if(a.url)e.url=a.url;
    return e}
  async function init(){
    const [db,user]=await Promise.all([cfg.R.use("db"),cfg.R.use("user")]);if(!db||!user)return false;
    const uid=await user.id();if(!uid)return false;
    ref=db.doc("data/users/"+uid+"/bridge/habit-tracker/state");
    const s=await ref.get();state=s.exists?JSON.parse(JSON.stringify(s.data())):{};state.sent=state.sent||{};return true}
  /* "ok", or the HTTP status. Lager answers without CORS headers for some setups; then the request still arrives, so send blind from then on. */
  async function post(body){
    if(!opaque){try{const r=await fetch(URL_,{method:"POST",body});return r.ok?"ok":r.status}catch(e){opaque=true}}
    try{await fetch(URL_,{method:"POST",body,mode:"no-cors"});return"ok"}catch(e){return"net"}}
  async function run(){
    if(off||!URL_||!cfg.R||!cfg.R.use||!navigator.onLine)return;
    if(!cfg.ready()){kick(4000);return}
    if(busy){again=true;return}busy=true;
    try{
      if(!ref&&!(await init())){off=true;return}
      const now=Date.now(),full=!state.full||now-state.full>30*DAY,cur={},out=[];
      cfg.collect().forEach(a=>{try{const e=event(a);cur[e.id]=e}catch(x){}});
      Object.keys(cur).forEach(id=>{const hs=hash(JSON.stringify(cur[id]));if(full||state.sent[id]!==hs)out.push([id,hs,cur[id]])});
      Object.keys(state.sent).forEach(id=>{if(!cur[id])out.push([id,null,{op:"delete",id}])});
      const source={app:cfg.app,name:cfg.name,url:location.origin+"/",kinds:cfg.kinds};
      if(!out.length&&!full)return;
      if(!out.length)out.push(null);                 /* nothing to say: still announce the app once a month */
      let i=0,changed=false;
      while(i<out.length){
        const batch=[];let size=0;
        while(i<out.length&&batch.length<200){const x=out[i];const len=x?JSON.stringify(x[2]).length+1:0;if(batch.length&&size+len>56000)break;batch.push(x);size+=len;i++}
        const events=batch.filter(Boolean).map(x=>x[2]);
        const r=await post(JSON.stringify({v:1,source,sentAt:new Date().toISOString(),events}));
        if(r!=="ok"){if(r===404||r===403)off=true;else{tries++;kick(Math.min(300000,15000*tries))}break}
        tries=0;changed=true;batch.forEach(x=>{if(!x)return;if(x[1])state.sent[x[0]]=x[1];else delete state.sent[x[0]]});
        if(i>=out.length&&full)state.full=now;
      }
      if(changed){state.at=now;await ref.set(state).catch(()=>{})}
    }catch(e){kick(60000)}
    finally{busy=false;if(again){again=false;kick()}}
  }
  function kick(ms){clearTimeout(timer);timer=setTimeout(run,ms==null?2500:ms)}
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)kick()});
  addEventListener("online",()=>kick());
  kick(5000);
  return{kick};
}

loadLocal();render();restoreRun();initRemote();
})();
