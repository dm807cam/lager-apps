<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Satchel</title>
<style>
:root{
  --bg:#f2f0f3; --surface:#fff; --surface-2:#f8f6f8; --hover:#efeaee; --ink:#231a20; --muted:#6f6369; --line:#e3dde1;
  --brand:#7a2236; --brand-hover:#651b2c; --brand-ink:#fff; --brand-soft:#f4e4e8; --brand-text:#7a2236;
  --brass:#b7851b; --danger:#b3261e; --ok:#2f6b3f; --shadow:0 12px 32px rgba(40,16,26,.16);
  --k-image:#2c7a6a; --k-video:#4a53a8; --k-audio:#a3611a; --k-doc:#7a2236; --k-archive:#8a6a12; --k-code:#4d5a66; --k-other:#6f6369;
  --side:252px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151015; --surface:#1f181e; --surface-2:#261e25; --hover:#2c232b; --ink:#f2ebef; --muted:#a99ba3; --line:#362c34;
  --brand:#a1344d; --brand-hover:#b23e58; --brand-soft:#3b1f29; --brand-text:#f08da0;
  --brass:#e0b54b; --danger:#f2766b; --ok:#7cc48d; --shadow:0 14px 40px rgba(0,0,0,.5);
  --k-image:#5cc0aa; --k-video:#8d95ee; --k-audio:#e7a15a; --k-doc:#f08da0; --k-archive:#e0b54b; --k-code:#9fb0bf; --k-other:#a99ba3;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface-2)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:650;font-size:18px;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;text-align:left;color:var(--ink)}
.nav:hover{background:var(--hover)}
.nav[aria-current=page]{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.nav .count{margin-left:auto;color:var(--muted);font-size:13px;font-weight:400}
.side .upload{margin:0 0 14px}
.meter{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.meter b{color:var(--ink);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:16px 28px 10px;display:flex;flex-direction:column;gap:12px}
.row1{display:flex;align-items:center;gap:12px;min-width:0}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;font-size:21px;font-weight:650;letter-spacing:-.015em}
.crumbs button{border:0;background:none;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch;font-weight:inherit}
.crumbs button:hover{background:var(--hover)}
.crumbs .sep{color:var(--muted);font-weight:400}
.crumbs .cur{padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ib.back{display:none}
.search{position:relative;width:min(320px,40vw)}
.search input{width:100%;height:38px;padding:0 12px 0 36px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.search input:focus{outline:none;border-color:var(--brass)}
.search svg{position:absolute;left:10px;top:9px;color:var(--muted)}
.row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:15px;background:var(--surface);font-size:13px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tools{display:flex;gap:4px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:550;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.ib{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;border-radius:8px;background:none;color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib[aria-pressed=true]{color:var(--ink);background:var(--hover)}

/* ---------- list ---------- */
.content{padding:4px 28px 120px;flex:1}
.head,.item{display:grid;grid-template-columns:28px 40px minmax(0,1fr) 150px 120px 90px 36px;align-items:center;gap:12px}
.team .head,.team .item{grid-template-columns:28px 40px minmax(0,1fr) 140px 150px 120px 90px 36px}
.head{padding:6px 10px;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
.head button{border:0;background:none;padding:0;color:inherit;font:inherit;display:inline-flex;gap:4px;align-items:center}
.head button[aria-sort]{color:var(--ink);font-weight:600}
.item{position:relative;padding:7px 10px;border-bottom:1px solid var(--line);cursor:default;user-select:none;-webkit-user-select:none}
.item:hover{background:var(--hover)}
.item.sel{background:var(--brand-soft)}
.item .name{min-width:0;display:flex;flex-direction:column}
.item .name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .name .t{font-weight:500}
.item .name .sub{display:none;color:var(--muted);font-size:12.5px}
.item .name .where{color:var(--muted);font-size:12.5px}
.item .c{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .open{position:absolute;inset:0;border:0;background:none;padding:0;z-index:0}
.item>*:not(.open){position:relative;z-index:1}
.item .name{pointer-events:none}
.check{width:20px;height:20px;border:1.6px solid var(--muted);border-radius:5px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0;opacity:.0}
.item:hover .check,.check:focus-visible,.selecting .check,.check[aria-checked=true]{opacity:1}
.check[aria-checked=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.check svg{width:14px;height:14px;stroke-width:3;display:none}
.check[aria-checked=true] svg{display:block}
.glyph{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--kc) 14%,transparent);color:var(--kc);overflow:hidden;position:relative}
.glyph img{width:100%;height:100%;object-fit:cover;display:block}
.glyph .ext{position:absolute;bottom:3px;font-size:8.5px;font-weight:700;letter-spacing:.02em}
.glyph.folder{background:none;color:var(--brass)}
.glyph.folder svg{width:30px;height:30px;fill:color-mix(in srgb,var(--brass) 22%,transparent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;padding-top:12px}
.card{position:relative;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;user-select:none;-webkit-user-select:none}
.card:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.card.sel{outline:2px solid var(--brand);outline-offset:-1px}
.card .open{position:absolute;inset:0;border:0;background:none;z-index:0}
.card .pic{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--kc) 10%,var(--surface-2));color:var(--kc);pointer-events:none}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .pic svg.i{width:38px;height:38px;stroke-width:1.4}
.card .pic.folder{color:var(--brass);background:var(--surface-2)}
.card .pic.folder svg.i{width:56px;height:56px;fill:color-mix(in srgb,var(--brass) 20%,transparent)}
.card .meta{padding:8px 10px 10px;pointer-events:none;min-width:0}
.card .meta .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .check{position:absolute;top:8px;left:8px;z-index:1}
.card .more{position:absolute;top:4px;right:4px;z-index:1;background:color-mix(in srgb,var(--surface) 80%,transparent)}

.empty{max-width:440px;margin:64px auto;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:19px;margin:16px 0 6px;font-weight:650}
.empty p{margin:0 0 18px}
.empty .art{width:120px;height:96px;margin:0 auto;color:var(--brass)}
.note{padding:10px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:13.5px;margin:12px 0}
.banner{margin:0 28px 8px;padding:10px 14px;border-radius:8px;background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--ink);font-size:14px}

/* ---------- selection bar ---------- */
.selbar{position:fixed;left:50%;bottom:24px;transform:translateX(calc(-50% + var(--side)/2));z-index:35;display:flex;align-items:center;gap:4px;padding:6px 6px 6px 16px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);max-width:calc(100vw - 24px)}
.selbar .ib{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.selbar .ib:hover{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}
.selbar .n{font-weight:600;margin-right:8px;white-space:nowrap}

/* ---------- luggage tag (share links) ---------- */
.tag{position:relative;display:flex;margin-left:26px;min-height:96px;background:var(--brand);color:#fff;border-radius:0 14px 14px 0}
.tag::before{content:"";position:absolute;left:-26px;top:0;bottom:0;width:27px;background:inherit;clip-path:polygon(100% 0,100% 100%,0 calc(100% - 26px),0 26px)}
.tag .eye{position:relative;flex:none;width:30px;display:flex;align-items:center;justify-content:flex-start;margin-left:-14px;border-right:2px dashed rgba(255,255,255,.28)}
.tag .eye::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 3px var(--brass)}
.tag .body{flex:1;min-width:0;padding:14px 16px 14px 16px;display:flex;flex-direction:column;gap:4px}
.tag .ttl{font-weight:650;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:rgba(255,255,255,.8)}
.tag .facts span{display:inline-flex;align-items:center;gap:5px}
.tag .facts svg.i{width:14px;height:14px}
.tag .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag .acts .btn{height:32px;padding:0 11px;font-size:13.5px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}
.tag .acts .btn:hover{background:rgba(255,255,255,.22)}
.tag.dead{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.tag.dead::before{background:var(--line)}
.tag.dead .facts{color:var(--muted)}
.tag.dead .eye{border-color:var(--line)}
.tag.dead .acts .btn{background:var(--surface);border-color:var(--line);color:var(--ink)}
.tags{display:flex;flex-direction:column;gap:14px;max-width:720px;padding-top:12px}
.string{position:absolute;left:-60px;top:50%;width:52px;height:60px;margin-top:-58px;pointer-events:none;color:var(--brass)}

/* ---------- recipient page ---------- */
.recv{max-width:760px;margin:0 auto;padding:40px 20px 120px}
.recv .hero{transform:rotate(-1.2deg);margin:18px 0 34px 40px}
.recv .hero .tag{min-height:150px}
.recv .hero .ttl{font-size:24px;white-space:normal;letter-spacing:-.015em}
.recv .hero .msg{white-space:pre-wrap;font-size:15px;color:rgba(255,255,255,.92);margin:4px 0 2px;overflow-wrap:anywhere}
.recv .top-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.recv .listbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.recv .listbar h2{font-size:15px;margin:0;color:var(--muted);font-weight:500}
.recv .item{grid-template-columns:40px minmax(0,1fr) 90px auto}
.recv .acts2{display:flex;gap:2px}
.pwbox{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.small{font-size:13px;color:var(--muted)}

/* ---------- forms, dialogs, menus ---------- */
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(480px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(24,10,18,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg h2{margin:0;padding:20px 22px 6px;font-size:18px;font-weight:650}
.dlg .bd{padding:8px 22px 4px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg .bd p{margin:0;color:var(--muted)}
.dlg .ft{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px 20px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:550}
label.f .hint{font-weight:400;color:var(--muted)}
.in{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
textarea.in{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.in:focus{outline:none;border-color:var(--brass);background:var(--surface)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px}
.seg button[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.err{color:var(--danger);font-size:13.5px;min-height:1em}
.linkbox{display:flex;gap:8px}
.linkbox .in{font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tree{border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;padding:4px}
.tree button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 8px;border-radius:6px;text-align:left}
.tree button:hover{background:var(--hover)}
.tree button[aria-pressed=true]{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.tree button:disabled{opacity:.4;cursor:default}
.tree svg.i{color:var(--brass)}
.menu{position:fixed;z-index:60;min-width:210px;padding:6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:7px;background:none;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}

/* ---------- preview ---------- */
dialog.pv{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;background:#100b0e;color:#f2ebef}
.pvw{display:flex;flex-direction:column;height:100%}
.pvh{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.pvh .ib{color:#cdbfc6}
.pvh .ib:hover{background:rgba(255,255,255,.1);color:#fff}
.pvh .t{flex:1;min-width:0}
.pvh .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pvh .t small{color:#a99ba3}
.pvb{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 56px 20px}
.pvb img,.pvb video{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.pvb audio{width:min(520px,100%)}
.pvb iframe{width:100%;height:100%;border:0;background:#fff;border-radius:4px}
.pvb pre{width:100%;max-width:960px;height:100%;margin:0;overflow:auto;padding:18px 20px;background:#1b1418;border-radius:8px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#eadfe5}
.pvb .tbl{width:100%;max-width:1100px;height:100%;overflow:auto;background:#1b1418;border-radius:8px}
.pvb table{border-collapse:collapse;font-size:13px}
.pvb td,.pvb th{border:1px solid #3a2e35;padding:5px 9px;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis;text-align:left}
.pvb th{background:#261d22;position:sticky;top:0}
.pvb .nav-l,.pvb .nav-r{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center}
.pvb .nav-l{left:6px}.pvb .nav-r{right:6px}
.pvb .nav-l:hover,.pvb .nav-r:hover{background:rgba(255,255,255,.18)}
.pvmsg{text-align:center;color:#cdbfc6;display:flex;flex-direction:column;align-items:center;gap:14px}
.pvmsg .big{width:84px;height:84px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);color:var(--kc)}
.pvmsg .big svg.i{width:40px;height:40px;stroke-width:1.4}
.bar{height:4px;border-radius:2px;background:rgba(127,127,127,.25);overflow:hidden;width:220px}
.bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .2s}

/* ---------- uploads tray, toasts, drop ---------- */
.tray{position:fixed;right:20px;bottom:20px;z-index:30;width:360px;max-width:calc(100vw - 24px);border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.tray .th{display:flex;align-items:center;gap:6px;padding:10px 8px 10px 16px;font-weight:600}
.tray .th span{flex:1}
.tray .tl{max-height:260px;overflow:auto;border-top:1px solid var(--line)}
.tray .tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 8px 9px 16px;border-bottom:1px solid var(--line)}
.tray .tr:last-child{border-bottom:0}
.tray .tr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.tray .tr .st{font-size:12.5px;color:var(--muted)}
.tray .tr .st.bad{color:var(--danger)}
.tray .tr .bar{width:100%;grid-column:1}
.tray .tr .ib{grid-row:1/span 2;grid-column:2;width:32px;height:32px}
.tray.min .tl{display:none}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:14px;max-width:calc(100vw - 24px)}
.toast.bad{background:var(--danger);color:#fff}
.toast button{border:0;background:none;color:inherit;font-weight:650;padding:4px 6px;text-decoration:underline}
#drop{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--brand) 86%,transparent);display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none}
#drop[hidden]{display:none}
#drop div{border:3px dashed rgba(255,255,255,.6);border-radius:24px;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:22px;font-weight:650;text-align:center}
#drop small{font-size:15px;font-weight:400;opacity:.85}
.tabbar,.fab{display:none}
.center{display:flex;align-items:center;justify-content:center;min-height:60dvh;color:var(--muted)}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--brass);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.bar i{transition:none}}

/* ---------- small screens ---------- */
@media (max-width:1100px){
  .head,.item{grid-template-columns:28px 40px minmax(0,1fr) 120px 80px 36px}

      : j.state === "error" ? h("button", { class: "ib", "aria-label": "Retry " + j.name, onclick: () => startJob(j) }, svg("retry"))
      : j.state === "done" ? h("span", { class: "ib", style: "color:var(--ok)" }, svg("check")) : h("span");
    return h("div", { class: "tr" }, h("div", { class: "nm" }, j.name), btn,
      j.state === "uploading" ? h("div", { class: "bar" }, h("i", { style: `width:${Math.round(j.progress * 100)}%` })) : h("div", { class: "st" + (j.state === "error" ? " bad" : "") }, st));
  });
  const fresh = h("section", { class: "tray" + (trayMin ? " min" : ""), id: "tray", "aria-label": "Uploads" },
    h("div", { class: "th" }, h("span", { role: "status" }, title),
      h("button", { class: "ib", "aria-label": trayMin ? "Show uploads" : "Hide upload list", onclick: () => { trayMin = !trayMin; drawTray(); } }, svg(trayMin ? "up" : "down")),
      !active.length ? h("button", { class: "ib", "aria-label": "Close", onclick: () => { jobs.length = 0; drawTray(); } }, svg("x")) : null),
    h("div", { class: "tl" }, rows));
  clearTimeout(trayCloseTimer);
  if (!active.length && !errs) trayCloseTimer = setTimeout(() => { if (jobs.every(j => j.state === "done" || j.state === "cancelled")) { jobs.length = 0; drawTray(); } }, 5000);
  const sc = tray && $(".tl", tray) ? $(".tl", tray).scrollTop : 0;
  tray ? tray.replaceWith(fresh) : document.body.append(fresh);
  $(".tl", fresh).scrollTop = sc;
}

function addFiles(list, withDirs) {

/* drag and drop, with folders */
let dragDepth = 0;
const isFileDrag = e => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
window.addEventListener("dragenter", e => {
  if (!isFileDrag(e) || !me.canWrite || S.route.link) return;
  e.preventDefault(); dragDepth++;
  const { sp, folder } = uploadTarget();
  $("#drop-t").textContent = "Drop to upload";
  $("#drop-s").textContent = "to " + [spaceName(sp), ...pathOf(sp, folder).map(d => d.name)].join(" / ");

});
window.addEventListener("dragover", e => { if (isFileDrag(e) && me.canWrite && !S.route.link) e.preventDefault(); });

window.addEventListener("drop", async e => {
  if (!isFileDrag(e)) return;
  e.preventDefault(); dragDepth = 0; $("#drop").hidden = true;
  if (!me.canWrite || S.route.link) return;
  const items = [...(e.dataTransfer.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!items.length) return addFiles([...e.dataTransfer.files]);
  const out = [];
  const readAll = r => new Promise(res => { const acc = []; const next = () => r.readEntries(b => { if (!b.length) return res(acc); acc.push(...b); next(); }, () => res(acc)); next(); });
  const walk = async (entry, dirs) => {
    if (entry.isFile) { const file = await new Promise((res, rej) => entry.file(res, rej)).catch(() => null); if (file) out.push({ file, dirs }); }
    else if (entry.isDirectory) { for (const c of await readAll(entry.createReader())) await walk(c, [...dirs, entry.name]); }
  };
  for (const en of items) await walk(en, []);
  addFiles(out);
});
document.addEventListener("paste", e => {

});

async function downloadFile(f) {
  const t = toast(`Preparing ${f.name}…`, { ms: 600000 });
  try { saveBlob(await getBlob(refOf(f)), f.name); hitFor(null); }
  catch (e) { fail(e); }
  finally { t.remove(); }
}
async function downloadMany(entries, zipName) {
  if (entries.length === 1 && !entries[0].path.includes("/")) return downloadFile(entries[0].f);
  if (!entries.length) return toast("There's nothing to download here.");
  const total = entries.reduce((s, e) => s + (e.f.size || 0), 0);
  const label = h("span", null, `Preparing ${plural(entries.length, "file", "files")}…`);
  const t = toast("", { ms: 600000 }); t.firstChild.replaceWith(label);
  try {
    let got = 0; const parts = [];
    for (const e of entries) {
      const blob = await getBlob(refOf(e.f));
      got += e.f.size || 0;
      label.textContent = `Preparing ${Math.round(got / (total || 1) * 100)}%`;
      parts.push({ path: e.path, blob, mtime: e.f.updatedAt || e.f.createdAt });
    }
    label.textContent = "Packing zip…";
    saveBlob(await makeZip(parts), zipName.replace(/[\/\\]/g, "-") + ".zip");
  } catch (e) { fail(e); }
  finally { t.remove(); }
}
async function renameItem(sp, x, isDir) {
  const v = await ask({ title: isDir ? "Rename folder" : "Rename file", label: "Name", value: x.name, stem: !isDir, validate: nameError });
  if (!v || v === x.name) return;
  const parent = isDir ? parentOf(sp, x) : folderOfFile(sp, x);
  const clash = (isDir ? childrenOf(sp, parent).dirs : childrenOf(sp, parent).files).some(y => y.id !== x.id && y.name.toLowerCase() === v.toLowerCase());
  if (clash) return toast(`There's already ${isDir ? "a folder" : "a file"} called “${v}” here.`, { bad: true });
  await db.doc(`${isDir ? P.folders(sp) : P.files(sp)}/${x.id}`).update({ name: v, updatedAt: Date.now() }).catch(fail);
}
async function newFolder() {
  const sp = S.route.space === "team" ? "team" : "mine";
  const v = await ask({ title: "New folder", label: "Name", value: uniqueName(sp, S.route.folder, "New folder", true), ok: "Create folder", validate: nameError });
  if (!v) return;
  try { await createFolder(sp, S.route.folder, v); render(); } catch (e) { fail(e); }

async function deleteFileMeta(sp, f, keepBlob) {
  await retry(() => db.doc(`${P.files(sp)}/${f.id}`).delete());
  filesOf(sp).delete(f.id);
  if (!keepBlob && f.blob && f.blob.o === me.id) {
    const still = ["mine", "team"].some(s => [...filesOf(s).values()].some(y => y.blob && y.blob.id === f.blob.id && y.blob.o === me.id));
    if (!still) deleteBlob(f.blob.id).catch(() => {});
  }
}
async function deleteItems(sp, keys) {
  const dirs = [], fls = [];
  keys.forEach(k => { const [t, id] = k.split(":"); if (t === "d" && foldersOf(sp).get(id)) dirs.push(foldersOf(sp).get(id)); if (t === "f" && filesOf(sp).get(id)) fls.push(filesOf(sp).get(id)); });
  const allFiles = [...fls], allDirs = [...dirs];
  dirs.forEach(d => { const r = descend(sp, d.id); allFiles.push(...r.files.map(x => x.f)); allDirs.push(...r.dirs); });
  const inLinks = countInLinks(allFiles);
  const what = allDirs.length && allFiles.length ? `${plural(allDirs.length, "folder", "folders")} and ${plural(allFiles.length, "file", "files")}` : allDirs.length ? plural(allDirs.length, "folder", "folders") : plural(allFiles.length, "file", "files");
  const one = keys.length === 1 ? (dirs[0] || fls[0]).name : null;
  const text = (one ? `“${one}”${dirs.length ? (allFiles.length ? ` and the ${plural(allFiles.length, "file", "files")} in it` : "") : ""}` : what) +
    (sp === "team" ? " will be deleted for everyone in Team." : " will be deleted.") + " This can't be undone." +
    (inLinks ? ` ${inLinks === 1 ? "A share link includes" : "Share links include"} some of these files; they'll stop working for them.` : "");
  if (!await confirmD({ title: one ? `Delete ${dirs.length ? "folder" : "file"}?` : `Delete ${what}?`, text, ok: "Delete" })) return;
  S.sel.clear(); render();
  try {
    for (const f of allFiles) await deleteFileMeta(sp, f);
    for (const d of allDirs.reverse()) { await retry(() => db.doc(`${P.folders(sp)}/${d.id}`).delete()); foldersOf(sp).delete(d.id); }
    toast(one ? `Deleted “${one}”` : `Deleted ${what}`);
  } catch (e) { fail(e); }
  render();
}
function countInLinks(files) {
  const ids = new Set(files.map(f => f.blob && f.blob.id));
  let n = 0;
  for (const r of S.links.values()) if (!r.purged && (r.blobIds || []).some(b => ids.has(b))) n++;
  return n;
}

/* moving, also between My files and Team */
async function moveDialog(sp, keys) {
  const items = keys.map(k => { const [t, id] = k.split(":"); return t === "d" ? { t, x: foldersOf(sp).get(id) } : { t, x: filesOf(sp).get(id) }; }).filter(i => i.x);
  if (!items.length) return;
  const banned = new Set();
  items.filter(i => i.t === "d").forEach(i => { banned.add(i.x.id); descend(sp, i.x.id).dirs.forEach(d => banned.add(d.id)); });
  let target = sp, dest = null;

    const rows = [];
    const add = (fid, depth) => {
      const kids = childrenOf(target, fid).dirs.sort((a, b) => collator.compare(a.name, b.name));
      kids.forEach(d => {

        if (!bad) add(d.id, depth + 1);
      });
    };
    rows.push(h("button", { type: "button", "aria-pressed": String(dest === null), onclick: () => { dest = null; drawTree(); } }, svg(target === "team" ? "users" : "box"), spaceName(target)));

    tree.replaceChildren(...rows);
  };
  drawTree();
  const label = items.length === 1 ? `“${items[0].x.name}”` : plural(items.length, "item", "items");
  const ok = await dialog({ title: `Move ${label}`, body: [seg, tree, h("p", { class: "small" }, "Moving between My files and Team changes who can see the files.")], actions: [{ label: "Cancel" }, { label: "Move here", primary: true, value: true }] });
  if (!ok) return;

  try {
    if (target === sp) {
      for (const i of items) {
        if (i.t === "d") { if (parentOf(sp, i.x) === dest) continue; const name = uniqueName(sp, dest, i.x.name, true, i.x.id); await db.doc(`${P.folders(sp)}/${i.x.id}`).update({ parent: dest, name, updatedAt: Date.now() }); }
        else { if (folderOfFile(sp, i.x) === dest) continue; const name = uniqueName(sp, dest, i.x.name, false, i.x.id); await db.doc(`${P.files(sp)}/${i.x.id}`).update({ folder: dest, name, updatedAt: Date.now() }); }
      }
      toast(`Moved ${label}`);
    } else {
      const t = toast(`Moving ${label} to ${spaceName(target)}…`, { ms: 600000 });
      try { for (const i of items) i.t === "d" ? await transferFolder(sp, i.x, target, dest) : await transferFile(sp, i.x, target, dest); }
      finally { t.remove(); }
      toast(`Moved ${label} to ${spaceName(target)}`);
    }
  } catch (e) { fail(e); }
  render();
}
async function transferFile(from, f, to, dest) {
  const now = Date.now();
  let blob = f.blob, key = f.key, thumb = !!f.thumb;
  if (f.blob.o !== me.id) {          // someone else's upload: store my own encrypted copy first
    const data = await getBlob(refOf(f));
    const r = await uploadBlob(new File([data], f.name, { type: f.type }));
    blob = { o: me.id, id: r.bid }; key = r.key; thumb = r.thumb;
  }
  const name = uniqueName(to, dest, f.name, false);
  const meta = { name, type: f.type, size: f.size, folder: dest || null, key, blob, thumb, createdAt: f.createdAt || now, updatedAt: now, by: f.by || me.id, byName: f.byName || me.name };
  const id = newId();
  await retry(() => db.doc(`${P.files(to)}/${id}`).set(meta));
  filesOf(to).set(id, { ...meta, id });
  await deleteFileMeta(from, f, f.blob.o === me.id);
}
async function transferFolder(from, d, to, dest) {
  const nid = await createFolder(to, dest, d.name);
  const c = childrenOf(from, d.id);
  for (const f of c.files) await transferFile(from, f, to, nid);
  for (const sub of c.dirs) await transferFolder(from, sub, to, nid);
  await retry(() => db.doc(`${P.folders(from)}/${d.id}`).delete());
  foldersOf(from).delete(d.id);
}

const EXPIRY = [["1 hour", 3600e3], ["1 day", 864e5], ["7 days", 7 * 864e5], ["30 days", 30 * 864e5], ["Never", 0]];
const linkUrl = (lid, secret) => `${location.origin}${location.pathname}#l=${encodeURIComponent(lid)}&o=${encodeURIComponent(me.id)}&k=${secret}`;
async function shareDialog(sp, keys) {
  const entries = []; let title = "";
  const dirs = [];
  keys.forEach(k => {
    const [t, id] = k.split(":");
    if (t === "f" && filesOf(sp).get(id)) entries.push({ f: filesOf(sp).get(id), path: filesOf(sp).get(id).name });
    if (t === "d" && foldersOf(sp).get(id)) { const d = foldersOf(sp).get(id); dirs.push(d); entries.push(...descend(sp, d.id, keys.length > 1 ? d.name + "/" : "").files); }
  });
  if (!entries.length) return toast(dirs.length ? "This folder is empty. Add files before sharing it." : "Choose files to share.", { bad: true });
  if (entries.length > 500) return toast("A link can hold up to 500 files. Share fewer at once.", { bad: true });
  title = keys.length === 1 ? (dirs[0] ? dirs[0].name : entries[0].f.name) : plural(entries.length, "file", "files");
  const total = entries.reduce((s, e) => s + (e.f.size || 0), 0);
  let exp = 7 * 864e5;
  const tIn = h("input", { class: "in", value: title, maxlength: 120, "data-select": "no" });
  const mIn = h("textarea", { class: "in", maxlength: 1000, placeholder: "Add a note for the people you send this to" });
  const pIn = h("input", { class: "in", type: "password", autocomplete: "new-password", placeholder: "No password" });
  const seg = h("div", { class: "seg", role: "group", "aria-label": "Link expires after" });
  const drawSeg = () => seg.replaceChildren(...EXPIRY.map(([l, v]) => h("button", { type: "button", "aria-pressed": String(exp === v), onclick: () => { exp = v; drawSeg(); } }, l)));
  drawSeg();
  const err = h("div", { class: "err" });
  const lid = await dialog({
    title: "Create share link",
    body: [
      h("p", null, `${plural(entries.length, "file", "files")}, ${fmtSize(total)}.` + (dirs.length ? " Files you add to the folder later aren't included." : "")),
      h("label", { class: "f" }, "Title", tIn),
      h("label", { class: "f" }, h("span", null, "Note ", h("span", { class: "hint" }, "optional")), mIn),
      h("div", { class: "f", style: "display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:550" }, "Expires after", seg),
      h("label", { class: "f" }, h("span", null, "Password ", h("span", { class: "hint" }, "optional, send it separately")), pIn),
      err
    ],
    actions: [{ label: "Cancel" }, { label: "Create link", primary: true, run: async (close, b) => {
      b.textContent = "Creating…";
      try { return await createLink({ title: tIn.value.trim() || title, message: mIn.value.trim(), expiresIn: exp, password: pIn.value, entries }); }
      catch (e) { err.textContent = explain(e); b.textContent = "Create link"; return false; }
    } }]
  });
  if (lid) { S.sel.clear(); render(); showLink(lid, true); }
}
async function createLink({ title, message, expiresIn, password, entries }) {
  const lid = newId(), secret = b64.url(rand(32)), now = Date.now();
  const expiresAt = expiresIn ? now + expiresIn : null;
  let keyStr = secret, pw = null;
  if (password) { const salt = b64.enc(rand(16)); pw = { salt, iter: PW_ITER }; keyStr = await passwordKey(password, salt, secret, PW_ITER); }
  const payload = { v: 1, title, message, from: me.name || "Someone", createdAt: now, items: entries.map(e => ({ name: e.f.name, path: e.path, type: e.f.type, size: e.f.size, key: e.f.key, o: e.f.blob.o, id: e.f.blob.id, thumb: !!e.f.thumb, mtime: e.f.updatedAt || e.f.createdAt })) };
  const box = await seal(await aesKey(keyStr), enc.encode(JSON.stringify(payload)), `link/${me.id}/${lid}`);
  await retry(() => db.doc(P.link(me.id, lid)).set({ v: 1, createdAt: now, expiresAt, pw, box }));
  const rec = { secret, title, count: entries.length, size: entries.reduce((s, e) => s + (e.f.size || 0), 0), names: entries.slice(0, 3).map(e => e.f.name), blobIds: entries.map(e => e.f.blob.id), password: !!password, createdAt: now, expiresAt };
  try { await retry(() => db.doc(`${P.linkRecs()}/${lid}`).set(rec)); }
  catch (e) { db.doc(P.link(me.id, lid)).delete().catch(() => {}); throw e; }
  S.links.set(lid, { ...rec, id: lid });
  return lid;
}
async function shareUrl(url, title) {
  if (navigator.share && matchMedia("(pointer:coarse)").matches) { try { await navigator.share({ title, url }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  (await copyText(url)) ? toast("Link copied") : toast("Couldn't copy. Select the link and copy it yourself.", { bad: true });
}
function showLink(lid, fresh) {
  const r = S.links.get(lid); if (!r) return;
  const url = linkUrl(lid, r.secret);
  const inp = h("input", { class: "in", value: url, readonly: true, "aria-label": "Share link", onfocus: e => e.target.select() });
  dialog({
    title: fresh ? "Your link is ready" : r.title,
    body: [
      tagFor(lid, r, { compact: true }),
      h("div", { class: "linkbox" }, inp, h("button", { type: "button", class: "btn", onclick: async () => (await copyText(url)) ? toast("Link copied") : inp.select() }, svg("copy"), "Copy")),
      h("p", { class: "small" }, r.password
        ? "The link opens only with the password. Send the password another way, for example in a message instead of the e-mail."
        : "Anyone who has this link and can open this Satchel can see these files. The key is part of the link, so the server only ever stores them encrypted."),
    ],
    actions: [navigator.share ? { label: "Share…", run: () => { shareUrl(url, r.title); return false; } } : null, { label: "Done", primary: true }].filter(Boolean)
  });
}
async function revokeLink(lid) {
  const r = S.links.get(lid);
  const dead = r && (r.purged || (r.expiresAt && r.expiresAt < Date.now()));
  if (!dead && !await confirmD({ title: "Delete link?", text: `“${r ? r.title : "This link"}” will stop working right away for everyone who has it. Your files stay where they are.`, ok: "Delete link" })) return;
  try {
    await retry(() => db.doc(P.link(me.id, lid)).delete());
    await retry(() => db.doc(`${P.linkRecs()}/${lid}`).delete());
    S.links.delete(lid); render();
    toast("Link deleted");
    db.collection("hits").where("o", "==", me.id).where("l", "==", lid).limit(1000).get().then(s => s.docs.forEach(d => db.doc("hits/" + d.id).delete().catch(() => {}))).catch(() => {});
  } catch (e) { fail(e); }
}
let currentLink = null;
function hitFor(kind) {
  if (!currentLink || currentLink.o === me.id) return;
  const k = kind || "dl";
  if (currentLink.counted.has(k)) return;
  currentLink.counted.add(k);
  db.collection("hits").add({ l: currentLink.l, o: currentLink.o, e: k, at: Date.now() }).catch(() => {});
}

/* luggage tag */
function tagFor(lid, r, { compact } = {}) {
  const expired = r.purged || (r.expiresAt && r.expiresAt < Date.now());
  const hits = S.hits.get(lid) || { open: 0, dl: 0 };
  const facts = h("div", { class: "facts" },
    h("span", null, svg("file"), `${plural(r.count || 0, "file", "files")}, ${fmtSize(r.size || 0)}`),
    h("span", null, svg("clock"), r.expiresAt ? fmtUntil(r.expiresAt) : "No expiry"),
    r.password ? h("span", null, svg("lock"), "Password") : null,
    !compact ? h("span", null, svg("eye"), `${plural(hits.open, "open", "opens")}, ${plural(hits.dl, "download", "downloads")}`) : null);
  const acts = compact ? null : h("div", { class: "acts" },
    !expired ? h("button", { class: "btn", onclick: () => showLink(lid) }, svg("link"), "Show link") : null,
    !expired ? h("button", { class: "btn", onclick: () => shareUrl(linkUrl(lid, r.secret), r.title) }, svg("copy"), navigator.share && matchMedia("(pointer:coarse)").matches ? "Share" : "Copy") : null,
    h("button", { class: "btn", onclick: () => revokeLink(lid) }, svg("trash"), "Delete"));
  return h("div", { class: "tag" + (expired ? " dead" : "") },
    compact ? null : stringSvg(),
    h("div", { class: "eye" }),

function emptyState(sp, flat) {

    h("button", { class: "btn", onclick: () => { S.q = ""; S.kind = "all"; render(); } }, "Clear filters"));
  if (S.route.folder) return h("div", { class: "empty" }, emptyArt(), h("h2", null, "This folder is empty"), h("p", null, "Drop files here or upload them."), h("button", { class: "btn primary", onclick: pickFiles }, svg("upload"), "Upload files"));

function drawLinks() {

/* =====================================================================
   Recipient page
   ===================================================================== */
async function openLink(ref) {
  currentLink = null;
  const bar = h("div", { class: "top-actions" },
    h("div", { class: "brand", style: "padding:0" }, brandMark(), "Satchel"),
    me.canWrite ? h("button", { class: "btn", onclick: () => navigate("mine", null) }, svg("box"), "My files") : null);
  const page = h("div", { class: "recv" }, bar);
  const body = h("div");
  page.append(body);
  app.replaceChildren(page);
  const stop = (title, text) => body.replaceChildren(h("div", { class: "empty" }, emptyArt(), h("h2", null, title), h("p", null, text)));
  if (!SEG.test(ref.l) || !SEG.test(ref.o) || !/^[A-Za-z0-9_-]{43}$/.test(ref.k)) return stop("This link is incomplete", "Part of the address is missing. Ask the person who sent it to copy the whole link again.");
  body.replaceChildren(h("div", { class: "center" }, h("div", { class: "spin", role: "status", "aria-label": "Loading" })));
  let snap;
  try { snap = await retry(() => db.doc(P.link(ref.o, ref.l)).get()); }
  catch (e) { return stop("This link can't be opened right now", explain(e)); }
  if (!snap.exists) return stop("This link doesn't work any more", "The person who shared it deleted it or it expired. Ask them for a new link.");
  const doc = snap.data();
  if (doc.expiresAt && doc.expiresAt < Date.now()) return stop("This link has expired", `It was available until ${dfFull.format(new Date(doc.expiresAt))}. Ask the person who shared it for a new link.`);
  const aad = `link/${ref.o}/${ref.l}`;
  const decryptWith = async keyStr => JSON.parse(dec.decode(await unseal(await aesKey(keyStr), doc.box, aad)));
  let data;
  if (doc.pw) {
    data = await new Promise(resolve => {
      const pin = h("input", { class: "in", type: "password", autocomplete: "current-password", "aria-label": "Password" });
      const err = h("div", { class: "err", role: "alert" });
      const btn = h("button", { class: "btn primary wide", type: "submit" }, "Open");
      const form = h("form", { class: "pwbox" }, emptyArt(), h("h2", { style: "text-align:center;margin:4px 0" }, "This link has a password"), h("p", { class: "small", style: "text-align:center;margin:0 0 6px" }, "The person who shared it should have sent it to you separately."), pin, btn, err);
      form.addEventListener("submit", async e => {
        e.preventDefault(); if (!pin.value) return pin.focus();
        btn.disabled = true; btn.textContent = "Checking…"; err.textContent = "";
        try { resolve(await decryptWith(await passwordKey(pin.value, doc.pw.salt, ref.k, doc.pw.iter || PW_ITER))); }
        catch { err.textContent = "That password isn't right. Check it and try again."; btn.disabled = false; btn.textContent = "Open"; pin.select(); }
      });
      body.replaceChildren(form); pin.focus();
    });
  } else {
    try { data = await decryptWith(ref.k); }
    catch { return stop("This link can't be opened", "The key in the address doesn't fit. Ask the person who sent it to copy the whole link again."); }
  }
  if (!data || !Array.isArray(data.items)) return stop("This link can't be opened", "Its contents are damaged.");
  const items = data.items.filter(x => x && typeof x.name === "string" && typeof x.key === "string" && SEG.test(String(x.o)) && SEG.test(String(x.id))).slice(0, 500)
    .map(x => ({ f: { id: x.id, name: x.name.slice(0, 255), path: String(x.path || x.name).slice(0, 1000), type: String(x.type || ""), size: +x.size || 0, key: x.key, blob: { o: x.o, id: x.id }, thumb: !!x.thumb, updatedAt: +x.mtime || 0 } }));
  currentLink = { ...ref, counted: new Set() };
  hitFor("open");
  const total = items.reduce((s, i) => s + i.f.size, 0);
  const hero = h("div", { class: "hero" }, h("div", { class: "tag" },
    h("div", { class: "eye" }),
    h("div", { class: "body", style: "padding:20px 22px" },
      h("div", { class: "facts" }, h("span", null, `From ${String(data.from || "Someone").slice(0, 80)}`)),
      h("div", { class: "ttl" }, String(data.title || "Shared files").slice(0, 120)),
      data.message ? h("div", { class: "msg" }, String(data.message).slice(0, 1000)) : null,
      h("div", { class: "facts", style: "margin-top:6px" },
        h("span", null, svg("file"), `${plural(items.length, "file", "files")}, ${fmtSize(total)}`),
        h("span", null, svg("clock"), doc.expiresAt ? fmtUntil(doc.expiresAt) : "No expiry"),
        h("span", null, svg("lock"), "End-to-end encrypted")))));
  const zipName = String(data.title || "Shared files").slice(0, 80);
  const listbar = h("div", { class: "listbar" }, h("h2", null, "Files"),
    h("div", { style: "display:flex;gap:8px;flex-wrap:wrap" },
      me.canWrite && ref.o !== me.id ? h("button", { class: "btn", onclick: () => saveToMine(items, zipName) }, svg("save"), "Save to My files") : null,
      items.length > 1 ? h("button", { class: "btn primary", onclick: () => { hitFor("dl"); downloadMany(items.map(i => ({ f: i.f, path: i.f.path })), zipName); } }, svg("download"), "Download all") : null));
  const list = h("div", { role: "list" });
  const pvList = items.map(i => ({ f: i.f }));
  items.forEach((it, idx) => {
    const f = it.f;
    list.append(h("div", { class: "item", role: "listitem" },
      h("button", { class: "open", "aria-label": "Preview " + f.name, onclick: () => preview(pvList, idx, { linkMode: true }) }),
      glyphFor(f, false),
      h("div", { class: "name" }, h("span", { class: "t" }, f.name), f.path !== f.name ? h("span", { class: "where" }, f.path.split("/").slice(0, -1).join(" / ")) : null, h("span", { class: "sub" }, fmtSize(f.size))),
      h("span", { class: "c num" }, fmtSize(f.size)),
      h("div", { class: "acts2" },
        h("button", { class: "ib", "aria-label": "Download " + f.name, title: "Download", onclick: () => { hitFor("dl"); downloadFile(f); } }, svg("download")))));
  });
  body.replaceChildren(hero, listbar, list,
    h("p", { class: "small", style: "margin-top:22px" }, "These files were encrypted before they were stored. Your browser decrypts them with the key in this link; the server can't read them."));
}
async function saveToMine(items, title) {
  const t = toast(`Saving ${plural(items.length, "file", "files")}…`, { ms: 600000 });

    const folder = items.length > 1 ? await createFolder("mine", null, title.replace(/[\/\\]/g, "-") || "Shared files") : null;

      const blob = await getBlob(refOf(it.f));
      const dirs = it.f.path.split("/").slice(0, -1).filter(Boolean);
      enqueue(new File([blob], it.f.name, { type: it.f.type }), "mine", folder, items.length > 1 ? dirs.slice(dirs.length && dirs[0] === title ? 1 : 0) : []);
    }
    toast("Saving to My files. You can follow the progress below.", { action: { label: "Open My files", run: () => navigate("mine", folder) } });
  } catch (e) { fail(e); }
  finally { t.remove(); }
}

    h("div", { class: "top-actions" }, h("div", { class: "brand", style: "padding:0" }, brandMark(), "Satchel")),

      h("p", null, me.id ? "You can open files people share with you here. To keep your own files in this Satchel, ask its owner to let you add files." : "This is where files shared through Satchel open. Use the full link you were sent; it contains the key to the files."))));
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,select,dialog") || S.route.link || !me.canWrite) return;
  if (e.key === "/" && S.route.space !== "links") { e.preventDefault(); S.searching = true; render(); setTimeout(() => $("#q") && $("#q").focus(), 30); }
  if (e.key === "Escape" && S.sel.size) { S.sel.clear(); render(); }
  if ((e.key === "a" && (e.metaKey || e.ctrlKey)) && S.route.space !== "links") { e.preventDefault(); const { dirs, files: f } = visibleItems(S.route.space); dirs.forEach(d => S.sel.add("d:" + d.id)); f.forEach(x => S.sel.add("f:" + x.id)); render(); }
});

/* ---------- start ---------- */
if (me.canWrite) startDrive();
route();
})();
